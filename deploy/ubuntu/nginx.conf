# CARCAR: статичний застосунок з autoservice/app. __DOMAIN__ підставляє setup.sh.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /opt/carcar/autoservice/app;
    index index.html;

    # Службові файли git не віддаємо.
    location ~ /\. { deny all; }

    # Сторінки, service worker і маніфести — завжди свіжі, щоб оновлення приходили одразу.
    location ~* \.(html|webmanifest)$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    # Скрипти й стилі перевіряються на кожному відкритті (застосунок без збірки — імена файлів не змінюються).
    location ~* \.(js|css)$ { add_header Cache-Control "no-cache"; }
    # Шрифти, звук і картинки можна кешувати.
    location ~* \.(woff2|mp3|svg|png|jpg|webp)$ { add_header Cache-Control "public, max-age=604800"; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
}
