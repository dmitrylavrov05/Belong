# CARCAR: статичний застосунок з autoservice/app. __DOMAIN__ підставляє setup.sh.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /opt/carcar/autoservice/app;
    index index.html;

    # Службові файли git не віддаємо.
    location ~ /\. { deny all; }

    # Сторінки, service worker і маніфести — завжди свіжі, щоб оновлення приходили одразу.
    location ~* \.(html|webmanifest)$ {
        add_header Cache-Control "no-cache";
        # Позначка для застосунку: поруч є сервер спільних даних (/api) — усі пристрої бачать ті самі дані.
        sub_filter '</head>' '<meta name="carcar-sync" content="1"></head>';
        sub_filter_once on;
        try_files $uri =404;
    }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    # Скрипти й стилі перевіряються на кожному відкритті (застосунок без збірки — імена файлів не змінюються).
    location ~* \.(js|css)$ { add_header Cache-Control "no-cache"; }
    # Сервер CARCAR (deploy/server): спільні дані, вхід, сповіщення, оплата. Довге опитування — до 25 с.
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        # Справжня адреса відвідувача — для обмеження спроб входу (інакше всі виглядали б як 127.0.0.1).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_buffering off;
        client_max_body_size 20m;
    }

    # Шрифти, звук і картинки можна кешувати.
    location ~* \.(woff2|mp3|svg|png|jpg|webp)$ { add_header Cache-Control "public, max-age=604800"; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
}
