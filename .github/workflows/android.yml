name: Android

on:
  push:
    paths: ["android/**", "firebase/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "firebase/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Firebase emulators
        run: npm install -g firebase-tools@13
      - name: Tests (with the server rules on the emulators) and debug APK
        working-directory: firebase
        run: firebase emulators:exec --project demo-belong --only auth,database "cd ../android && ./gradlew --no-daemon test assembleDebug"
      - uses: actions/upload-artifact@v4
        with:
          name: belong-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
