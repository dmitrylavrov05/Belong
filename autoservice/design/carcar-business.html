.details-table table.t { border: 1px solid var(--line); border-radius: 12px; margin-top: 8px; }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--soft); color: var(--text); white-space: nowrap; }
.pill.carcar { background: var(--series-1-soft); }
.pill.cash { background: var(--series-2-soft); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.muted { color: var(--muted); }
.pill i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.pill.carcar i { background: var(--series-1); }
.pill.cash i { background: var(--series-2); }

.toolbar-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar-row .search { flex: 1; min-width: 220px; background: var(--bg); border: 1px solid var(--line); }
.toolbar-row select { width: auto; height: 44px; border-radius: 12px; border: 1px solid var(--line); background-color: var(--bg); padding: 0 38px 0 12px; font-size: 14px; }

/* ---------- розклад ---------- */

.day-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.day-nav .btn { min-height: 40px; }
.day-nav input[type="date"] { height: 40px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; background: var(--bg); }
.day-nav .day-title { font-size: 18px; font-weight: 700; margin: 0 8px; }
.day-stats { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 14px; margin-bottom: 12px; }
.day-stats b { color: var(--text); }

.sched { overflow-x: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 16px; }
.sched-grid { display: grid; min-width: 640px; }
.sched-head { position: sticky; top: 0; z-index: 2; display: contents; }
.sched-col-head { padding: 10px 12px; font-size: 13px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--bg); }
.sched-times { position: relative; border-right: 1px solid var(--line); }
.sched-times span { position: absolute; left: 0; right: 8px; text-align: right; font-size: 12px; color: var(--muted); transform: translateY(-50%); font-variant-numeric: tabular-nums; }
.sched-col { position: relative; border-right: 1px solid var(--line); background-image: linear-gradient(var(--line) 1px, transparent 1px); }
.sched-col:last-child { border-right: 0; }
.now-line { position: absolute; left: 0; right: 0; height: 2px; background: var(--accent); z-index: 1; pointer-events: none; }
.slot-block {
  position: absolute; left: 4px; right: 4px; z-index: 1; overflow: hidden; text-align: left;
  border: 0; border-radius: 10px; padding: 6px 8px; font: inherit; font-size: 12px; line-height: 1.3; color: var(--text);
  display: flex; flex-direction: column; gap: 1px;
}
.slot-block.carcar { background: var(--series-1-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--series-1) 35%, transparent); }
.slot-block.cash { background: var(--series-2-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--series-2) 35%, transparent); }
.slot-block.past { background: var(--soft); box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); }
.slot-block b { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot-block span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot-block:hover { filter: brightness(.97); }
.slot-block.short span:last-child, .slot-block.tiny span { display: none; }
.slot-block.tiny { padding: 3px 8px; justify-content: center; }
.legend-row { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 10px; }

/* ---------- бічна панель (drawer) ---------- */

.drawer-dim { position: fixed; inset: 0; z-index: 20; background: var(--dim); }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 21; width: min(480px, 100%);
  background: var(--bg); box-shadow: -16px 0 40px rgb(16 24 40 / 16%); display: flex; flex-direction: column;
}
.drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.drawer-head h2 { margin: 0; font-size: 19px; }
.icon-btn { width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center; }
.icon-btn:hover { background: var(--soft); }
.drawer-body { flex: 1; overflow-y: auto; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 14px; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 8px 12px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.nb-foot { position: sticky; bottom: -28px; background: var(--bg); padding: 12px 0 16px; margin-bottom: -16px; border-top: 1px solid var(--line); }
.svc-pick { border: 1px solid var(--line); border-radius: 14px; max-height: 260px; overflow-y: auto; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-grid .full { grid-column: 1 / -1; }
.radio-row { display: flex; gap: 8px; flex-wrap: wrap; border: 0; margin: 0; padding: 0; }
.radio-row legend { font-size: 13px; color: var(--muted); margin-bottom: 4px; padding: 0; }
.radio-row label { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; cursor: pointer; }
.radio-row label:has(input:checked) { border-color: var(--navy); background: var(--soft); font-weight: 600; }

/* ---------- клієнт ---------- */

.tags { display: flex; gap: 8px; flex-wrap: wrap; }
.tag-toggle { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; }
.tag-toggle[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }

/* ---------- прайс ---------- */

.price-table input, .price-table select { height: 38px; border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; background: var(--bg); font-size: 14px; width: 100%; }
.price-table input[type="number"] { width: 92px; text-align: right; }
.price-table input[type="checkbox"] { width: 20px; height: 20px; }
.price-table tr.off td { opacity: .55; }
.sticky-actions { position: sticky; bottom: 0; display: flex; gap: 10px; justify-content: flex-end; padding: 14px 0; background: linear-gradient(transparent, var(--soft) 30%); }

.empty-state { text-align: center; padding: 48px 20px; background: var(--bg); border: 1px dashed var(--box); border-radius: 16px; }
.empty-state h2 { margin: 8px 0 6px; }
.empty-state p { color: var(--muted); margin: 0 auto 16px; max-width: 520px; }

/* ---------- вузькі екрани ---------- */

/* перерва в журналі */
.break-block { position: absolute; left: 0; right: 0; z-index: 0; pointer-events: none; display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: var(--muted); background: repeating-linear-gradient(135deg, var(--soft) 0 6px, transparent 6px 12px); border-block: 1px dashed var(--line); }
.biz-h3 { font-size: 16px; font-weight: 700; margin: 22px 0 10px; }
.panel h3 { font-size: 16px; margin: 0 0 8px; }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.title-row h1 { margin-bottom: 4px; }
.filters .spacer { flex: 1; }
.kpi .value.small-value { font-size: 18px; line-height: 1.25; }
.kpi .value.neg { color: var(--danger, #b42318); }

/* профіль точки: графік */
.settings-grid { align-items: start; }
.week { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.week legend { font-weight: 700; font-size: 15px; margin-bottom: 8px; padding: 0; }
.week-row { display: grid; grid-template-columns: minmax(130px, 1fr) minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; }
.week-row .row { gap: 8px; }
.week-row .select { width: 100%; min-width: 0; height: 40px; }
.week-row .select:disabled { opacity: .45; }
.small-btn { justify-self: start; min-height: 36px; font-size: 14px; }
.special-list, .offer-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.special-list li, .offer-list li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
.special-list li > span, .offer-list .name { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.special-list small, .offer-list small { color: var(--muted); font-size: 13px; }
.offer-list .price { white-space: nowrap; }
.offer-list li.off .name, .offer-list li.off .price { opacity: .5; }

/* фінансовий звіт */
table.t.pnl td { padding: 7px 4px; }
table.t.pnl tr.h td { font-weight: 700; padding-top: 14px; border-bottom: 0; }
table.t.pnl tr.t td { font-weight: 700; }
table.t.pnl tfoot td { font-weight: 700; border-top: 2px solid var(--text); }
table.t.pnl tfoot tr + tr td { border-top: 0; font-weight: 500; color: var(--muted); }

/* імпорт */
.import-grid { align-items: start; }
.map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin: 10px 0 4px; }
.map-grid .select { width: 100%; }
.howto { margin-top: 16px; }
.howto summary { cursor: pointer; font-weight: 600; }
.howto ul { margin: 12px 0 0; padding-left: 20px; display: grid; gap: 6px; line-height: 1.45; }
.notice.ok a { color: inherit; }

/* підключення точки */
.status-banner { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 16px; }
.status-banner > .ic { color: var(--warn); flex: none; margin-top: 2px; }
.connect-status .head { align-items: center; flex-wrap: wrap; }
.steps-list { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 18px; }
.steps-list li { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
.steps-list li.done { color: var(--ok); font-weight: 600; }
.check-note { margin: -4px 0 0; font-size: 13px; min-height: 18px; }
.ok-text, .bad-text { display: inline-flex; align-items: center; gap: 6px; }
.ok-text { color: var(--ok); }
.bad-text { color: var(--danger); }
.doc-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.dropzone.doc { flex-direction: row; justify-content: flex-start; text-align: left; gap: 12px; padding: 12px 14px; }
.dropzone.doc span { display: flex; flex-direction: column; gap: 2px; }
.dropzone.doc small, .doc-list.plain small { color: var(--muted); font-size: 13px; font-weight: 400; }
.doc-list.plain li { display: flex; gap: 10px; align-items: flex-start; }
.doc-list.plain li span { display: flex; flex-direction: column; gap: 2px; }
.offer-box { max-height: 280px; overflow-y: auto; border: 1px solid var(--line); border-radius: 12px; padding: 4px 16px 12px; background: var(--bg); }
.offer h2 { font-size: 17px; margin: 12px 0 4px; }
.offer h3 { font-size: 15px; margin: 14px 0 4px; }
.offer p { margin: 0 0 6px; line-height: 1.5; font-size: 14px; }
.offer-page { max-width: 820px; }
.notice.ok > span, .notice.warn > span { display: block; }

/* адмінка */
.admin-badge { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); min-width: 0; }
.queue-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 16px; }
.queue { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 12px; background: var(--warn-soft); color: var(--text); text-decoration: none; font-size: 14px; }
.queue .ic { color: var(--warn); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.history { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.history li { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
.review-mod { align-items: flex-end; gap: 8px; }
.review-mod .field { min-width: 220px; }
.photos { display: flex; gap: 8px; flex-wrap: wrap; }
.photos img { width: 120px; height: 90px; object-fit: cover; border-radius: 10px; }

/* меню з групами, персонал, абонементи, черга, акт */
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-group + .nav-group { margin-top: 10px; }
.nav-h { font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); padding: 4px 12px; }
.biz-top .power-field select { min-width: 0; max-width: 230px; }
table.t tr.off td { opacity: .55; }
.plan-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.plan { display: flex; flex-direction: column; gap: 6px; }
.plan h3 { margin: 4px 0 0; font-size: 16px; }
.plan.off { opacity: .6; }
.price-big { font-size: 24px; font-weight: 800; margin: 0; }
.svc-scope label { font-size: 14px; }
.intake { display: grid; gap: 6px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.queue-list { counter-reset: q; }

/* щасливі години: тиждень смугами */
.week-bands { display: grid; gap: 6px; margin-top: 12px; }
.wb-row { display: grid; grid-template-columns: 32px 1fr; align-items: center; gap: 8px; font-size: 13px; }
.wb-track { position: relative; height: 22px; border-radius: 6px; background: var(--soft); }
.wb-track.closed em { position: absolute; left: 8px; top: 3px; font-style: normal; color: var(--muted); font-size: 12px; }
.wb-open { position: absolute; top: 0; bottom: 0; background: var(--line); border-radius: 6px; }
.wb-deal { position: absolute; top: 0; bottom: 0; border-radius: 6px; background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.wb-axis .wb-track { background: none; height: 16px; }
.wb-axis i { position: absolute; transform: translateX(-50%); font-style: normal; font-size: 11px; color: var(--muted); }

/* статистика застосунку */
.funnel { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 10px; }
.funnel li { display: grid; grid-template-columns: minmax(120px, 160px) 1fr minmax(90px, auto); align-items: center; gap: 10px; font-size: 14px; }
.f-track { height: 22px; background: var(--soft); border-radius: 6px; overflow: hidden; }
.f-fill { display: block; height: 100%; background: var(--series-1); border-radius: 6px; }
.f-val { display: flex; flex-direction: column; text-align: right; }
.f-val small { color: var(--muted); font-size: 12px; }
.heat { display: grid; gap: 3px; margin-top: 10px; overflow-x: auto; }
.heat-row { display: grid; grid-template-columns: 28px repeat(15, minmax(22px, 1fr)); gap: 3px; align-items: center; }
.heat-h, .heat-d { font-size: 11px; color: var(--muted); text-align: center; }
.heat-c { display: block; height: 24px; border-radius: 4px; }
.heat-c.l0 { background: var(--soft); }
.heat-c.l1 { background: color-mix(in srgb, var(--series-1) 18%, var(--soft)); }
.heat-c.l2 { background: color-mix(in srgb, var(--series-1) 36%, var(--soft)); }
.heat-c.l3 { background: color-mix(in srgb, var(--series-1) 54%, var(--soft)); }
.heat-c.l4 { background: color-mix(in srgb, var(--series-1) 74%, var(--soft)); }
.heat-c.l5 { background: var(--series-1); }
.heat-legend { display: flex; align-items: center; gap: 4px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.heat-legend i { width: 18px; height: 12px; }

.slot-block .eta { font-weight: 700; color: var(--ok); }

@media (max-width: 960px) {
  .biz-shell { flex-direction: column; }
  .biz-side { position: static; height: auto; width: auto; flex-direction: row; align-items: center; padding: 8px 12px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .biz-side .brand { padding: 0 8px 0 0; flex: none; }
  .biz-nav { flex-direction: row; }
  .nav-group { flex-direction: row; }
  .nav-group + .nav-group { margin: 0 0 0 10px; }
  .nav-h { display: none; }
  .biz-nav a { white-space: nowrap; }
  .biz-side .to-app { margin: 0; white-space: nowrap; }
  .biz-top { padding: 10px 16px; position: static; }
  .biz-top select { min-width: 0; }
  #view { padding: 18px 16px 40px; }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi.hero { grid-column: span 2; }
  .kpi .value { font-size: 22px; }
  .kpi.hero .value { font-size: 36px; }
  .form-grid { grid-template-columns: 1fr; }
  .week-row { grid-template-columns: 1fr auto 1fr; }
  .week-row > .row { grid-column: 1 / -1; }
  .admin-badge { display: none; }
  .funnel li { grid-template-columns: 1fr auto; }
  .funnel .f-track { grid-column: 1 / -1; grid-row: 2; }
}

/* Виїзд, кошторис і чат за записом */
.sched-col-head.mobile { color: var(--text); background: var(--soft); }
.sched-col.mobile { background-color: var(--soft); }
.est-row { display: grid; grid-template-columns: 120px 1fr 70px 100px 120px; gap: 6px; border: 0; padding: 0; margin: 0; }
.est-row legend { font-size: 13px; color: var(--muted); padding: 0; margin-bottom: 4px; }
.est-row input { min-height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; font-size: 14px; min-width: 0; }
@media (max-width: 640px) { .est-row { grid-template-columns: 1fr 1fr; } .est-row [name="name"] { grid-column: 1 / -1; } }
.estimate-box { border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.chat-list li.unread { border-color: var(--accent); }
.chat-list li > span small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.est-row .select { width: 100%; min-width: 0; height: 40px; }

/* Підтримка, антифрод, маркетинг */
.pill.bad { background: var(--danger-soft, #fdecea); color: var(--danger); }
.ticket-list li.unread, tr.unread td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.ticket-open { border-top: 1px solid var(--line); padding-top: 12px; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.quick .chip { font-size: 13px; padding: 6px 10px; min-height: 34px; }
.fraud-card { border-left: 4px solid var(--warn); }
.fraud-card.high { border-left-color: var(--danger); }
.fraud-lines { margin: 0; padding-left: 18px; font-size: 14px; display: grid; gap: 4px; }
.fraud-lines .stars { margin-right: 4px; }
.mini-funnel { display: grid; gap: 4px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.mini-funnel:first-of-type { border-top: 0; }
.mini-funnel span { color: var(--muted); }
.mini-funnel .track { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
.mini-funnel .fill { display: block; height: 100%; background: var(--series-1); border-radius: 4px; }
.link-text { overflow-wrap: anywhere; }
.spend-form { align-items: flex-end; }
.spend-form .field input { width: 110px; }
.camp-list li { flex-wrap: wrap; } .camp-list li > span { flex-basis: 100%; }

/* ---------- зручність: «Сьогодні», швидкий пошук, гарячі клавіші ---------- */
.today { margin-bottom: 20px; display: grid; gap: 14px; }
.today .head { align-items: center; }
.today h2 { margin: 0; }
.today-kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.today-kpis span { display: grid; gap: 2px; padding: 10px 12px; border-radius: 12px; background: var(--soft); font-size: 13px; color: var(--muted); }
.today-kpis b { font-size: 20px; color: var(--text); }
.attention { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.attention li > a, .attention li > span { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-size: 14px; text-decoration: none; }
.attention b { font-size: 15px; }
.today-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.today-row { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; border-left-width: 4px; }
.today-row.now { border-left-color: var(--ok); background: color-mix(in srgb, var(--ok-soft) 50%, var(--bg)); }
.today-row.next { border-left-color: var(--navy); }
.today-row.late { border-left-color: var(--warn); }
.t-time { display: grid; font-size: 18px; font-weight: 800; line-height: 1.1; }
.t-time small { font-size: 12px; font-weight: 500; color: var(--muted); }
.t-main { display: grid; gap: 2px; min-width: 0; }
.t-main small { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.t-act { display: flex; gap: 6px; }
.btn.icon-only { width: 40px; padding: 0; justify-content: center; }
.link-btn { border: 0; background: none; padding: 0; color: var(--accent-hover); font: inherit; text-decoration: underline; cursor: pointer; }

.biz-search { position: relative; flex: 1 1 260px; max-width: 380px; }
.biz-search input { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--soft); color: var(--text); font: inherit; font-size: 14px; }

// peek — для частого читання без змін: розбираємо JSON лише тоді, коли значення змінилося.
// Повернений обʼєкт спільний — не змінюйте його, для змін є get/set.
const peeked = new Map();
const store = {
  peek(key, fallback) {
    let raw = null;
    try { raw = localStorage.getItem(`carcar.${key}`); } catch { /* приватний режим */ }
    if (raw === null) return fallback;
    const hit = peeked.get(key);
    if (hit?.raw === raw) return hit.value;
    try {
      const value = JSON.parse(raw);
      peeked.set(key, { raw, value });
      return value;
    } catch {
      return fallback;
    }
  },
  get(key, fallback) {
    try {
      const raw = localStorage.getItem(`carcar.${key}`);
      return raw ? JSON.parse(raw) : fallback;
    } catch {
      return fallback;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(`carcar.${key}`, JSON.stringify(value));
      return true;
    } catch {
      // Приватний режим або переповнення: працюємо без збереження.
      return false;
    }
  },
};

const WEEKDAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'];
const WEEKDAY_NAMES = ['Понеділок', 'Вівторок', 'Середа', 'Четвер', 'Пʼятниця', 'Субота', 'Неділя'];
const weekdayOf = (iso) => (parseDate(iso).getDay() + 6) % 7; // 0 — понеділок

// Графік точки (усе в хвилинах від півночі): години на кожен день тижня або null — вихідний,
// перерва, особливі дати (свята, санітарні дні) і правила запису: на скільки днів уперед
// можна записатися (horizon) і за скільки хвилин до початку (lead).
function scheduleOf(place) {
  const s = place.schedule ?? {};
  const base = place.hours ? [place.hours[0] * 60, place.hours[1] * 60] : [0, 24 * 60];
  return {
    week: s.week ?? Array(7).fill(base),
    brk: s.brk ?? null,
    special: s.special ?? {},
    horizon: s.horizon ?? 14,
    lead: s.lead ?? 30,
  };
}

// Години роботи на конкретну дату або null, якщо точка не працює.
function hoursFor(place, iso) {
  const s = scheduleOf(place);
  return iso in s.special ? s.special[iso] : s.week[weekdayOf(iso)];
}

// Найширший робочий проміжок тижня — для осі годин у журналі й аналітиці.
function widestRange(place) {
  const days = scheduleOf(place).week.filter(Boolean);
  return days.length ? [Math.min(...days.map((d) => d[0])), Math.max(...days.map((d) => d[1]))] : [8 * 60, 20 * 60];
}

// Чи перетинає проміжок [t, t + minutes) перерву точки.
function inBreak(place, t, minutes) {
  const b = scheduleOf(place).brk;
  return !!b && t < b[1] && t + minutes > b[0];
}

const POWER = {

  closed: ['Немає світла — не працюємо', 'muted'],
};
const POWER_FRESH_HOURS = 12;
function powerOf(placeId, now = Date.now()) {
  const pw = store.peek('biz.power', {})[placeId];
  return pw && now - pw.at < POWER_FRESH_HOURS * 3600000 ? pw : null;
}
function setPower(placeId, state) {
  const all = store.get('biz.power', {});
  all[placeId] = { state, at: Date.now() };
  store.set('biz.power', all);
}
const hasGenerator = (p) => p.tags.some((t) => /генератор/i.test(t));
// Чи працює точка під час відключень: свіжа позначка точки важливіша за опис.
function worksInBlackout(p) {
  const pw = powerOf(p.id);
  if (pw) return pw.state !== 'closed';
  return hasGenerator(p);
}

function isOpenNow(place, now = new Date()) {
  const h = hoursFor(place, isoDate(now));
  if (!h) return false;
  if (powerOf(place.id, now.getTime())?.state === 'closed') return false;
  const m = now.getHours() * 60 + now.getMinutes();
  return m >= h[0] && m < h[1] && !inBreak(place, m, 1);
}

// Зменшує фото до 720 px, щоб воно вмістилося у сховище пристрою.
async function shrinkPhoto(file) {
  try {
    const img = await createImageBitmap(file);
    const k = Math.min(1, 720 / Math.max(img.width, img.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(img.width * k);
    canvas.height = Math.round(img.height * k);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', 0.7);
  } catch {
    return null;
  }
}

const withBase = (p) => Object.assign(p, { basePhone: p.phone, baseHours: p.hours, baseBoxes: p.boxes, baseServices: p.services, baseCats: p.cats, baseMobile: p.mobile ?? null });
PLACES.forEach(withBase);

// Нові точки, зареєстровані в панелі через «Підключення». Клієнти бачать їх лише після схвалення CARCAR.
function loadCustomPlaces() {
  for (const p of store.get('places.custom', [])) {
    if (!PLACES.some((x) => x.id === p.id)) PLACES.push(withBase({ ...p }));
  }
}

function addCustomPlace(p) {
  store.set('places.custom', [...store.get('places.custom', []), p]);
  applyOverrides();
}

function applyOverrides() {
  loadCustomPlaces();
  const all = store.get('biz.places', {});
  for (const p of PLACES) {
    const o = all[p.id] || {};
    p.phone = o.phone ?? p.basePhone;
    p.hours = o.hours !== undefined ? o.hours : p.baseHours;
    p.boxes = o.boxes ?? p.baseBoxes;
    p.schedule = o.schedule ?? null;
    p.mobile = o.mobile !== undefined ? o.mobile : p.baseMobile;
    p.allServices = o.services ?? p.baseServices;
    p.services = p.allServices.filter((s) => !s.off);
    // Категорії точки — ті, у яких є хоч одна активна послуга (точка могла додати нову).
    p.cats = [...new Set([...p.baseCats.filter((c) => p.services.some((s) => serviceCat(s) === c)), ...p.services.map(serviceCat)])];
  }
}

function saveOverride(placeId, patch) {
  const all = store.get('biz.places', {});
  all[placeId] = { ...all[placeId], ...patch };
  store.set('biz.places', all);
  applyOverrides();
}

applyOverrides();

// ---------- підключення точок і модерація ----------

// Статус точки в CARCAR. Демо-точки з data.js уже підключені; нові починають з чернетки.
// Дані підключення (юрособа, документи, реквізити, оферта) і рішення модератора — у 'partners'.
const PARTNER_STATUS = {

  approved: ['Підключено', 'ok'], rejected: ['Відхилено', 'muted'], suspended: ['Призупинено', 'muted'],
};

// Клієнти бачать і можуть записатися лише до підключених точок.

// Виводити гроші можна лише на перевірені реквізити.
const payoutReady = (placeId) => !!partnerOf(placeId).payout?.verified && partnerOf(placeId).status !== 'rejected';
const maskIban = (iban) => `UA…${String(iban).slice(-4)}`;

// Комісія CARCAR: індивідуальна для точки або загальна з адмінки, інакше — з data.js.
const commissionFor = (placeId) => partnerOf(placeId).commission ?? store.get('admin.settings', {}).commission ?? PAYMENT.commission;

// Гроші клієнту на баланс CARCAR (повернення за спором чи скасуванням з будь-якого екрана).
function creditClient(amount, text) {
  const w = { bonus: 0, money: 0, history: [], ...store.get('wallet', {}) };
  w.money += amount;
  w.history.unshift({ amount, text, at: Date.now(), kind: 'money' });
  store.set('wallet', w);
}

// Рішення за спором: placePart — скільки отримує точка (0 — усе клієнту, повна ціна — усе точці).
function resolveDispute(b, placePart, note = '') {
  const full = price(b);
  const toPlace = Math.max(0, Math.min(full, Math.round(placePart)));
  const name = PLACES.find((x) => x.id === b.placeId)?.name ?? '';
  b.resolution = { placePart: toPlace, note, at: Date.now() };
  if (toPlace === full) {
    complete(b);
    b.unfreezeAt = Date.now(); // модератор уже перевірив замовлення
    return;
  }
  const refund = Math.min(b.paid, full - toPlace);
  Object.assign(b, { state: 'refunded', refund, placeAmount: toPlace, refundTo: 'balance', closedAt: Date.now() });
  if (refund) creditClient(refund, `Повернення за спором: ${name}`);
}

// ---------- персональні послуги й витрати ----------

// Персональна послуга з індивідуальною ціною для конкретного клієнта точки.
// clientKey — tel:… або car:…; клієнт бачить її в застосунку, якщо його телефон чи авто збігаються.
const offersOf = (placeId, clientKey) =>
  store.get('biz.offers', []).filter((o) => o.placeId === placeId && o.active !== false && (!clientKey || o.clientKey === clientKey));

// Персональну послугу подаємо так само, як звичайну: одна ціна для всіх класів авто.
const offerAsService = (o) => ({ id: `offer:${o.id}`, name: o.name, min: o.min, price: [o.price, o.price, o.price], cat: o.cat, personal: true, main: true, note: o.note });

const EXPENSE_CATS = ['Хімія й витратні матеріали', 'Запчастини', 'Зарплата', 'Оренда', 'Комунальні послуги', 'Реклама', 'Податки', 'Обладнання й ремонт', 'Інше'];
const PAY_METHODS = { cash: 'Готівка', card: 'Картка', account: 'Рахунок' };

// Витрати точки за проміжком дат: разові плюс щомісячні, розгорнуті на кожен місяць до кінця проміжку
// (або до дати зупинки). Розгорнуті записи мають id «шаблон@дата».
// ---------- персонал і зарплата ----------

const ROLES = { owner: 'Власник', admin: 'Адміністратор', master: 'Майстер' };
const staffOf = (placeId) => store.peek('biz.staff', {})[placeId] ?? [];

// База для відсотка майстра — вартість робіт: оплата клієнта, бонус і покрите абонементом чи сертифікатом.
const workBase = (b) => (isCarcar(b) ? price(b) : b.paid) + (b.covered || 0);

// Зарплата майстрів — відсоток від виконаних робіт, одним рядком на майстра за день.
// Ці витрати не зберігаються окремо: їх завжди перераховано з виконаних записів.
function salaryExpenses(placeId, from, to) {
  const staff = staffOf(placeId);
  const map = new Map();
  for (const b of store.peek('bookings', [])) {
    if (b.placeId !== placeId || b.state !== 'completed' || !b.masterId || b.date < from || b.date > to) continue;
    const m = staff.find((x) => x.id === b.masterId);
    if (!m?.pct) continue;
    const k = `${b.date}|${m.id}`;
    const e = map.get(k) ?? { id: `salary:${m.id}:${b.date}`, placeId, date: b.date, cat: 'Зарплата', method: 'card', amount: 0, works: 0, auto: 'salary', masterId: m.id };
    e.amount += (workBase(b) * m.pct) / 100;
    e.works++;
    map.set(k, e);
  }
  return [...map.values()].map((e) => {
    const m = staff.find((x) => x.id === e.masterId);
    return { ...e, amount: Math.round(e.amount), note: `${m.name}: ${e.works} ${plural(e.works, 'робота', 'роботи', 'робіт')} × ${m.pct}%` };
  });
}

function expensesIn(placeId, from, to) {
  const out = [...salaryExpenses(placeId, from, to)];
  for (const e of store.get('biz.expenses', []).filter((x) => x.placeId === placeId)) {
    if (!e.recurring) {
      if (e.date >= from && e.date <= to) out.push(e);
      continue;
    }
    const start = parseDate(e.date);
    for (let k = 0; ; k++) {
      const d = new Date(start.getFullYear(), start.getMonth() + k, 1);
      const day = Math.min(start.getDate(), new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate());
      const iso = isoDate(new Date(d.getFullYear(), d.getMonth(), day));
      if (iso > to || (e.until && iso > e.until)) break;
      if (iso >= from) out.push({ ...e, id: `${e.id}@${iso}`, template: e.id, date: iso });
    }
  }
  return out.sort((a, b) => b.date.localeCompare(a.date));
}

// ---------- гроші ----------

const ACTIVE = ['paid', 'done', 'dispute'];
const HOUR = 3600000;

// Надійність клієнта за його записами: скільки скасувань, неявок і перенесень, що ще дозволено.
function reliability(list, now = Date.now()) {
  const R = RELIABILITY;
  const since = now - R.days * 24 * HOUR;
  const cancels = list.filter((b) => b.state === 'cancelled' && b.cancelBy === 'client' && (b.closedAt ?? 0) >= since);
  const freeUsed = cancels.filter((b) => b.cancelKind === 'free').length;
  const noshows = list.filter((b) => b.state === 'noshow' && (b.closedAt ?? bookingStart(b).getTime()) >= now - R.noShowDays * 24 * HOUR).length;
  const moves = list.flatMap((b) => b.moves ?? []).filter((m) => m.at >= since).length;
  const limited = noshows >= R.noShowLimit || cancels.length >= R.cancelLimit;
  const freeLeft = limited ? 0 : Math.max(0, R.freeCancels - freeUsed);
  const movesLeft = limited ? 0 : Math.max(0, R.moves - moves);
  return {
    cancels: cancels.length, freeUsed, freeLeft, noshows, moves, movesLeft, limited,
    maxActive: limited ? 1 : R.maxActive,
    level: limited ? 'limited' : !freeLeft || !movesLeft || noshows || cancels.length >= R.freeCancels ? 'warn' : 'ok',
  };
}
// Стани, у яких запис займає бокс: оплачені через CARCAR і внесені в журнал точки.
const BLOCKING = [...ACTIVE, 'booked'];

// Запис через CARCAR (оплата в застосунку) чи внесений точкою вручну (оплата на місці).
const isCarcar = (b) => (b.channel ?? 'carcar') === 'carcar';

// Повна ціна замовлення: те, що заплатив клієнт, плюс бонус і промокод, які доплачує CARCAR.
const price = (b) => b.paid + (b.bonus || 0) + (b.promo && !b.promo.returned ? b.promo.amount : 0);

// ---------- виїзні послуги ----------

// Виїзна бригада зайнята ще MOBILE_ROAD хвилин після роботи — дорога до наступного клієнта.
// Бокси й бригади — окремі потужності: виїзний запис не займає бокс, а запис у точці — бригаду.
const MOBILE_ROAD = 30;
const mobileOn = (p) => !!p?.mobile?.services?.length && p.mobile.crews > 0;
const spanOf = (b) => [toMin(b.time), toMin(b.time) + b.minutes + (b.mobile ? MOBILE_ROAD : 0)];
const laneCap = (p, mobile) => (mobile ? p.mobile?.crews ?? 0 : p.boxes);
const sameLane = (b, mobile) => !!b.mobile === !!mobile;

// ---------- промокоди платформи ----------

// Промокоди й акції CARCAR. Знижку оплачує платформа: точка отримує повну ціну, як із бонусом.
// kind: pct — відсоток (max — не більше ₴), sum — фіксована сума. cats — на які категорії діє (порожньо — на всі).
// firstOnly — лише на перше замовлення в цих категоріях; auto — застосовується сам, без введення коду.
const PROMO_DEFAULTS = [
  { id: 'persha30', code: 'PERSHA30', title: 'Перша мийка −30%', kind: 'pct', value: 30, max: 300, minOrder: 0, cats: ['wash'], firstOnly: true, auto: true, active: true, until: null, limit: null },
];
const promosAll = () => store.get('admin.promos', null) ?? PROMO_DEFAULTS;
const savePromos = (list) => store.set('admin.promos', list);
const promoUses = (code, bookings) => bookings.filter((b) => b.promo?.code === code && !b.promo.returned);
const promoText = (pr) => (pr.kind === 'pct' ? `−${pr.value}%${pr.max ? ` (до ${uah(pr.max)})` : ''}` : `−${uah(pr.value)}`);

// Чи діє промокод на замовлення: items — [{cat, price}] обраних послуг (ціни вже зі знижками точки),
// mine — записи цього клієнта. Повертає { ok, amount } або { ok: false, why }.
function promoCheck(pr, { place, items, mine, all }) {
  const today = isoDate(new Date());
  if (!pr || pr.active === false) return { ok: false, why: 'Промокод не діє' };
  if (pr.until && pr.until < today) return { ok: false, why: 'Строк дії промокоду минув' };
  if (pr.limit && promoUses(pr.code, all).length >= pr.limit) return { ok: false, why: 'Промокод уже використали максимальну кількість разів' };
  const inCats = (c) => !pr.cats?.length || pr.cats.includes(c);
  if (!place.cats.some(inCats)) return { ok: false, why: `Промокод діє лише на: ${pr.cats.map((c) => CATEGORIES.find((x) => x.id === c)?.name.toLowerCase()).join(', ')}` };
  const base = items.filter((x) => inCats(x.cat)).reduce((a, x) => a + x.price, 0);
  if (!base) return { ok: false, why: 'Промокод не діє на обрані послуги' };
  if (pr.minOrder && base < pr.minOrder) return { ok: false, why: `Промокод діє на замовлення від ${uah(pr.minOrder)}` };
  if (mine.some((b) => b.promo?.code === pr.code && !b.promo.returned)) return { ok: false, why: 'Ви вже скористалися цим промокодом' };
  if (pr.firstOnly && mine.some((b) => !(b.state === 'cancelled' && b.refundTo === 'balance') && PLACES.find((x) => x.id === b.placeId)?.cats.some(inCats))) {
    return { ok: false, why: 'Промокод діє лише на перше замовлення' };
  }
  const amount = pr.kind === 'pct' ? Math.min(pr.max || Infinity, Math.round((base * pr.value) / 100)) : Math.min(pr.value, base);
  return { ok: true, amount };
}

// Мийка підтвердила виконання («Машина готова»): замовлення завершене,
// гроші точці заморожені ще на freezeHours, щоб клієнт встиг відкрити спір.
function complete(b, at = Date.now()) {
  Object.assign(b, { state: 'completed', completedAt: at, unfreezeAt: at + PAYMENT.freezeHours * HOUR });
}

const isFrozen = (b) => b.state === 'completed' && Date.now() < (b.unfreezeAt ?? 0);

// Скільки з оплати клієнта належить точці (до комісії).
function placeShare(b) {
  if (!isCarcar(b)) return 0;
  if (b.state === 'completed') return price(b);
  if (b.state === 'cancelled' || b.state === 'noshow' || b.state === 'refunded') return b.placeAmount ?? 0;
  return 0;
}

// Баланс точки в CARCAR: available — можна вивести; frozen — замовлення в роботі
// плюс підтверджені, що ще не розморозились. Оплати на місці сюди не входять.
function balanceFor(placeId, bookings, payouts) {
  const own = bookings.filter((b) => b.placeId === placeId && isCarcar(b));
  const earned = own.filter((b) => !isFrozen(b)).reduce((a, b) => a + placeShare(b), 0);
  const withdrawn = payouts.filter((x) => x.placeId === placeId).reduce((a, x) => a + x.gross, 0);
  const frozen = own.filter((b) => ACTIVE.includes(b.state) || isFrozen(b)).reduce((a, b) => a + price(b), 0);
  const next = own.filter(isFrozen).sort((a, b) => a.unfreezeAt - b.unfreezeAt)[0];
  // Абонементи й сертифікати, куплені в застосунку: гроші точці через ті самі 48 годин.
  const sales = (store.peek('biz.passes', {})[placeId]?.sold ?? []).filter((x) => x.source === 'carcar');
  const ripe = (x) => Date.now() >= x.soldAt + PAYMENT.freezeHours * HOUR;
  const passEarned = sales.filter(ripe).reduce((a, x) => a + x.price, 0);
  const passFrozen = sales.filter((x) => !ripe(x)).reduce((a, x) => a + x.price, 0);
  return { available: earned + passEarned - withdrawn, frozen: frozen + passFrozen, next, withdrawn };
}

// Виконання підтверджує мийка («Машина готова»). Записи зі старим проміжним станом «done»
// (чекали підтвердження клієнта) вважаються виконаними з моменту, коли мийка їх закрила.
function settleAll(bookings) {
  let changed = false;
  for (const b of bookings) {
    if (b.state === 'done') {
      complete(b, b.doneAt ?? Date.now());
      changed = true;
    }
  }
  return changed;
}

// ---------- рейтинг ----------

// Відгуки, приховані модератором CARCAR, не впливають на рейтинг і не показуються клієнтам.
const visibleReviews = (reviews) => reviews.filter((r) => !r.hidden);

function ratingFor(placeId, reviews) {
  const list = visibleReviews(reviews).filter((r) => r.placeId === placeId);
  const dist = [1, 2, 3, 4, 5].map((n) => list.filter((r) => r.stars === n).length);
  const avg = list.length ? list.reduce((a, r) => a + r.stars, 0) / list.length : 0;
  return { avg, count: list.length, dist };
}

// ---------- підтримка CARCAR ----------

// Звернення клієнтів і точок у підтримку. Повʼязане із записом (bookingId) звернення модератор
// бачить поруч зі спором і може перевести в спір прямо зі звернення.
// status: new — ще не відповіли, open — у роботі, waiting — чекаємо відповіді автора, closed — закрито.
const TICKET_TOPICS = {
  booking: 'Запис і перенесення', payment: 'Оплата й повернення', quality: 'Якість послуги', dispute: 'Спір щодо замовлення',
  payout: 'Виплати й комісія', review: 'Відгуки', account: 'Акаунт і дані', fraud: 'Підозра на шахрайство', other: 'Інше',
};
const CLIENT_TOPICS = ['booking', 'payment', 'quality', 'dispute', 'account', 'fraud', 'other'];
const PLACE_TOPICS = ['payout', 'booking', 'dispute', 'review', 'account', 'fraud', 'other'];
const TICKET_STATUS = { new: ['Нове', 'warn'], open: ['У роботі', 'carcar'], waiting: ['Чекаємо відповіді', 'muted'], closed: ['Закрито', 'ok'] };
// Термінові теми — гроші й шахрайство: відповідь за 2 години, решта — за добу.
const URGENT = ['payment', 'dispute', 'fraud', 'payout'];
const slaHours = (t) => (t.priority === 'high' ? 2 : 24);

const ticketsAll = () => store.get('support', []);
const saveTickets = (list) => store.set('support', list);

function openTicket({ from, placeId = null, bookingId = null, topic, text, clientName = '', clientPhone = '', clientKey = null }) {
  const list = ticketsAll();
  const t = {
    id: uid(), no: 1000 + list.length + 1, from, placeId, bookingId, topic, clientName, clientPhone, clientKey,
    priority: URGENT.includes(topic) ? 'high' : 'normal', status: 'new',
    messages: [{ from, text, at: Date.now() }], createdAt: Date.now(), updatedAt: Date.now(), unreadAdmin: true, unreadUser: false,
  };
  saveTickets([...list, t]);
  return t;
}

// Повідомлення у зверненні. Відповідь CARCAR чекає реакції автора, відповідь автора повертає звернення в роботу.
function ticketReply(id, from, text, status) {
  const list = ticketsAll();
  const t = list.find((x) => x.id === id);
  if (!t) return null;
  t.messages.push({ from, text, at: Date.now() });
  t.updatedAt = Date.now();
  if (from === 'admin') {
    t.firstReplyAt ??= Date.now();
    t.status = status ?? 'waiting';
    t.unreadUser = true;
    t.unreadAdmin = false;
  } else {
    t.status = t.status === 'new' ? 'new' : 'open';
    t.unreadAdmin = true;
  }
  saveTickets(list);
  return t;
}

function setTicket(id, patch) {
  const list = ticketsAll();
  const t = list.find((x) => x.id === id);
  if (t) Object.assign(t, patch, { updatedAt: Date.now() });
  saveTickets(list);
  return t;
}

// Прострочено, якщо CARCAR ще не відповів у межах SLA.
const ticketOverdue = (t, now = Date.now()) => t.status === 'new' && now - t.createdAt > slaHours(t) * HOUR;

// ---------- антифрод: обмеження ----------

// Клієнти, яким CARCAR обмежив онлайн-запис після перевірки (ключ — tel:… або device).
const fraudState = () => ({ dismissed: {}, blocked: {}, ...store.get('admin.fraud', {}) });
const saveFraud = (s) => store.set('admin.fraud', s);
const isBlocked = (keys) => keys.some((k) => k && fraudState().blocked[k]);

// ---------- рух ----------

// Поява сторінки й «набігання» чисел у показниках — лише при переході на інший екран
// і якщо людина не просила зменшити анімацію.
const calm = () => typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
function enterView(view, changed) {
  if (!changed || calm()) return;
  view.classList.remove('view-enter');
  void view.offsetWidth; // перезапуск анімації
  view.classList.add('view-enter');
  clearTimeout(enterView.t);
  enterView.t = setTimeout(() => view.classList.remove('view-enter'), 900);
  for (const el of view.querySelectorAll('.kpi .value, .tile b, .sheet-total b')) countUp(el);
}

function countUp(el) {
  const text = el.textContent;
  const m = text.match(/\d[\d\s  ]*(?:,\d+)?/);
  if (!m) return;
  const dec = m[0].includes(',') ? m[0].split(',')[1].length : 0;
  const to = parseFloat(m[0].replace(/[\s  ]/g, '').replace(',', '.'));
  if (!(to > 0)) return;
  const start = performance.now();
  const step = (now) => {
    if (!el.isConnected) return;
    const k = Math.min(1, (now - start) / 650);
    const v = to * (1 - (1 - k) ** 3);
    el.textContent = k < 1 ? text.replace(m[0], v.toLocaleString('uk-UA', { minimumFractionDigits: dec, maximumFractionDigits: dec })) : text;
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

async function hashPass(login, pass) {
  const text = `carcar:${login.toLowerCase()}:${pass}`;
  if (globalThis.crypto?.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
  }
  let h = 5381;
  for (const ch of text) h = (h * 33) ^ ch.charCodeAt(0);
  return `x${(h >>> 0).toString(16)}`;
}

const TRANSLIT = { а: 'a', б: 'b', в: 'v', г: 'h', ґ: 'g', д: 'd', е: 'e', є: 'ie', ж: 'zh', з: 'z', и: 'y', і: 'i', ї: 'i', й: 'i', к: 'k', л: 'l', м: 'm', н: 'n', о: 'o', п: 'p', р: 'r', с: 's', т: 't', у: 'u', ф: 'f', х: 'kh', ц: 'ts', ч: 'ch', ш: 'sh', щ: 'shch', ь: '', ю: 'iu', я: 'ia', "'": '', 'ʼ': '' };
const slug = (name) => [...name.toLowerCase().replace(/автомийка|мийка|детейлінг/g, '')].map((c) => TRANSLIT[c] ?? c).join('').replace(/[^a-z0-9]+/g, '').slice(0, 12) || 'wash';
const randomPass = () => Array.from(crypto.getRandomValues(new Uint32Array(8)), (n) => 'abcdefghjkmnpqrstuvwxyz23456789'[n % 31]).join('');

// Вільні початки на дату: у робочі години, не в перерву, не в минулому й поки є вільний бокс
// (для виїзного запису — вільна бригада з урахуванням дороги). skip — запис, який переносять.
function openStarts(place, date, minutes, bookings, { lead = scheduleOf(place).lead, skip, mobile = false } = {}) {
  const h = hoursFor(place, date);
  if (!h) return [];
  const spans = bookings.filter((b) => b.placeId === place.id && b.date === date && BLOCKING.includes(b.state) && b !== skip && sameLane(b, mobile))
    .map(spanOf);
  const need = minutes + (mobile ? MOBILE_ROAD : 0);
  const cap = laneCap(place, mobile);
  const min = date === opsToday() ? opsNow() + lead : -1;
  const out = [];
  for (let t = h[0]; t + minutes <= h[1]; t += 30) {
    if (t < min || inBreak(place, t, minutes)) continue;
    if (spans.filter(([s, e]) => t < e && t + need > s).length < cap) out.push(hhmm(t));
  }
  return out;
}

// Стрічка чату з позначками про хід запису: мийка закінчила роботу, запис завершено, скасовано чи закрито.
// Позначки не зберігаються, а виводяться зі стану запису — тож з'являються, хоч би де змінився стан.
function chatTimeline(b) {
  const msgs = b.chat ?? [];
  const fallback = msgs.at(-1)?.at ?? b.createdAt ?? Date.now();
  const marks = [];
  // Виконання підтверджує мийка — одразу «Запис завершено», без проміжної позначки.
  if (b.state === 'completed') marks.push({ at: b.completedAt ?? fallback, kind: 'end', text: 'Запис завершено' });
  else if (b.state === 'cancelled') marks.push({ at: b.closedAt ?? fallback, kind: 'closed', text: 'Запис скасовано' });
  else if (b.state === 'noshow') marks.push({ at: b.closedAt ?? fallback, kind: 'closed', text: b.lateForfeit ? 'Запис закрито: запізнення' : 'Запис закрито: неявка' });
  else if (b.state === 'refunded') marks.push({ at: b.closedAt ?? fallback, kind: 'closed', text: 'Запис закрито за рішенням спору' });
  return [...msgs, ...marks.map((m) => ({ ...m, from: 'mark' }))].sort((x, y) => x.at - y.at);
}

// (days — дні тижня, 0 — понеділок). Знижка діє на запис, що починається у вікні.
const allDeals = (placeId) => (store.peek('biz.deals', {})[placeId] ?? []).filter((d) => d.active !== false);
const dealsOf = (placeId) => allDeals(placeId).filter((d) => (d.days ? !d.until || d.until >= opsToday() : d.date >= opsToday()));

function dealsOn(placeId, date) {

const OPS_WD = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'];
// «Пн–Пт», «Сб–Нд», «Щодня» або перелік днів.
function daysText(days) {
  const d = [...days].sort((a, b) => a - b);
  if (d.length === 7) return 'Щодня';
  const runs = [];
  for (const x of d) {
    const last = runs.at(-1);
    if (last && x === last[1] + 1) last[1] = x; else runs.push([x, x]);
  }
  return runs.map(([a, z]) => (a === z ? OPS_WD[a] : z === a + 1 ? `${OPS_WD[a]}, ${OPS_WD[z]}` : `${OPS_WD[a]}–${OPS_WD[z]}`)).join(', ');
}

// Гарячі пропозиції для каталогу: знижки на сьогодні й завтра, у яких ще є вільний час.
function hotDeals(bookings) {
  const out = [];
  const days = [opsToday(), isoDate(new Date(Date.now() + 864e5))];
  for (const p of PLACES.filter(isListed)) {
    const minMin = Math.min(...p.services.map((s) => s.min));
    for (const date of days) {
      for (const d of dealsOn(p.id, date)) {
        const free = openStarts(p, date, minMin, bookings).filter((x) => toMin(x) >= d.from && toMin(x) < d.to);
        if (free.length) out.push({ place: p, deal: d, free });
      }
    }
  }
  return out.sort((a, b) => (a.deal.date + opsPad(a.deal.from)).localeCompare(b.deal.date + opsPad(b.deal.from)));
}
const opsPad = (n) => String(n).padStart(4, '0');

// ---------- жива черга ----------

// Черга на сьогодні: авто, що чекають, і ті, що вже в боксі.
function queueOf(placeId) {
  const day = opsToday();
  return (store.peek('biz.queue', {})[placeId] ?? []).filter((q) => q.day === day);
}

// Оцінка: хто коли потрапить у бокс. Авто в роботі займають бокс до кінця; записи на сьогодні
// мають пріоритет, якщо машина з черги не встигне до їхнього початку. Повертає час для кожного
// з тих, хто чекає, і для нового авто тривалістю minutes.
function queueEstimate(place, bookings, minutes = 30) {
  const now = opsNow();
  const list = queueOf(place.id);
  const free = Array(place.boxes).fill(now);
  const working = list.filter((q) => q.status === 'working');
  for (const q of working) {
    const i = free.indexOf(Math.min(...free));
    free[i] = Math.max(now, toMin(q.startedTime) + q.minutes);
  }
  const day = opsToday();
  const books = bookings.filter((b) => b.placeId === place.id && b.date === day && BLOCKING.includes(b.state))
    .map((b) => [toMin(b.time), b.minutes]).filter(([s, m]) => s + m > now).sort((a, b) => a[0] - b[0]);
  // Записи, що вже йдуть, займають бокс до кінця.
  while (books.length && books[0][0] <= now) {
    const [s, m] = books.shift();
    const i = free.indexOf(Math.min(...free));
    free[i] = Math.max(free[i], s + m);
  }
  const waiting = list.filter((q) => q.status === 'waiting').sort((a, b) => a.joinedAt - b.joinedAt);
  const eta = new Map();
  const take = (dur) => {
    for (;;) {
      const i = free.indexOf(Math.min(...free));
      const t = free[i];
      if (books.length && books[0][0] < t + dur) {
        const [s, m] = books.shift();
        free[i] = Math.max(t, s) + m;
        continue;
      }
      free[i] = t + dur;
      return t;
    }
  };
  for (const q of waiting) eta.set(q.id, take(q.minutes));
  const next = take(minutes);
  return { ahead: waiting.length, working: working.length, eta, waitMin: Math.max(0, next - now) };
}

// ---------- лист очікування ----------

// Клієнт просить повідомити, якщо на дату звільниться час у вказаному проміжку.
// Перевіряємо щоразу, коли хтось скасовує запис чи відкриває застосунок або панель.
function checkWaitlist(bookings) {
  const list = store.get('waitlist', []);
  const sent = [];
  for (const w of list) {
    if (w.status !== 'active') continue;
    if (w.date < opsToday()) { w.status = 'expired'; continue; }
    const p = opsPlace(w.placeId);
    if (!p) continue;
    const slot = openStarts(p, w.date, w.minutes, bookings).find((t) => toMin(t) >= w.from && toMin(t) + w.minutes <= w.to);
    if (!slot) continue;
    Object.assign(w, { status: 'notified', notifiedAt: Date.now(), slot });
    sent.push({
      placeId: p.id, clientKey: w.clientKey, channel: 'app', kind: 'waitlist',
      text: `${p.name}: звільнився час ${parseDate(w.date).toLocaleDateString('uk-UA', { day: 'numeric', month: 'long' })} о ${slot}. Встигніть записатися!`,
      link: `#/book/${p.id}/${w.date}/${slot}`,
    });
  }
  if (sent.length || list.some((w) => w.status === 'expired')) store.set('waitlist', list);
  if (sent.length) sendMessages(sent);
  return sent.length;
}

// Продаж абонемента чи сертифіката: точка отримує гроші одразу (через CARCAR — після 48 год).

function findCert(placeId, code) {
  const c = String(code ?? '').trim().toUpperCase();
  return passesOf(placeId).sold.find((s) => s.kind === 'cert' && s.code === c) ?? null;
}

// Списати з абонемента чи сертифіката; amount — сума, яку покриваємо. Повертає запис для бронювання.
function redeemPass(placeId, soldId, amount, bookingId) {
  const data = passesOf(placeId);
  const sold = data.sold.map((s) => {
    if (s.id !== soldId) return s;
    const h = [...s.history, { at: Date.now(), bookingId, amount }];
    return s.kind === 'sub' ? { ...s, visitsLeft: s.visitsLeft - 1, history: h } : { ...s, balance: s.balance - amount, history: h };
  });
  savePasses(placeId, { sold });
  return { soldId, amount };
}

// Повернути візит чи суму, якщо запис скасовано вчасно.
function restorePass(placeId, use) {
  if (!use) return;
  const data = passesOf(placeId);
  const sold = data.sold.map((s) => (s.id !== use.soldId ? s : s.kind === 'sub'
    ? { ...s, visitsLeft: s.visitsLeft + 1, history: [...s.history, { at: Date.now(), amount: -use.amount, note: 'повернення' }] }
    : { ...s, balance: s.balance + use.amount, history: [...s.history, { at: Date.now(), amount: -use.amount, note: 'повернення' }] }));
  savePasses(placeId, { sold });
}

// Графіки для панелі бізнесу й адмінки CARCAR: стовпчики (складені чи згруповані), горизонтальні
// смуги, легенда, таблиця під графіком і один тултип на сторінку. Палітра — змінні --series-1/2.

const compact = (v) => (v >= 1000 ? `${(v / 1000).toLocaleString('uk-UA', { maximumFractionDigits: 1 })} тис.` : String(Math.round(v)));

function niceMax(v) {
  if (v <= 0) return 4;
  const step = 10 ** Math.floor(Math.log10(v / 4));
  const m = [1, 2, 2.5, 5, 10].find((k) => (v / 4) <= k * step) * step;
  return m * 4;
}

const topRound = (x, y, w, h) => {
  const r = Math.min(4, h / 2, w / 2);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
};

// Стовпчики (одна серія або дві складені), з тултипом на кожну категорію.
function drawColumns(el, spec) {
  const W = Math.max(280, el.clientWidth);
  const H = spec.height ?? 220;
  const L = 52, R = 6, T = 10, B = 26;
  const n = spec.cats.length;
  const sums = spec.cats.map((c) => c.values.reduce((a, v) => a + v, 0));
  const max = niceMax(Math.max(...(spec.grouped ? spec.cats.flatMap((c) => c.values) : sums), 0));
  const band = (W - L - R) / n;
  const bw = Math.max(2, Math.min(spec.grouped ? 40 : 24, band * (spec.grouped ? 0.76 : 0.66)));
  const y = (v) => T + (H - T - B) * (1 - v / max);
  const every = Math.ceil(n / Math.max(1, Math.floor((W - L) / 56)));
  let g = '<g class="grid">';
  for (let i = 0; i <= 4; i++) {
    const v = (max / 4) * i;
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${compact(v)}</text>`;
  }
  g += '</g>';
  let marks = '';
  let hits = '';
  spec.cats.forEach((c, i) => {
    const x = L + band * i + (band - bw) / 2;
    let base = H - B;
    // Згруповані стовпчики стоять поруч із проміжком 2 px; складені — один над одним.
    if (spec.grouped) {
      const k = c.values.length;
      const w = Math.max(1, (bw - 2 * (k - 1)) / k);
      c.values.forEach((v, s) => {
        const h = (H - T - B) * (v / max);
        if (h > 0) marks += `<path class="s${s + 1}" d="${topRound(x + s * (w + 2), H - B - h, w, h)}"/>`;
      });
    } else c.values.forEach((v, s) => {
      if (v <= 0) return;
      const h = (H - T - B) * (v / max) - (base < H - B ? 2 : 0);
      if (h <= 0) return;
      const top = base - h - (base < H - B ? 2 : 0);
      const isTop = c.values.slice(s + 1).every((u) => u <= 0);
      marks += isTop
        ? `<path class="s${s + 1}" d="${topRound(x, top, bw, h)}"/>`
        : `<rect class="s${s + 1}" x="${x}" y="${top}" width="${bw}" height="${h}"/>`;
      base = top;
    });
    if (i % every === 0) marks += `<text class="axis" x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(c.short ?? c.label)}</text>`;
    const tip = { t: c.label, r: spec.series.map((s, k) => [`s${k + 1}`, spec.fmt(c.values[k]), s]) };
    if (spec.grouped) tip.r.push(['', spec.fmt(c.values[0] - c.values[1]), 'Різниця']);
    else if (spec.series.length > 1) tip.r.push(['', spec.fmt(sums[i]), 'Разом']);
    const aria = `${c.label}: ${spec.series.map((s, k) => `${s} ${spec.fmt(c.values[k])}`).join(', ')}`;
    hits += `<rect class="hit" role="img" tabindex="0" aria-label="${esc(aria)}" data-tip="${esc(JSON.stringify(tip))}" x="${L + band * i}" y="${T}" width="${band}" height="${H - T - B}"/>`;
  });
  el.innerHTML = `<svg width="${W}" height="${H}" role="group" aria-label="${esc(spec.title)}">${g}${marks}${hits}</svg>`;
}

const legend = (names) => `<ul class="legend">${names.map((n, i) => `<li><i class="s${i + 1}"></i>${esc(n)}</li>`).join('')}</ul>`;

function hbars(items, fmt) {
  const max = Math.max(...items.map((i) => i.value), 1);
  return `<ul class="hbars">${items.map((i) => `<li>
    <span class="name" title="${esc(i.name)}">${esc(i.name)}</span>
    <span class="track"><span class="fill" style="width:${Math.max(1, (i.value / max) * 100)}%"></span></span>
    <span class="val">${fmt(i.value)}</span></li>`).join('')}</ul>`;
}

// Один тултип на сторінку; значення першим, назва серії — після. Вставляємо через textContent.
function showTip(target, x, y) {
  const data = JSON.parse(target.dataset.tip);
  const tip = document.getElementById('tip');
  tip.replaceChildren();
  const t = document.createElement('div');
  t.className = 't';
  t.textContent = data.t;
  tip.append(t);
  for (const [cls, value, name] of data.r) {
    const row = document.createElement('div');
    row.className = 'r';
    const k = document.createElement('span');
    k.className = 'k';
    k.style.background = cls ? `var(--series-${cls.slice(1)})` : 'transparent';
    const v = document.createElement('b');
    v.textContent = value;
    const n = document.createElement('span');
    n.textContent = name;
    row.append(k, v, n);
    tip.append(row);
  }
  tip.hidden = false;
  const r = tip.getBoundingClientRect();
  const left = Math.min(window.innerWidth - r.width - 8, Math.max(8, x + 14));
  const top = y - r.height - 12 < 8 ? y + 16 : y - r.height - 12;
  tip.style.left = `${left}px`;
  tip.style.top = `${top}px`;
}
const hideTip = () => { document.getElementById('tip').hidden = true; };

document.addEventListener('pointermove', (e) => {
  const t = e.target.closest?.('[data-tip]');
  if (t) showTip(t, e.clientX, e.clientY); else hideTip();
});
document.addEventListener('focusin', (e) => {
  const t = e.target.closest?.('[data-tip]');
  if (!t) return hideTip();
  const r = t.getBoundingClientRect();
  showTip(t, r.left + r.width / 2, r.top);
});

// Підключення точки до CARCAR: перевірка кодів ФОП і ТОВ, IBAN і текст договору-оферти.
// Спільне для панелі бізнесу (business.js) і адмінки CARCAR (admin.js).
// Перевірки локальні: формат і контрольні суми. Звірку з ЄДР і банком робить модератор
// (а в робочій версії — сервер через офіційні реєстри).

const digits = (s) => [...String(s)].map(Number);

// РНОКПП (ідентифікаційний номер ФОП): 10 цифр, остання — контрольна.
function rnokppValid(code) {
  if (!/^\d{10}$/.test(code)) return false;
  const d = digits(code);
  const w = [-1, 5, 7, 9, 4, 6, 10, 5, 7];
  return (w.reduce((a, k, i) => a + k * d[i], 0) % 11) % 10 === d[9];
}

// Код ЄДРПОУ юридичної особи: 8 цифр, остання — контрольна; ваги залежать від діапазону коду.
function edrpouValid(code) {
  if (!/^\d{8}$/.test(code)) return false;
  const d = digits(code);
  const n = Number(code);
  const w = n < 30000000 || n > 60000000 ? [1, 2, 3, 4, 5, 6, 7] : [7, 1, 2, 3, 4, 5, 6];
  let s = w.reduce((a, k, i) => a + k * d[i], 0) % 11;
  if (s === 10) {
    s = w.reduce((a, k, i) => a + (k + 2) * d[i], 0) % 11;
    if (s === 10) s = 0;
  }
  return s === d[7];
}

const codeValid = (type, code) => (type === 'fop' ? rnokppValid(code) : edrpouValid(code));

const normIban = (s) => String(s ?? '').replace(/\s+/g, '').toUpperCase();

// Український IBAN: UA, 2 контрольні цифри, 6 цифр МФО банку й 19 символів рахунку; перевірка mod 97.
function ibanValid(raw) {
  const iban = normIban(raw);
  if (!/^UA\d{27}$/.test(iban)) return false;
  const moved = `${iban.slice(4)}${iban.slice(0, 4)}`.replace(/[A-Z]/g, (c) => String(c.charCodeAt(0) - 55));
  let r = 0;
  for (const ch of moved) r = (r * 10 + Number(ch)) % 97;
  return r === 1;
}

const formatIban = (raw) => normIban(raw).replace(/(.{4})/g, '$1 ').trim();

// Банк за МФО (цифри 5–10 IBAN) — для підказки; невідомий МФО просто показуємо числом.

  const mfo = normIban(raw).slice(4, 10);
  return mfo.length === 6 ? `${BANKS[mfo] ?? 'Банк'} (МФО ${mfo})` : '';
}

  const c = partner.company ?? {};

  if (!c.type || !c.name?.trim() || !codeValid(c.type, c.code ?? '') || !c.tax || !c.email?.trim() || !c.phone?.trim() || (c.type === 'tov' && !c.director?.trim())) out.push('Юридична особа');

  const pay = partner.payout ?? {};
  if (!ibanValid(pay.iban) || !pay.holder?.trim() || pay.code !== c.code) out.push('Реквізити для виплат');
  if (partner.offer?.version !== OFFER.version) out.push('Договір-оферта');
  return out;
}
