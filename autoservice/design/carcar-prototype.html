// ---------- гарячі вікна ----------

// Два види знижок на час: гаряче вікно на конкретну дату (date) і щотижневі «щасливі години»
// (days — дні тижня, 0 — понеділок). Знижка діє на запис, що починається у вікні.
const allDeals = (placeId) => (store.peek('biz.deals', {})[placeId] ?? []).filter((d) => d.active !== false);
const dealsOf = (placeId) => allDeals(placeId).filter((d) => (d.days ? !d.until || d.until >= opsToday() : d.date >= opsToday()));
const weeklyDealsOf = (placeId) => dealsOf(placeId).filter((d) => d.days);

// Усі знижки, що діють на дату, — разові й щотижневі, з датою для зручності.
function dealsOn(placeId, date) {
  const wd = weekdayOf(date);
  return dealsOf(placeId).filter((d) => (d.days ? d.days.includes(wd) && (!d.until || date <= d.until) : d.date === date)).map((d) => ({ ...d, date }))
    .sort((a, b) => a.from - b.from);
}

function dealAt(placeId, date, time) {
  const t = toMin(time);
  return dealsOn(placeId, date).filter((d) => t >= d.from && t < d.to).sort((a, b) => b.pct - a.pct)[0] ?? null;
}

const dealPrice = (price, pct) => Math.round((price * (100 - pct)) / 100 / 10) * 10;
// Чи діє знижка на послугу: на всі послуги або лише на обрані точкою.
const dealCovers = (deal, serviceId) => !!deal && (!deal.services?.length || deal.services.includes(serviceId));

const OPS_WD = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'];
// «Пн–Пт», «Сб–Нд», «Щодня» або перелік днів.
function daysText(days) {
  const d = [...days].sort((a, b) => a - b);
  if (d.length === 7) return 'Щодня';
  const runs = [];
  for (const x of d) {
    const last = runs.at(-1);
    if (last && x === last[1] + 1) last[1] = x; else runs.push([x, x]);
  }
  return runs.map(([a, z]) => (a === z ? OPS_WD[a] : z === a + 1 ? `${OPS_WD[a]}, ${OPS_WD[z]}` : `${OPS_WD[a]}–${OPS_WD[z]}`)).join(', ');
}

// Гарячі пропозиції для каталогу: знижки на сьогодні й завтра, у яких ще є вільний час.
function hotDeals(bookings, city = null) {
  const out = [];
  const next = parseDate(opsToday());
  next.setDate(next.getDate() + 1);
  const days = [opsToday(), isoDate(next)];
  // Лише мийки обраного міста, без паузи онлайн-запису; час — для послуг, на які діє знижка.
  for (const p of PLACES.filter((x) => isListed(x) && (!city || (x.city ?? 'Київ') === city) && !pauseOf(x.id, bookings))) {
    for (const date of days) {
      for (const d of dealsOn(p.id, date)) {
        const covered = p.services.filter((s) => dealCovers(d, s.id));
        if (!covered.length) continue;
        const minMin = Math.min(...covered.map((s) => s.min));
        const free = openStarts(p, date, minMin, bookings).filter((x) => toMin(x) >= d.from && toMin(x) < d.to);
        if (free.length) out.push({ place: p, deal: d, free });
      }
    }
  }
  return out.sort((a, b) => (a.deal.date + opsPad(a.deal.from)).localeCompare(b.deal.date + opsPad(b.deal.from)));
}
const opsPad = (n) => String(n).padStart(4, '0');

// ---------- жива черга ----------

// Черга на сьогодні: авто, що чекають, і ті, що вже в боксі.
function queueOf(placeId) {
  const day = opsToday();
  return (store.peek('biz.queue', {})[placeId] ?? []).filter((q) => q.day === day);
}
const queueEnabled = (p) => store.peek('biz.queueOn', {})[p.id] ?? p.cats[0] === 'wash';

function saveQueue(placeId, list) {
  const all = store.get('biz.queue', {});
  all[placeId] = list;
  store.set('biz.queue', all);
}

// Оцінка: хто коли потрапить у бокс. Авто в роботі займають бокс до кінця; записи на сьогодні
// мають пріоритет, якщо машина з черги не встигне до їхнього початку. Повертає час для кожного
// з тих, хто чекає, і для нового авто тривалістю minutes.
function queueEstimate(place, bookings, minutes = 30) {
  const now = opsNow();
  const list = queueOf(place.id);
  const free = Array(place.boxes).fill(now);
  const working = list.filter((q) => q.status === 'working');
  for (const q of working) {
    const i = free.indexOf(Math.min(...free));
    free[i] = Math.max(now, toMin(q.startedTime) + q.minutes);
  }
  const day = opsToday();
  const books = bookings.filter((b) => b.placeId === place.id && b.date === day && BLOCKING.includes(b.state))
    .map((b) => [toMin(b.time), b.minutes]).filter(([s, m]) => s + m > now).sort((a, b) => a[0] - b[0]);
  // Записи, що вже йдуть, займають бокс до кінця.
  while (books.length && books[0][0] <= now) {
    const [s, m] = books.shift();
    const i = free.indexOf(Math.min(...free));
    free[i] = Math.max(free[i], s + m);
  }
  const waiting = list.filter((q) => q.status === 'waiting').sort((a, b) => a.joinedAt - b.joinedAt);
  const eta = new Map();
  const take = (dur) => {
    for (;;) {
      const i = free.indexOf(Math.min(...free));
      const t = free[i];
      if (books.length && books[0][0] < t + dur) {
        const [s, m] = books.shift();
        free[i] = Math.max(t, s) + m;
        continue;
      }
      free[i] = t + dur;
      return t;
    }
  };
  for (const q of waiting) eta.set(q.id, take(q.minutes));
  const next = take(minutes);
  return { ahead: waiting.length, working: working.length, eta, waitMin: Math.max(0, next - now) };
}

// ---------- лист очікування ----------

// Клієнт просить повідомити, якщо на дату звільниться час у вказаному проміжку.
// Перевіряємо щоразу, коли хтось скасовує запис чи відкриває застосунок або панель.
function checkWaitlist(bookings) {
  const list = store.get('waitlist', []);
  const sent = [];
  for (const w of list) {
    if (w.status !== 'active') continue;
    if (w.date < opsToday()) { w.status = 'expired'; continue; }
    const p = opsPlace(w.placeId);
    if (!p || !isListed(p) || pauseOf(p.id, bookings)) continue;
    const slot = openStarts(p, w.date, w.minutes, bookings, { mobile: !!w.mobile }).find((t) => toMin(t) >= w.from && toMin(t) + w.minutes <= w.to);
    if (!slot) continue;
    Object.assign(w, { status: 'notified', notifiedAt: Date.now(), slot });
    sent.push({
      placeId: p.id, clientKey: w.clientKey, channel: 'app', kind: 'waitlist',
      text: `${p.name}: звільнився час ${parseDate(w.date).toLocaleDateString('uk-UA', { day: 'numeric', month: 'long' })} о ${slot}. Встигніть записатися!`,
      link: `#/book/${p.id}/${w.date}/${slot}`,
    });
  }
  if (sent.length || list.some((w) => w.status === 'expired')) store.set('waitlist', list);
  if (sent.length) sendMessages(sent);
  return sent.length;
}

// ---------- абонементи й сертифікати ----------

const PASS_KIND = { sub: 'Абонемент', cert: 'Подарунковий сертифікат' };
const passesOf = (placeId) => ({ plans: [], sold: [], ...store.peek('biz.passes', {})[placeId] });

function savePasses(placeId, patch) {
  const all = store.get('biz.passes', {});
  all[placeId] = { ...passesOf(placeId), ...patch };
  store.set('biz.passes', all);
}

function passCode() {
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const part = () => Array.from({ length: 4 }, () => abc[Math.floor(Math.random() * abc.length)]).join('');
  return `CC-${part()}-${part()}`;
}

// Продаж абонемента чи сертифіката: точка отримує гроші одразу (через CARCAR — після 48 год).
function sellPass(placeId, plan, buyer) {
  const valid = new Date();
  valid.setDate(valid.getDate() + (plan.validDays ?? (plan.kind === 'sub' ? 30 : 365)));
  const sold = {
    id: uid(), planId: plan.id, kind: plan.kind, name: plan.name, price: plan.price, code: passCode(),
    services: plan.services ?? [], visitsLeft: plan.kind === 'sub' ? plan.visits : null, visits: plan.visits ?? null,
    balance: plan.kind === 'cert' ? plan.amount ?? plan.price : null, validUntil: isoDate(valid), soldAt: Date.now(),
    history: [], ...buyer,
  };
  savePasses(placeId, { sold: [...passesOf(placeId).sold, sold] });
  return sold;
}

const passActive = (s) => s.validUntil >= opsToday() && (s.kind === 'sub' ? s.visitsLeft > 0 : s.balance > 0);
const passLeft = (s) => (s.kind === 'sub' ? `${s.visitsLeft} з ${s.visits} ${plural(s.visits, 'візиту', 'візитів', 'візитів')}` : `${s.balance.toLocaleString('uk-UA')} ₴`);

// Абонементи клієнта в точці, що покривають хоч одну з обраних послуг.
function usableSubs(placeId, keys, serviceIds) {
  return passesOf(placeId).sold.filter((s) => s.kind === 'sub' && passActive(s) && keys.includes(s.clientKey)
    && serviceIds.some((id) => !s.services.length || s.services.includes(id)));
}

function findCert(placeId, code) {
  const c = String(code ?? '').trim().toUpperCase();
  return passesOf(placeId).sold.find((s) => s.kind === 'cert' && s.code === c) ?? null;
}

// Списати з абонемента чи сертифіката; amount — сума, яку покриваємо. Повертає запис для бронювання.
function redeemPass(placeId, soldId, amount, bookingId) {
  const data = passesOf(placeId);
  const sold = data.sold.map((s) => {
    if (s.id !== soldId) return s;
    const h = [...s.history, { at: Date.now(), bookingId, amount }];
    return s.kind === 'sub' ? { ...s, visitsLeft: s.visitsLeft - 1, history: h } : { ...s, balance: s.balance - amount, history: h };
  });
  savePasses(placeId, { sold });
  return { soldId, amount, bookingId };
}

// Повернути візит чи суму, якщо запис скасовано вчасно.
function restorePass(placeId, use) {
  if (!use) return;
  const data = passesOf(placeId);
  const sold = data.sold.map((s) => (s.id !== use.soldId ? s : s.kind === 'sub'
    ? { ...s, visitsLeft: s.visitsLeft + 1, history: [...s.history, { at: Date.now(), bookingId: use.bookingId, amount: -use.amount, note: 'повернення' }] }
    : { ...s, balance: s.balance + use.amount, history: [...s.history, { at: Date.now(), bookingId: use.bookingId, amount: -use.amount, note: 'повернення' }] }));
  savePasses(placeId, { sold });
}

const clientKeyOf = (phone, car) => phoneKey(phone) ?? (car ? `car:${car}` : null);

// ---------- підтвердження запису мийкою ----------

// Мийка сама вирішує, чи приймати запис на цей час. Без автопідтвердження запис із застосунку
// чекає її відповіді (state: 'pending'), час уже зайнятий, а гроші утримує CARCAR.
const autoConfirmOf = (placeId) => !!store.peek('biz.autoConfirm', {})[placeId];
function setAutoConfirm(placeId, on) {
  store.set('biz.autoConfirm', { ...store.get('biz.autoConfirm', {}), [placeId]: on });
}

// Відповідь мийки клієнт бачить у чаті запису й отримує сповіщення.
function clientNote(b, kind, text) {
  chatPost(b, 'sys', text.replace(/^[^:]+: /, ''), 'client');
  sendMessages([{ placeId: b.placeId, clientKey: b.clientId ?? 'device', channel: 'app', kind, bookingId: b.id, text, link: `#/bookings/${b.id}` }]);
}
const opsPlaceName = (b) => opsPlace(b.placeId)?.name ?? 'Мийка';
const whenText = (b) => `${parseDate(b.date).toLocaleDateString('uk-UA', { day: 'numeric', month: 'long' })} о ${b.time}`;

// Дії мийки виконуються лише над записом, що досі чекає відповіді: інакше повертають false
// (запис міг скасуватися сам чи його скасував клієнт, поки була відкрита шторка).
function acceptBooking(b) {
  if (b?.state !== 'pending') return false;
  Object.assign(b, { state: 'paid', confirmedAt: Date.now(), respondedAt: b.respondedAt ?? Date.now() });
  clientNote(b, 'confirm', `${opsPlaceName(b)}: запис на ${whenText(b)} підтверджено. Чекаємо вас!`);
  return true;
}

// Відмова чи мовчання мийки: усе повертаємо клієнту — картку на картку, баланс і бонуси на рахунок CARCAR,
// візит абонемента й промокод знову доступні.
// by: place — мийка відмовила; timeout — мийка не відповіла; proposal — клієнт не прийняв інший час.
function declineBooking(b, reason, by = 'place') {
  if (by === 'proposal' ? b?.state !== 'offer' : b?.state !== 'pending') return false;
  const fromBalance = b.fromBalance || 0;
  // Повертаємо те, що клієнт справді заплатив (за оплати частинами — перший платіж, решту банк скасовує).
  const refund = chargedOf(b);
  Object.assign(b, {
    state: 'cancelled', declined: by, declineReason: reason, refund, placeAmount: 0, refundTo: fromBalance >= refund ? 'balance' : 'card',
    // Мовчання мийки й непідтверджений клієнтом інший час — не скасування клієнтом.
    closedAt: Date.now(), cancelBy: by === 'place' ? 'place' : 'system',
    ...(by === 'place' && !b.respondedAt ? { respondedAt: Date.now() } : {}),
    ...(b.installments ? { installments: { ...b.installments, cancelled: Date.now() } } : {}),
  });
  const why = by === 'proposal' ? 'інший час не підійшов' : `${opsPlaceName(b)} не підтвердила запис`;
  if (fromBalance) creditClient(Math.min(fromBalance, refund), `Повернення: ${why}`, b.clientId, b.id);
  if (b.bonus && !b.bonusReturned) {
    creditBonus(b.bonus, `Повернення бонусу: ${why}`, b.clientId, b.id);
    b.bonusReturned = true;
  }
  if (b.passUse) { restorePass(b.placeId, b.passUse); b.passUse = null; }
  if (b.promo) b.promo.returned = true;
  if (by === 'proposal') return;
  clientNote(b, 'decline', by === 'timeout'
    ? `${opsPlaceName(b)} не відповіла на запис на ${whenText(b)}. Запис скасовано, гроші повернуто. Оберіть інший час чи мийку.`
    : `${opsPlaceName(b)} не може прийняти запис на ${whenText(b)}${reason ? `: ${reason}` : ''}. Гроші повернуто. Оберіть інший час чи мийку.`);
  return true;
}

// Замість відмови мийка пропонує інший вільний час. Запис одразу переходить на нього (щоб час не зайняли),
// а клієнт погоджується або скасовує без втрат.
function proposeTime(b, date, time, note = '') {
  if (b?.state !== 'pending') return false;
  const from = { date: b.date, time: b.time };
  note = hidePhones(note); // номер мийки — лише через CARCAR
  Object.assign(b, { state: 'offer', date, time, offer: { from, at: Date.now(), note }, respondedAt: b.respondedAt ?? Date.now() });
  clientNote(b, 'offer', `${opsPlaceName(b)} не може прийняти вас ${parseDate(from.date).toLocaleDateString('uk-UA', { day: 'numeric', month: 'long' })} о ${from.time} і пропонує ${whenText(b)}.${note ? ` ${note}` : ''} Погодьтеся в записі або скасуйте без втрат.`);
  return true;
}

function acceptOffer(b) {
  if (b?.state !== 'offer') return false;
  Object.assign(b, { state: 'paid', confirmedAt: Date.now(), offer: { ...b.offer, accepted: Date.now() } });
  chatPost(b, 'sys', `Клієнт погодився на ${whenText(b)}`, 'biz');
  return true;
}

function rejectOffer(b, timeout = false) {
  if (b?.state !== 'offer') return false;
  // Повертаємо початковий час, щоб у журналі було видно, на що клієнт записувався.
  Object.assign(b, { date: b.offer.from.date, time: b.offer.from.time, offer: { ...b.offer, rejected: Date.now() } });
  declineBooking(b, timeout ? 'клієнт не відповів на запропонований час' : 'клієнту не підійшов запропонований час', 'proposal');
  chatPost(b, 'sys', timeout ? 'Клієнт не відповів на запропонований час — запис скасовано, гроші повернуто' : 'Клієнту не підійшов запропонований час — запис скасовано, гроші повернуто', 'biz');
  return true;
}

// Заявки, на які мийка не відповіла вчасно, скасовуються самі. Повертає true, якщо щось змінилося.
function expirePending(bookings) {
  let changed = false;
  for (const b of bookings) {
    if (b.state === 'pending' && Date.now() >= confirmBy(b)) { declineBooking(b, 'мийка не відповіла вчасно', 'timeout'); changed = true; }
    if (b.state === 'offer' && Date.now() >= offerBy(b)) { rejectOffer(b, true); changed = true; }
  }
  return changed;
}

// Неявка чи запізнення понад lateMinutes: оплата точці, але, як і після «Машина готова»,
// гроші заморожені на freezeHours — клієнт може оскаржити. Позначити можна лише після початку + lateMinutes.
const noShowFrom = (b) => bookingStartMs(b) + PAYMENT.lateMinutes * 60000;
const bookingStartMs = (b) => { const d = parseDate(b.date); d.setMinutes(toMin(b.time)); return d.getTime(); };
function markNoShow(b, late = false) {
  if (b?.state !== 'paid' || Date.now() < noShowFrom(b)) return false;
  const placeAmount = Math.round(price(b) * PAYMENT.noShowShare);
  Object.assign(b, { state: 'noshow', placeAmount, refund: 0, closedAt: Date.now(), unfreezeAt: Date.now() + PAYMENT.freezeHours * HOUR, ...(late ? { lateForfeit: true } : {}) });
  return true;
}

// ---------- картка лояльності ----------
// Мийка вмикає «кожна N-та мийка — зі знижкою pct%» (100% — безкоштовно). Рахуються візити через CARCAR,
// виконані в цій мийці; знижку дає сама мийка (з її виручки, комісія CARCAR — з того, що заплатив клієнт).
const loyaltyOf = (placeId) => passesOf(placeId).loyalty ?? null;
function loyaltyState(placeId, myBookings) {
  const l = loyaltyOf(placeId);
  if (!l?.on || !(l.every >= 2)) return null;
  const done = myBookings.filter((b) => b.placeId === placeId && b.state === 'completed')
    .sort((a, b) => (a.completedAt ?? a.createdAt ?? 0) - (b.completedAt ?? b.createdAt ?? 0));
  let stamps = 0;
  for (const b of done) stamps = b.loyalty ? 0 : stamps + 1;
  const reserved = myBookings.some((b) => b.placeId === placeId && b.loyalty && [...ACTIVE, 'unpaid'].includes(b.state));
  const need = l.every - 1;
  return { every: l.every, pct: l.pct ?? 100, stamps: Math.min(stamps, need), need, due: !reserved && stamps >= need, reserved };
}

// ---------- каса й зміни ----------
// День мийки: виконані записи — готівка й картка на місці (свої клієнти), через CARCAR, продані абонементи.
function cashDay(bookings, placeId, date) {
  // Гроші — того дня, коли запис виконали (а не на який записувались).
  const doneDay = (b) => (b.completedAt ? isoDate(new Date(b.completedAt)) : b.date);
  const list = bookings.filter((b) => b.placeId === placeId && doneDay(b) === date && b.state === 'completed');
  const out = { date, cars: list.length, cash: 0, card: 0, carcar: 0, passes: 0, passCash: 0, passCard: 0, list };
  for (const b of list) {
    if (isCarcar(b)) out.carcar += price(b);
    else if (b.payment === 'cash') out.cash += Number(b.paid) || 0;
    else out.card += Number(b.paid) || 0;
  }
  for (const x of passesOf(placeId).sold) {
    if (x.buyer !== 'place' || isoDate(new Date(x.soldAt)) !== date) continue;
    out.passes += x.price;
    if (x.payment === 'cash') out.passCash += x.price; else out.passCard += x.price;
  }
  out.total = out.cash + out.card + out.carcar + out.passes;
  out.drawer = out.cash + out.passCash; // має бути в касі готівкою
  return out;
}
const shiftsOf = (placeId) => store.peek('biz.shifts', []).filter((x) => x.placeId === placeId).sort((a, b) => b.date.localeCompare(a.date));
const shiftOn = (placeId, date) => shiftsOf(placeId).find((x) => x.date === date) ?? null;
function closeShift(placeId, day, counted, note) {
  const shift = {
    id: `${placeId}:${day.date}`, placeId, date: day.date, cars: day.cars, cash: day.cash, card: day.card, carcar: day.carcar, passes: day.passes,
    total: day.total, drawer: day.drawer, counted, diff: counted === null ? null : counted - day.drawer, note, closedAt: Date.now(),
  };
  store.set('biz.shifts', [...store.get('biz.shifts', []).filter((x) => x.id !== shift.id), shift]);
  return shift;
}

// ---------- зарплата мийників ----------
// Відсоток від вартості послуг і/або фіксована сума за авто — з виконаних записів, де призначено цього мийника.
function salaryFor(w, bookings, placeId, from, to) {
  const day = (b) => (b.completedAt ? isoDate(new Date(b.completedAt)) : b.date);
  const list = bookings.filter((b) => b.placeId === placeId && b.masterId === w.id && b.state === 'completed' && day(b) >= from && day(b) <= to);
  // Робота за абонементом чи безкоштовна мийка за карткою лояльності — теж робота мийника.
  const revenue = list.reduce((a, b) => a + (isCarcar(b) ? price(b) : Number(b.paid) || 0) + (b.covered || 0) + (b.loyalty?.amount || 0), 0);
  const pay = Math.round((revenue * (Number(w.pct) || 0)) / 100 + list.length * (Number(w.perCar) || 0));
  return { cars: list.length, revenue, pay };
}

// ---------- витратні матеріали ----------
// Для кожного матеріалу: залишок, мінімум (нижче — попередження) і витрата на одне авто для обраних послуг.
const stockOf = (placeId) => store.peek('biz.stock', {})[placeId] ?? [];
function saveStock(placeId, list) {
  store.set('biz.stock', { ...store.get('biz.stock', {}), [placeId]: list });
}
const stockLow = (x) => Number(x.min) > 0 && Number(x.qty) <= Number(x.min);
const round2 = (n) => Math.round(n * 100) / 100;
// Списати матеріали на виконаний запис (один раз). Повертає назви тих, що щойно стали на мінімумі.
function useStock(b) {
  if (b.stockUsed) return [];
  b.stockUsed = true;
  const list = stockOf(b.placeId);
  const low = [];
  const next = list.map((x) => {
    const hit = Number(x.per) > 0 && (!x.services?.length || b.services.some((n) => x.services.includes(n)));
    if (!hit) return x;
    const y = { ...x, qty: Math.max(0, round2(Number(x.qty) - Number(x.per))) };
    if (!stockLow(x) && stockLow(y)) low.push(x.name);
    return y;
  });
  if (list.length) saveStock(b.placeId, next);
  return low;
}

// ---------- нотатки й мітки про клієнтів ----------
// Бачить лише мийка (на сервері — тільки її акаунт). Клієнт CARCAR — за хешем номера, свій — за номером.
const NOTE_TAGS = ['VIP', 'Постійний', 'Любить віск', 'Без поспіху', 'Проблемний'];
const clientNoteKey = (b) => (b.clientId && b.clientId !== 'device' ? b.clientId
  : b.clientPhone ? phoneKey(b.clientPhone) ?? b.clientPhone : b.clientName ? `name:${b.clientName.toLowerCase()}` : null);

// Інтерактивна карта з двома шарами:
// «Детальна» — вулиці й будинки з тайлів OpenStreetMap (потрібен інтернет);
// «Схема» — власна спрощена карта Києва (межа міста, Дніпро, райони), працює без інтернету,
// зокрема під час відключень. Якщо тайли не завантажуються, карта сама перемикається на схему.
// Проєкція — Web Mercator, як у тайлів: одиниця карти — піксель світу на масштабі 12.

const MAP_Z0 = 12;
const MAP_TILE = 256;
const MAP_BOX = { minLat: 50.29, maxLat: 50.61, minLng: 30.22, maxLng: 30.82 };
const mapMerc = (lat, lng, z) => {
  const size = MAP_TILE * 2 ** z;
  const sin = Math.sin((lat * Math.PI) / 180);
  return [((lng + 180) / 360) * size, (0.5 - Math.log((1 + sin) / (1 - sin)) / (4 * Math.PI)) * size];
};
const MAP_ORIGIN = mapMerc(MAP_BOX.maxLat, MAP_BOX.minLng, MAP_Z0);
const mapProject = (lat, lng) => { const [x, y] = mapMerc(lat, lng, MAP_Z0); return [x - MAP_ORIGIN[0], y - MAP_ORIGIN[1]]; };
const [MAP_W, MAP_H] = mapProject(MAP_BOX.minLat, MAP_BOX.maxLng);
// Зворотна проєкція: точка карти → широта й довгота (для вибору адреси на карті).
const mapUnproject = (x, y) => {
  const size = MAP_TILE * 2 ** MAP_Z0;
  const mx = (x + MAP_ORIGIN[0]) / size;
  const my = (y + MAP_ORIGIN[1]) / size;
  return { lat: (Math.atan(Math.sinh(Math.PI * (1 - 2 * my))) * 180) / Math.PI, lng: mx * 360 - 180 };
};
const TILE_URL = (z, x, y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;

// Спрощена межа міста й русло Дніпра (широта, довгота) — для схеми.
const KYIV_OUTLINE = [[50.59, 30.47], [50.585, 30.56], [50.56, 30.64], [50.53, 30.72], [50.48, 30.78], [50.42, 30.79], [50.37, 30.74],
  [50.33, 30.68], [50.31, 30.6], [50.32, 30.52], [50.35, 30.45], [50.38, 30.37], [50.41, 30.3], [50.45, 30.25], [50.5, 30.28], [50.54, 30.33],
  [50.565, 30.4]];
const DNIPRO = [[50.62, 30.505], [50.585, 30.515], [50.55, 30.525], [50.515, 30.53], [50.49, 30.545], [50.47, 30.56], [50.455, 30.575],
  [50.44, 30.575], [50.425, 30.58], [50.41, 30.59], [50.39, 30.6], [50.37, 30.61], [50.345, 30.625], [50.32, 30.64], [50.28, 30.66]];
const RUSANIVKA = [[50.455, 30.585], [50.445, 30.6], [50.43, 30.6], [50.42, 30.59]];
const DESNA = [[50.6, 30.56], [50.58, 30.545], [50.56, 30.535]];

const pathOf = (pts) => pts.map(([la, ln], i) => `${i ? 'L' : 'M'}${mapProject(la, ln).map((v) => v.toFixed(1)).join(',')}`).join('');

let mapResize = null;

// Малює карту в el і повертає { setPins, draw }. opts: places — [{ id, lat, lng, html, label, cls }],
// pos — {lat, lng} користувача, state — стан між перемальовуваннями (x, y, z, sel, layer),
// onSelect(id), onLayer(layer) — щоб застосунок запамʼятав вибір шару;
// onPick(lat, lng) — дотик до порожнього місця карти (вибір адреси), pick — уже обрана точка.
function mountMap(el, opts) {
  const st = opts.state;
  const W = () => el.clientWidth;
  const H = () => el.clientHeight;
  st.layer ??= navigator.onLine === false ? 'scheme' : 'detail';
  const fit = (list) => {
    const pts = list.map((p) => mapProject(p.lat, p.lng));
    const xs = pts.map((p) => p[0]);
    const ys = pts.map((p) => p[1]);
    // Без точок — центр обраного міста.
    const [cx, cy] = opts.center ? mapProject(opts.center.lat, opts.center.lng) : [MAP_W / 2, MAP_H / 2];
    st.x = xs.length ? (Math.min(...xs) + Math.max(...xs)) / 2 : cx;
    st.y = ys.length ? (Math.min(...ys) + Math.max(...ys)) / 2 : cy;
    // Усі точки з полями, але не ближче за кілька кварталів.
    const spanX = xs.length ? Math.max(...xs) - Math.min(...xs) : MAP_W * 0.6;
    const spanY = ys.length ? Math.max(...ys) - Math.min(...ys) : MAP_H * 0.6;
    st.z = Math.max(0.25, Math.min(4, (W() - 80) / Math.max(spanX, 60), (H() - 100) / Math.max(spanY, 60)));
  };
  if (!st.z) fit(opts.places);
  el.innerHTML = `<div class="map-tiles" aria-hidden="true"></div>
    <svg class="map-svg" aria-hidden="true" preserveAspectRatio="none">
      <rect class="map-land-out" x="-2000" y="-2000" width="${MAP_W + 4000}" height="${MAP_H + 4000}"/>
      ${!opts.city || opts.city === 'Київ' ? `<path class="map-city" d="${pathOf(KYIV_OUTLINE)}Z"/>
      <path class="map-water" d="${pathOf(DNIPRO)}"/>
      <path class="map-water thin" d="${pathOf(RUSANIVKA)}"/>
      <path class="map-water thin" d="${pathOf(DESNA)}"/>
      ${Object.entries(DISTRICTS).map(([name, [la, ln]]) => { const [x, y] = mapProject(la, ln); return `<text class="map-label" x="${x}" y="${y}">${name}</text>`; }).join('')}` : ''}
    </svg>
    <div class="map-pins"></div>
    <div class="map-ctrl">
      <button type="button" class="map-btn" data-map="in" aria-label="Наблизити">+</button>
      <button type="button" class="map-btn" data-map="out" aria-label="Віддалити">−</button>
      <button type="button" class="map-btn" data-map="fit" aria-label="Усі точки">⤢</button>
    </div>
    <div class="map-layers" role="group" aria-label="Шар карти">
      <button type="button" data-map="detail">Детальна</button><button type="button" data-map="scheme">Схема</button>
    </div>
    <p class="map-hint"></p>
    <a class="map-attr" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>`;
  const svg = el.querySelector('svg');
  const tiles = el.querySelector('.map-tiles');
  const layer = el.querySelector('.map-pins');
  let places = opts.places;
  let loaded = 0;
  let failed = 0;

  function setLayer(name, auto) {
    st.layer = name;
    el.classList.toggle('detail', name === 'detail');
    for (const b of el.querySelectorAll('.map-layers button')) b.setAttribute('aria-pressed', b.dataset.map === name);
    el.querySelector('.map-hint').textContent = auto
      ? 'Детальна карта недоступна без інтернету — показуємо схему'
      : name === 'detail' ? 'Перетягуйте й масштабуйте' : 'Схема міста · працює без інтернету';
    if (name === 'scheme') tiles.replaceChildren();
    if (!auto) opts.onLayer?.(name);
    draw();
  }

  // Тайли OpenStreetMap для видимої частини: масштаб тайлів підбираємо так, щоб тайл був близько 256 px.
  function drawTiles(w, h) {
    if (st.layer !== 'detail') return;
    const tz = Math.max(10, Math.min(19, Math.round(MAP_Z0 + Math.log2(st.z))));
    const unit = MAP_TILE * 2 ** (MAP_Z0 - tz);
    const px = unit * st.z;
    const left = st.x - w / 2 / st.z + MAP_ORIGIN[0];
    const top = st.y - h / 2 / st.z + MAP_ORIGIN[1];
    const x0 = Math.floor(left / unit);
    const y0 = Math.floor(top / unit);
    const x1 = Math.floor((left + w / st.z) / unit);
    const y1 = Math.floor((top + h / st.z) / unit);
    const want = new Set();
    for (let tx = x0; tx <= x1; tx++) {
      for (let ty = y0; ty <= y1; ty++) {
        const key = `${tz}/${tx}/${ty}`;
        want.add(key);
        let img = tiles.querySelector(`[data-t="${key}"]`);
        if (!img) {
          img = document.createElement('img');
          img.dataset.t = key;
          img.alt = '';
          img.draggable = false;
          img.decoding = 'async';
          img.onload = () => { loaded++; };
          img.onerror = () => {
            img.remove();
            failed++;
            // Мережа недоступна — переходимо на схему, щоб карта не лишилась порожньою.
            if (!loaded && failed >= 3 && st.layer === 'detail') setLayer('scheme', true);
          };
          img.src = TILE_URL(tz, tx, ty);
          tiles.append(img);
        }
        img.style.width = img.style.height = `${px + 0.5}px`;
        img.style.transform = `translate(${(tx * unit - MAP_ORIGIN[0] - st.x) * st.z + w / 2}px, ${(ty * unit - MAP_ORIGIN[1] - st.y) * st.z + h / 2}px)`;
      }
    }
    for (const img of [...tiles.children]) if (!want.has(img.dataset.t)) img.remove();
  }

  function draw() {
    const w = W();
    const h = H();
    svg.setAttribute('viewBox', `${st.x - w / 2 / st.z} ${st.y - h / 2 / st.z} ${w / st.z} ${h / st.z}`);
    svg.style.setProperty('--z', st.z);
    el.classList.toggle('zoomed', st.z > 0.5);
    drawTiles(w, h);
    for (const pin of layer.children) {
      const [x, y] = pin.dataset.xy.split(',').map(Number);
      pin.style.transform = `translate(${(x - st.x) * st.z + w / 2}px, ${(y - st.y) * st.z + h / 2}px)`;
    }
  }

  function setPins(list) {
    places = list;
    layer.innerHTML = list.map((p) => `<button type="button" class="pin ${p.cls}${p.id === st.sel ? ' sel' : ''}" data-pin="${p.id}" data-xy="${mapProject(p.lat, p.lng).join(',')}"
      aria-label="${p.label}" aria-pressed="${p.id === st.sel}">${p.html}</button>`).join('')
      + (opts.pos ? `<span class="me-dot" data-xy="${mapProject(opts.pos.lat, opts.pos.lng).join(',')}" role="img" aria-label="Ви тут"></span>` : '')
      + (opts.pick ? `<span class="pick-dot" data-xy="${mapProject(opts.pick.lat, opts.pick.lng).join(',')}" role="img" aria-label="Обрана адреса"></span>` : '');
    draw();
  }

  // Межі масштабу: від усього Києва до окремого будинку.
  const zoomAt = (k, cx = W() / 2, cy = H() / 2) => {
    const nz = Math.max(0.2, Math.min(96, st.z * k));
    st.x += (cx - W() / 2) / st.z - (cx - W() / 2) / nz;
    st.y += (cy - H() / 2) / st.z - (cy - H() / 2) / nz;
    st.z = nz;
    draw();
  };

  // Перетягування мишею чи пальцем, щипок двома пальцями.
  const pointers = new Map();
  let pinchDist = 0;
  let moved = 0;
  el.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.map-btn, .map-layers, .map-attr')) return;
    pointers.set(e.pointerId, [e.clientX, e.clientY]);
    moved = 0;
    if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinchDist = Math.hypot(a[0] - b[0], a[1] - b[1]); }
  });
  el.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    const [px, py] = pointers.get(e.pointerId);
    pointers.set(e.pointerId, [e.clientX, e.clientY]);
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      const r = el.getBoundingClientRect();
      if (pinchDist) zoomAt(d / pinchDist, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top);
      pinchDist = d;
      return;
    }
    moved += Math.abs(e.clientX - px) + Math.abs(e.clientY - py);
    if (moved > 4 && !el.hasPointerCapture(e.pointerId)) el.setPointerCapture(e.pointerId);
    st.x -= (e.clientX - px) / st.z;
    st.y -= (e.clientY - py) / st.z;
    draw();
  });
  const up = (e) => { pointers.delete(e.pointerId); if (pointers.size < 2) pinchDist = 0; };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = el.getBoundingClientRect();
    zoomAt(e.deltaY < 0 ? 1.25 : 0.8, e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  el.addEventListener('click', (e) => {
    const b = e.target.closest('[data-map]');
    if (b) {
      const m = b.dataset.map;
      if (m === 'in') zoomAt(1.5);
      else if (m === 'out') zoomAt(1 / 1.5);
      else if (m === 'fit') { fit(places); draw(); }
      else { failed = 0; setLayer(m); }
      return;
    }
    const pin = e.target.closest('[data-pin]');
    if (pin && moved < 6) {
      st.sel = pin.dataset.pin;
      for (const x of layer.querySelectorAll('[data-pin]')) {
        x.classList.toggle('sel', x === pin);
        x.setAttribute('aria-pressed', x === pin);
      }
      opts.onSelect?.(st.sel);
      return;
    }
    if (opts.onPick && moved < 6 && !e.target.closest('.map-attr')) {
      const r = el.getBoundingClientRect();
      const pt = mapUnproject(st.x + (e.clientX - r.left - W() / 2) / st.z, st.y + (e.clientY - r.top - H() / 2) / st.z);
      opts.pick = pt;
      setPins(places);
      opts.onPick(pt.lat, pt.lng);
    }
  });
  // Клавіатура: стрілки зсувають, + і − масштабують.
  el.addEventListener('keydown', (e) => {
    if (e.target !== el) return;
    const step = 60 / st.z;
    const keys = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
    if (keys[e.key]) { st.x += keys[e.key][0]; st.y += keys[e.key][1]; draw(); e.preventDefault(); }
    if (e.key === '+' || e.key === '=') { zoomAt(1.25); e.preventDefault(); }
    if (e.key === '-') { zoomAt(0.8); e.preventDefault(); }
  });
  if (mapResize) window.removeEventListener('resize', mapResize);
  mapResize = draw;
  window.addEventListener('resize', mapResize);
  layer.innerHTML = '';
  setLayer(st.layer, false);
  setPins(places);
  return { setPins, draw };
}

// Перевірка авто за держномером: формат номера, регіон реєстрації й дані з реєстру.
// На сервері CARCAR — дані МВС: онлайн-сервіс перевірки номерів (baza-gai.com.ua за ключем API) або власна копія
// відкритого реєстру (deploy/server/vehicles_import.py). Без сервера — кілька вигаданих демо-номерів.

// Кириличні літери, що пишуться так само, як латинські (на номерах використовують лише їх).
const VEH_LOOKALIKE = { А: 'A', В: 'B', С: 'C', Е: 'E', Н: 'H', І: 'I', К: 'K', М: 'M', О: 'O', Р: 'P', Т: 'T', Х: 'X' };
const normPlate = (s) => String(s ?? '').toUpperCase().replace(/[\s-]/g, '').replace(/[АВСЕНІКМОРТХ]/g, (c) => VEH_LOOKALIKE[c]);
const plateValid = (p) => /^[A-Z]{2}\d{4}[A-Z]{2}$/.test(normPlate(p));

// Перші дві літери — регіон реєстрації (старі й нові серії).
const VEH_REGIONS = {
  'Київ': ['AA', 'KA'], 'Київська обл.': ['AI', 'KI'], 'Вінницька обл.': ['AB', 'KB'], 'Волинська обл.': ['AC', 'KC'],
  'Дніпропетровська обл.': ['AE', 'KE'], 'Донецька обл.': ['AH', 'KH'], 'Житомирська обл.': ['AM', 'KM'], 'Закарпатська обл.': ['AO', 'KO'],
  'Запорізька обл.': ['AP', 'KP'], 'Івано-Франківська обл.': ['AT', 'KT'], 'Кіровоградська обл.': ['BA', 'HA'], 'Луганська обл.': ['BB', 'HB'],
  'Львівська обл.': ['BC', 'HC'], 'Миколаївська обл.': ['BE', 'HE'], 'Одеська обл.': ['BH', 'HH'], 'Полтавська обл.': ['BI', 'HI'],
  'Рівненська обл.': ['BK', 'HK'], 'Сумська обл.': ['BM', 'HM'], 'Тернопільська обл.': ['BO', 'HO'], 'Харківська обл.': ['AX', 'KX'],
  'Херсонська обл.': ['BT', 'HT'], 'Хмельницька обл.': ['BX', 'HX'], 'Черкаська обл.': ['CA', 'IA'], 'Чернігівська обл.': ['CB', 'IB'],
  'Чернівецька обл.': ['CE', 'IE'], 'АР Крим': ['AK', 'KK'], 'Севастополь': ['CH', 'IH'],
};
function plateRegion(p) {
  const code = normPlate(p).slice(0, 2);
  return Object.entries(VEH_REGIONS).find(([, codes]) => codes.includes(code))?.[0] ?? null;
}

// Демо-реєстр: вигадані авто для показу, як працюватиме перевірка.
const DEMO_PLATES = {
  AA1234BB: { make: 'Skoda', model: 'Octavia', year: 2019, color: 'сірий', fuel: 'бензин', engine: '1,4 л', cls: 0 },
  KA0001AA: { make: 'Toyota', model: 'RAV4', year: 2021, color: 'білий', fuel: 'гібрид', engine: '2,5 л', cls: 1 },
  AI7777KE: { make: 'Volkswagen', model: 'Passat', year: 2016, color: 'чорний', fuel: 'дизель', engine: '2,0 л', cls: 0 },
};

// Перевірка в реєстрі МВС через сервер. registry: false — реєстр на сервері ще не завантажено.
async function lookupPlateOnline(raw, api) {
  const local = lookupPlate(raw);
  if (local.error) return local;
  const r = await api(`vehicle?plate=${encodeURIComponent(local.plate)}`);
  if (!r.ok) return { ...local, car: null, failed: r.data.error || 'Не вдалося перевірити номер' };
  return { ...local, car: r.data.car ?? null, registry: !!r.data.registry, online: true, failed: r.data.error ?? null };
}

// Результат перевірки: регіон і дані авто (якщо знайдено).
function lookupPlate(raw) {
  const plate = normPlate(raw);
  if (!plateValid(plate)) return { plate, error: 'Номер має вигляд AA1234BB: дві літери, чотири цифри, дві літери' };
  const car = DEMO_PLATES[plate] ?? null;
  return {
    plate, region: plateRegion(plate), car,
  };
}

// Дзвінки всередині CARCAR: клієнт і мийка говорять через застосунок, не бачачи номерів одне одного,
// тож мийка не може записати клієнта CARCAR «собі» в обхід платформи.
// Виклик і дані зʼєднання — у спільному сховищі: з сервером CARCAR (deploy/server) — між будь-якими пристроями,
// без нього — між вкладками одного пристрою. Голос — WebRTC: STUN допомагає пройти крізь роутери, а за суворим
// NAT (мобільний інтернет) голос іде через TURN-сервер CARCAR (coturn, тимчасові паролі видає /api/ice).
// Про вхідний дзвінок у закритий застосунок сервер надсилає push.

const RING_MS = 30000;
const CALL_KEY = 'calls'; // { id: дзвінок } — у кожної пари клієнт—мийка свій
const ICE = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }];

let callSide = null; // 'client' або 'place'
let callMine = () => false; // чи цей застосунок — учасник дзвінка (клієнт за номером, мийка за своїми мийками)
let callPeer = null;
let callStream = null;
let callTick = null;
let callRingTimer = null;
let callHooks = { onLog: () => {} };
let callWarn = ''; // мікрофон недоступний тощо

const live = (c) => (['ringing', 'active'].includes(c.state) ? 1 : 0);
// Поточний дзвінок цього застосунку: найсвіжіший, де ми учасник (за однакового часу — той, що ще триває).
const callGet = () => Object.values(store.peek(CALL_KEY, {})).filter((c) => callMine(c)).sort((a, b) => (b.at - a.at) || (live(b) - live(a)))[0] ?? null;
const callSet = (c) => {
  const old = Date.now() - 6 * 3600e3;
  const all = Object.fromEntries(Object.entries(store.get(CALL_KEY, {})).filter(([, x]) => x.at > old));
  store.set(CALL_KEY, { ...all, [c.id]: c });
};
const callOther = (c) => (c.from === callSide ? 'out' : 'in');
const callName = (c) => (callSide === 'client' ? c.placeName : c.clientName || 'Клієнт CARCAR');
const callClock = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

// side — хто цей застосунок; mine(call) — чи ми учасник дзвінка; onLog(call) — дзвінок завершився.
function initCalls(side, mine, hooks = {}) {
  callSide = side;
  callMine = mine;
  callHooks = { ...callHooks, ...hooks };
  window.addEventListener('storage', (e) => { if (e.key === `carcar.${CALL_KEY}`) callSync(); });
  document.addEventListener('click', callClick);
  // Застарілий дзвінок (вкладку закрили під час розмови) — прибираємо.
  const c = callGet();
  if (c && ['ringing', 'active'].includes(c.state) && Date.now() - (c.answeredAt ?? c.at) > (c.state === 'ringing' ? RING_MS : 3 * 3600e3)) callSet({ ...c, state: 'ended', endedAt: Date.now() });
  callSync();
}

const newCallId = () => `c${Date.now().toString(36)}${Math.random().toString(36).slice(2, 5)}`;
// Чи йде вже дзвінок (новий не починаємо).
const callBusy = () => ['ringing', 'active'].includes(callGet()?.state);

// Почати дзвінок. who: { id?, bookingId | reqId — чат, куди записати дзвінок, placeId, placeName, clientName }.
async function startCall(who) {
  const cur = callGet();
  if (cur && ['ringing', 'active'].includes(cur.state)) { callSync(); return; }
  const c = { id: newCallId(), from: callSide, state: 'ringing', at: Date.now(), ...who };
  callSet(c);
  callRender(c);
  const sdp = await callPrepare(c, null);
  const now = callGet();
  if (now?.id === c.id && ['ringing', 'active'].includes(now.state) && sdp) callSet({ ...now, offer: sdp });
}

function callClick(e) {
  const el = e.target.closest('[data-call]');
  if (!el) return;
  const c = callGet();
  const act = el.dataset.call;
  if (act === 'close') { callClose(); return; }
  if (!c) return;
  if (act === 'answer') callAnswer(c);
  else if (act === 'decline') callEnd(c, 'declined');
  else if (act === 'hangup') callEnd(c, c.state === 'ringing' ? 'cancelled' : 'ended');
  else if (act === 'mute' && callStream) {
    const t = callStream.getAudioTracks()[0];
    if (t) t.enabled = !t.enabled;
    el.setAttribute('aria-pressed', String(!t?.enabled));
  }
}

async function callAnswer(c) {
  const on = { ...c, state: 'active', answeredAt: Date.now() };
  callSet(on);
  callRender(on);
  // Дані зʼєднання від того, хто дзвонить, можуть ще готуватися (дозвіл на мікрофон) — чекаємо до 15 с.
  let offer = c.offer;
  for (let i = 0; !offer && i < 75; i++) {
    await new Promise((ok) => setTimeout(ok, 200));
    const now = callGet();
    if (now?.id !== c.id || now.state !== 'active') return;
    offer = now.offer;
  }
  if (!offer) { callStatus('Співрозмовник не дав доступ до мікрофона — напишіть у чат'); return; }
  const sdp = await callPrepare(c, offer);
  const now = callGet();
  if (now?.id === c.id && sdp) callSet({ ...now, answer: sdp });
}

function callEnd(c, state) {
  const done = { ...c, state, endedAt: Date.now() };
  callSet(done);
  callHooks.onLog(done);
  callStop();
  callRender(done);
}

// Мікрофон і WebRTC. remoteOffer — для того, хто відповідає. Повертає SDP, коли зібрано всі кандидати.
async function callPrepare(c, remoteOffer) {
  if (!('RTCPeerConnection' in window) || !navigator.mediaDevices?.getUserMedia) return null;
  try {
    callStream = await Promise.race([navigator.mediaDevices.getUserMedia({ audio: true }), new Promise((_, no) => setTimeout(() => no(new Error('timeout')), 8000))]);
  } catch {
    callStatus('Мікрофон недоступний — дозвольте його в налаштуваннях браузера');
    return null;
  }
  let iceServers = ICE;
  if (hasServer()) {
    const r = await api('ice');
    if (r.ok && r.data.iceServers?.length) iceServers = r.data.iceServers;
  }
  callPeer = new RTCPeerConnection({ iceServers });
  callStream.getTracks().forEach((t) => callPeer.addTrack(t, callStream));
  callPeer.ontrack = (ev) => { const a = document.getElementById('call-audio'); if (a) a.srcObject = ev.streams[0]; };
  if (remoteOffer) {
    await callPeer.setRemoteDescription({ type: 'offer', sdp: remoteOffer });
    await callPeer.setLocalDescription(await callPeer.createAnswer());
  } else {
    await callPeer.setLocalDescription(await callPeer.createOffer());
  }
  await new Promise((ok) => {
    if (callPeer.iceGatheringState === 'complete') { ok(); return; }
    callPeer.addEventListener('icegatheringstatechange', () => callPeer?.iceGatheringState === 'complete' && ok());
    setTimeout(ok, 2000);
  });
  return callPeer?.localDescription?.sdp ?? null;
}

function callStop() {
  callStream?.getTracks().forEach((t) => t.stop());
  callPeer?.close();
  callStream = null;
  callPeer = null;
  clearInterval(callTick);
  clearTimeout(callRingTimer);
}

// Інша сторона змінила дзвінок: відповіла, поклала трубку, надіслала дані зʼєднання.
function callSync() {
  const c = callGet();
  if (!c) { callClose(); return; }
  const dir = callOther(c);
  if (dir === 'out' && c.answer && callPeer && !callPeer.currentRemoteDescription) callPeer.setRemoteDescription({ type: 'answer', sdp: c.answer }).catch(() => {});
  if (['ended', 'declined', 'cancelled', 'missed'].includes(c.state)) callStop();
  // Вхідний дзвінок, що вже закінчився до відкриття застосунку, не показуємо.
  if (dir === 'in' && !document.getElementById('call-screen') && c.state !== 'ringing') return;
  callRender(c);
}

function callRender(c) {
  let el = document.getElementById('call-screen');
  if (!el) {
    el = document.createElement('section');
    el.id = 'call-screen';
    el.className = 'call-screen';
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-modal', 'true');
    el.setAttribute('aria-labelledby', 'call-name');
    document.body.append(el);
  }
  const dir = callOther(c);
  const name = callName(c);
  const live = c.state === 'active';
  const status = c.state === 'ringing' ? (dir === 'out' ? 'Дзвонимо…' : 'Вхідний дзвінок CARCAR')
    : live ? `<span id="call-time">${callClock(Date.now() - c.answeredAt)}</span>`
      : { declined: dir === 'out' ? 'Не може відповісти зараз' : 'Дзвінок відхилено', missed: 'Не відповідає', cancelled: dir === 'out' ? 'Дзвінок скасовано' : 'Пропущений дзвінок', ended: 'Дзвінок завершено' }[c.state];
  const buttons = c.state === 'ringing' && dir === 'in'
    ? `<button class="call-btn end" type="button" data-call="decline" aria-label="Відхилити">${icon('phone', 28)}</button>
       <button class="call-btn ok" type="button" data-call="answer" aria-label="Відповісти">${icon('phone', 28)}</button>`
    : ['ringing', 'active'].includes(c.state)
      ? `<button class="call-btn" type="button" data-call="mute" aria-pressed="false" aria-label="Вимкнути мікрофон">${icon('mic', 26)}</button>
         <button class="call-btn end" type="button" data-call="hangup" aria-label="Завершити">${icon('phone', 28)}</button>`
      : `<button class="btn" type="button" data-call="close">Закрити</button>
         ${c.bookingId && callSide === 'client' && ['declined', 'missed'].includes(c.state) ? `<a class="btn primary" href="#/chat/${c.bookingId}" data-call="close">Написати в чат</a>` : ''}`;
  el.innerHTML = `<div class="call-who">
      <span class="call-ava" aria-hidden="true">${esc([...String(name).replace(/^(Автомийка|Детейлінг-мийка)\s*/, '').replace(/[«»"]/g, '')][0] ?? 'C')}</span>
      <h2 id="call-name">${esc(name)}</h2>
      <p class="call-status" aria-live="polite">${status}</p>
      <p class="call-note">${icon('shield', 14)}Дзвінок через CARCAR — номери телефонів приховані</p>
      <p class="call-warn" role="status">${esc(callWarn)}</p>
    </div>
    <div class="call-actions">${buttons}</div>
    <audio id="call-audio" autoplay></audio>`;
  if (callPeer && live) { const a = document.getElementById('call-audio'); const r = callPeer.getReceivers()[0]?.track; if (a && r) a.srcObject = new MediaStream([r]); }
  clearInterval(callTick);
  if (live) callTick = setInterval(() => { const t = document.getElementById('call-time'); if (t) t.textContent = callClock(Date.now() - c.answeredAt); }, 1000);
  clearTimeout(callRingTimer);
  // Ніхто не відповів за 30 с — дзвінок пропущено (рахує той, хто дзвонить).
  if (c.state === 'ringing' && dir === 'out') callRingTimer = setTimeout(() => { const now = callGet(); if (now?.id === c.id && now.state === 'ringing') callEnd(now, 'missed'); }, Math.max(0, RING_MS - (Date.now() - c.at)));
  if (!['ringing', 'active'].includes(c.state)) setTimeout(() => { if (callGet()?.id === c.id) callClose(); }, 6000);
  if (c.state === 'ringing' && dir === 'in' && navigator.userActivation?.hasBeenActive) navigator.vibrate?.([300, 200, 300]);
}

function callStatus(text) {
  callWarn = text;
  const p = document.querySelector('#call-screen .call-warn');
  if (p) p.textContent = text;
}

function callClose() {
  callWarn = '';
  document.getElementById('call-screen')?.remove();
  callStop();
}

// Запис у чат запису: «Дзвінок через CARCAR · 1:23» або «Пропущений дзвінок».
function callLogText(c) {
  const by = c.from === 'client' ? 'клієнта' : 'мийки';
  if (c.state === 'ended' && c.answeredAt) return `Дзвінок через CARCAR · ${callClock(c.endedAt - c.answeredAt)}`;
  return c.state === 'declined' ? `Дзвінок від ${by} відхилено` : `Пропущений дзвінок від ${by}`;
}
// Дзвінок записується в той самий діалог із мийкою — чат запису чи загальний чат (запит), а не окремим рядком.
// Журнал дзвінків лишається для історії; окремим рядком у «Повідомленнях» показуються лише давні дзвінки без чату.
const callLinked = (x) => !!(x.bookingId || x.reqId);
// Повідомлення в чаті: на початку дзвінка (якщо чат створено для дзвінка) — «Дзвінок через CARCAR», після — результат.
function callNote(list, c) {
  const answered = c.state === 'ended' && !!c.answeredAt;
  const info = { text: c.state === 'ringing' ? 'Дзвінок через CARCAR' : callLogText(c), callFrom: c.from ?? 'client',
    callState: answered ? 'ended' : c.state, dur: answered ? c.endedAt - c.answeredAt : null };
  const msg = list.find((m) => m.call === c.id);
  if (msg) return Object.assign(msg, info);
  const m = { from: 'sys', at: c.at, call: c.id, ...info };
  list.push(m);
  return m;
}
// ctx: { bookings, requests, save }.
function logCall(ctx, c) {
  const answered = c.state === 'ended' && !!c.answeredAt;
  const b = c.bookingId && ctx.bookings.find((x) => x.id === c.bookingId);
  const r = !b && c.reqId && ctx.requests?.find((x) => x.id === c.reqId);
  const log = store.peek('callLog', []);
  if (!log.some((x) => x.id === c.id)) {
    store.set('callLog', [...log, {
      id: c.id, placeId: c.placeId, bookingId: b ? b.id : null, reqId: r ? r.id : null, clientId: c.clientId ?? 'device', from: c.from, state: answered ? 'ended' : c.state, at: c.endedAt ?? Date.now(),
      dur: answered ? c.endedAt - c.answeredAt : null, clientName: c.clientName ?? '', placeName: c.placeName ?? '',
      // Пропущений дзвінок без чату — непрочитаний для того, кому дзвонили (у чаті непрочитаність позначає сам чат).
      unreadClient: !b && !r && !answered && c.from === 'place', unreadBiz: !b && !r && !answered && c.from === 'client',
    }].slice(-300));
  }
  if (!b && !r) return;
  // Хто має побачити: пропущений — той, кому дзвонили; відхилений — той, хто дзвонив; розмова — нікому.
  const to = answered ? null : (c.state === 'declined') === (c.from === 'client') ? 'client' : 'biz';
  if (b) {
    b.chat = b.chat ?? [];
    callNote(b.chat, c);
    b.chat.sort((x, y) => x.at - y.at);
    if (to === 'biz') b.chatUnreadBiz = true;
    if (to === 'client') b.chatUnreadClient = true;
  } else {
    callNote(r.messages, c);
    r.messages.sort((x, y) => x.at - y.at);
    if (to === 'biz') r.unreadBiz = true;
    if (to === 'client') r.unreadClient = true;
  }
  ctx.save();
}

const callHistory = () => store.peek('callLog', []);
// Підпис у списку повідомлень з погляду side ('client' або 'place').
function callRowText(x, side) {
  const out = x.from === side;
  if (x.state === 'ended') return `${out ? 'Вихідний' : 'Вхідний'} дзвінок · ${callClock(x.dur ?? 0)}`;
  if (out) return x.state === 'declined' ? 'Дзвінок відхилено' : 'Не відповіли на дзвінок';
  return 'Пропущений дзвінок';
}
// Рядок дзвінка в чаті з погляду side: «Вихідний дзвінок · 1:23», «Пропущений дзвінок»…
const callLine = (m, side) => (m.callState && m.callState !== 'ringing' ? callRowText({ from: m.callFrom, state: m.callState, dur: m.dur }, side) : m.text);
const callMissed = (x, side) => (side === 'client' ? x.unreadClient : x.unreadBiz);
function markCallsRead(side, pick) {
  const log = store.peek('callLog', []);
  const key = side === 'client' ? 'unreadClient' : 'unreadBiz';
  if (!log.some((x) => x[key] && pick(x))) return;
  store.set('callLog', log.map((x) => (x[key] && pick(x) ? { ...x, [key]: false } : x)));
}

const state = { away: false, screen: null, tipFor: null, faq: [], opts: {}, hideTimer: 0, talkTimer: 0 };
const prefs = () => ({ off: false, seen: {}, ...store.get(KEY, {}) });
const savePrefs = (p) => store.set(KEY, p);
const karychOn = () => !prefs().off;
function setKarych(on) {
  savePrefs({ ...prefs(), off: !on });
  render();
}

function root() {
  let el = document.getElementById('karych');
  if (!el) {
    el = document.createElement('div');
    el.id = 'karych';
    el.className = 'karych';
    el.innerHTML = `<div class="k-bubble" id="k-bubble" role="dialog" aria-label="Кар Карич підказує" hidden></div>
      <button class="k-btn" type="button" data-k="toggle" aria-label="Кар Карич — помічник" aria-expanded="false" aria-controls="k-bubble">${KARYCH_SVG}</button>`;
    document.body.append(el);
    el.addEventListener('click', onClick);
  }
  return el;
}

// Ворон «говорить»: дзьоб рухається, поки читаєте фразу (недовго).
function talk(ms) {
  const el = root();
  el.classList.add('talking');
  clearTimeout(state.talkTimer);
  state.talkTimer = setTimeout(() => el.classList.remove('talking'), Math.min(2600, Math.max(700, ms)));
}

function mood(name) {
  const el = root();
  el.classList.remove('wave', 'cheer');
  void el.offsetWidth; // перезапуск анімації
  if (name) el.classList.add(name);
}

function open(html, { auto = false, moodName = 'wave' } = {}) {
  const el = root();
  const b = el.querySelector('#k-bubble');
  b.innerHTML = `<button class="k-close" type="button" data-k="close" aria-label="Закрити підказку">×</button>
    <b class="k-name">Кар Карич</b>${html}`;
  b.hidden = false;
  el.classList.add('open');
  el.querySelector('.k-btn').setAttribute('aria-expanded', 'true');
  mood(moodName);
  talk(b.textContent.length * 35);
  clearTimeout(state.hideTimer);
  // Підказка, що зʼявилась сама, ховається сама; відкриту вручну закриває клієнт.
  if (auto) state.hideTimer = setTimeout(close, 9000);
}

function close() {
  const el = document.getElementById('karych');
  if (!el) return;
  el.querySelector('#k-bubble').hidden = true;
  el.classList.remove('open', 'talking');
  el.querySelector('.k-btn').setAttribute('aria-expanded', 'false');
  clearTimeout(state.hideTimer);
}

const tipHtml = (tip) => `<p class="k-text">${esc(tip.text)}</p>`;

function menuHtml() {
  const tip = state.tipFor?.();
  return `${tip ? tipHtml(tip) : '<p class="k-text">Кар! Я Кар Карич. Підкажу, як усе працює. Що цікавить?</p>'}
    <div class="k-chips">${state.faq.map((q, i) => `<button class="chip" type="button" data-k="faq" data-i="${i}">${esc(q.q)}</button>`).join('')}</div>
    <button class="k-off link-btn" type="button" data-k="off">Не показувати помічника</button>`;
}

function onClick(e) {
  const t = e.target.closest('[data-k]');
  if (!t) return;
  const k = t.dataset.k;
  if (k === 'toggle') {
    // Підказка зʼявилась сама — дотик відкриває питання; відкриті питання — закриває.
    if (root().classList.contains('open') && root().querySelector('.k-chips')) close(); else open(menuHtml());
  } else if (k === 'close') {
    close();
  } else if (k === 'faq') {
    const q = state.faq[Number(t.dataset.i)];
    open(`<p class="k-q">${esc(q.q)}</p><p class="k-text">${esc(q.a)}</p>
      ${q.href ? `<a class="btn soft" href="${q.href}" data-k="close">${esc(q.link ?? 'Відкрити')}</a>` : ''}
      <button class="link-btn" type="button" data-k="menu">← Інші питання</button>`, { moodName: null });
  } else if (k === 'menu') {
    open(menuHtml(), { moodName: null });
  } else if (k === 'off') {
    setKarych(false);
    state.opts.onOff?.();
  }
}

// Підняти ворона над нижніми панелями (меню, кнопка «Записатися», оплата), щоб не закривав кнопки.
// Беремо висоту панелей (offsetHeight не залежить від анімації появи), тож ворон одразу стає на місце й не стрибає.
const shown = (el) => el && el.getClientRects().length > 0 && getComputedStyle(el).visibility !== 'hidden';
let watched = null;
const resize = 'ResizeObserver' in window ? new ResizeObserver(() => place()) : null;
function place() {
  const el = document.getElementById('karych');
  if (!el) return;
  const tabs = document.querySelector('.tabs');
  const dock = [...document.querySelectorAll('.dock')].find(shown);
  const h = (shown(tabs) ? tabs.offsetHeight : 0) + (dock ? dock.offsetHeight : 0);
  el.style.setProperty('--k-bottom', `${h + 12}px`);
  // Висота панелі змінюється (знижка, промокод) — переставляємо ворона.
  if (resize && dock !== watched) {
    resize.disconnect();
    if (dock) resize.observe(dock);
    watched = dock ?? null;
  }
}

function render() {
  const el = root();
  el.hidden = !karychOn() || state.away;
  document.body.classList.toggle('karych-on', !el.hidden);
  if (el.hidden) close();
}

// Після кожного переходу між екранами: перша підказка на новому екрані зʼявляється сама.
// away — ворон ховається (оформлення запису: там важлива кожна кнопка, нічого не має заважати).
function karychRoute(screen, tip, { away = false } = {}) {
  state.tipFor = () => tip;
  state.away = away;
  render();
  place();
  // Той самий екран перемалювався (обрали послугу, слот) — не закриваємо підказку й не показуємо знову.
  if (screen === state.screen) return;
  state.screen = screen;
  close();
  if (!karychOn() || !tip || !screen) return;
  const p = prefs();
  if (p.seen[screen]) return;
  p.seen[screen] = true;
  savePrefs(p);
  setTimeout(() => { if (state.screen === screen && karychOn()) open(tipHtml(tip), { auto: true }); }, 700);
}

// Подія: радіє (запис зроблено) чи щось пояснює.
function karychSay(text, moodName = 'cheer') {
  if (!karychOn()) return;
  state.away = false;
  render();
  open(`<p class="k-text">${esc(text)}</p>`, { auto: true, moodName });
}

function initKarych({ faq, onOff }) {
  state.faq = faq;
  state.opts = { onOff };
  render();
  window.addEventListener('resize', place);
}

// Відстань по прямій між двома точками, км (формула гаверсинуса).
function distanceKm(a, b) {
  const rad = (x) => (x * Math.PI) / 180;
  const dLat = rad(b.lat - a.lat);
  const dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 6371 * 2 * Math.asin(Math.sqrt(h));
}

const fmtDist = (d) => (d < 1 ? `${Math.max(50, Math.round((d * 1000) / 50) * 50)} м` : `${d.toLocaleString('uk-UA', { maximumFractionDigits: 1 })} км`);
const distTo = (p) => (ui.pos ? distanceKm(ui.pos, p) : null);
// Час у дорозі містом: дорога приблизно на третину довша за пряму, середня швидкість у Києві ~25 км/год.
const driveMin = (d) => Math.max(2, Math.round(((d * 1.3) / 25) * 60) + 2);
const travelText = (p) => {
  const d = distTo(p);
  return d === null ? '' : `${driveMin(d)} хв · <span class="badge dist">${fmtDist(d)}</span>${ui.posFallback ? ' від центру' : ''}`;
};

// Місце користувача тримаємо лише в памʼяті й нікуди не надсилаємо.
// silent — тихо, без підказки: так застосунок сам визначає місце, щоб показати відстань на картках.
function locate(silent = false) {
  if (ui.locating) return;
  ui.locating = true;
  const done = (pos, fallback) => {
    Object.assign(ui, { pos, posFallback: fallback, locating: false });
    if ($('#list')) renderList();
    else if (/^#\/place\//.test(location.hash)) route();
    if (fallback && !silent) toast('Не вдалося визначити, де ви. Рахуємо відстань від центру міста');
  };
  if (!navigator.geolocation) { done(cityOf().center, true); return; }
  navigator.geolocation.getCurrentPosition(
    (p) => done({ lat: p.coords.latitude, lng: p.coords.longitude }, false),
    () => done(cityOf().center, true),
    { timeout: 8000, maximumAge: 300000 },
  );
}

// Вільні вікна за графіком точки, крок 30 хвилин. Вікно зайняте, якщо до нього менше
// мінімального часу запису, воно потрапляє на перерву, у клієнта тут уже є свій запис
// або на цей час не лишилося вільних боксів за журналом точки (записи CARCAR і з CRM).
// Для виїзду рахуємо вільні бригади з урахуванням дороги; skip — запис, який переносять.
function slotsFor(place, date, minutes, { skip = null, mobile = false } = {}) {
  const hours = hoursFor(place, date);
  if (!hours) return [];
  const [open, close] = hours;
  const { lead } = scheduleOf(place);
  const now = new Date();
  const today = date === isoDate(now);
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const atPlace = bookings.filter((b) => b.placeId === place.id && b.date === date && b !== skip);
  const own = atPlace.filter((b) => !b.source && ACTIVE.includes(b.state)).map((b) => [toMin(b.time), toMin(b.time) + b.minutes]);
  const all = atPlace.filter((b) => BLOCKING.includes(b.state) && sameLane(b, mobile)).map(spanOf);
  const need = minutes + (mobile ? MOBILE_ROAD : 0);
  const slots = [];
  for (let t = open; t + minutes <= close; t += 30) {
    const overlaps = (list, len) => list.filter(([s, e]) => t < e && t + len > s).length;
    const busy =
      (today && t < nowMin + lead) ||
      inBreak(place, t, minutes) ||
      overlaps(own, minutes) > 0 ||
      overlaps(all, need) >= laneCap(place, mobile);
    slots.push({ time: hhmm(t), busy });
  }
  return slots;
}

function nextDays(n = 7) {

function watchAnswers() {
  const seen = store.get('seenStates', {});
  let changed = false;
  for (const b of mine()) {
    const was = seen[b.id];
    if (was === b.state) continue;
    if (was && AWAITING.includes(was)) answerNotice(b);
    seen[b.id] = b.state;
    changed = true;
  }
  if (changed) store.set('seenStates', seen);
}

function answerNotice(b) {
  const p = placeById(b.placeId);
  const when = `${dayLabel(b.date, { weekday: 'short', day: 'numeric', month: 'long' })} о ${b.time}`;
  const [cls, title, text] = b.state === 'paid' ? ['ok', 'Запис підтверджено', `${p?.name ?? 'Мийка'} чекає вас ${when}${washerOf(b) ? `, мийник — ${washerOf(b)}` : ''}.`]
    : b.state === 'offer' ? ['warn', 'Мийка пропонує інший час', `${p?.name ?? 'Мийка'}: ${when}. Підтвердіть або скасуйте без втрат.`]
      : ['bad', 'Мийка не підтвердила запис', `${p?.name ?? 'Мийка'} не змогла прийняти запис. Гроші повернуто — оберіть інший час чи мийку.`];
  const el = document.createElement('a');
  el.className = `answer-banner ${cls}`;
  el.href = `#/bookings/${b.id}`;
  el.setAttribute('role', 'alert');
  el.innerHTML = `${icon(cls === 'ok' ? 'checkCircle' : cls === 'warn' ? 'clock' : 'x', 22)}<span><b>${title}</b>${esc(text)}</span>`;
  el.addEventListener('click', () => el.remove());
  document.querySelector('.answer-banner')?.remove();
  document.body.append(el);
  setTimeout(() => el.remove(), 9000);
  if (!notifyOn()) return;
  if (navigator.userActivation?.hasBeenActive) navigator.vibrate?.([120, 60, 120]);
  if ('Notification' in window && Notification.permission === 'granted') {
    const opts = { body: text, tag: `answer-${b.id}`, icon: 'icon.svg', data: { url: `index.html#/bookings/${b.id}` } };
    navigator.serviceWorker?.getRegistration().then((reg) => (reg ? reg.showNotification(title, opts) : new Notification(title, opts))).catch(() => {});
  }
}

function filteredPlaces() {
  const q = ui.q.trim().toLowerCase();
  const list = PLACES.filter((p) => {
    if (!isListed(p)) return false;
    if ((p.city ?? 'Київ') !== ui.city) return false;
    if (ui.blackout && !worksInBlackout(p)) return false;
    if (ui.mobileOnly && !mobileOn(p)) return false;
    if (ui.cat !== 'all' && !p.cats.includes(ui.cat)) return false;
    if (ui.openNow && !isOpenNow(p)) return false;
    if (ui.favOnly && !favs.has(p.id)) return false;
    if (q) {
      const hay = [p.name, p.address, p.district, ...p.tags, ...p.services.map((s) => s.name)].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const by = {
    rating: (a, b) => ratingOf(b.id).avg - ratingOf(a.id).avg || ratingOf(b.id).count - ratingOf(a.id).count,
    price: (a, b) => minPrice(a, ui.cat, ui.cls) - minPrice(b, ui.cat, ui.cls),
    reviews: (a, b) => ratingOf(b.id).count - ratingOf(a.id).count,
    near: (a, b) => (ui.pos ? distTo(a) - distTo(b) : ratingOf(b.id).avg - ratingOf(a.id).avg),
  }[ui.sort];
  // Мийки, які часто відмовляють чи мовчать на записи, — нижче в будь-якому сортуванні.
  const low = new Map(list.map((p) => [p.id, responseStats(p.id, bookings).lowered || !!pauseOf(p.id, bookings)]));
  return list.sort((a, b) => (low.get(a.id) - low.get(b.id)) || by(a, b));
}

// Обкладинки точок: намальовані сцени (фасад із боксами, авто в піні, блиск після мийки).
// У робочій версії тут фото, які завантажує точка; кольори сцени залежать від точки.
const SKIES = [['#8fb8e8', '#e8f1fb'], ['#f3a978', '#fde3c8'], ['#7d8fd0', '#dfe4f7'], ['#86cbbd', '#e3f4ef'], ['#b59ad8', '#efe6fa']];
const SIGNS = ['#c8402b', '#1e3a5f', '#0f7b6c', '#6b4bc8', '#b45309'];
const BODIES = ['#1f2937', '#c8402b', '#d1d5db', '#2563eb', '#475569', '#f5f5f4'];
const CAR = 'M60 168Q62 134 104 127L146 99Q157 90 176 90L252 90Q271 90 285 102L318 127Q348 131 352 156L354 166Q354 174 345 174L74 174Q60 174 60 168Z';
const GLASS = '<path d="M154 104L178 98H220V126H136Z" fill="#cfe3f7" opacity=".9"/><path d="M228 98H254Q265 98 275 106L296 126H228Z" fill="#cfe3f7" opacity=".9"/>';
const wheels = () => [118, 300].map((x) => `<circle cx="${x}" cy="174" r="23" fill="#111827"/><circle cx="${x}" cy="174" r="10" fill="#9ca3af"/>`).join('');

function hashStr(str) {
  let x = 2166136261;
  for (const ch of str) x = Math.imul(x ^ ch.charCodeAt(0), 16777619);
  return x >>> 0;
}

function coverArt(p, i) {
  const h = hashStr(p.id);
  const [sky1, sky2] = SKIES[h % SKIES.length];
  const sign = SIGNS[(h >> 3) % SIGNS.length];
  const body = BODIES[(h >> 5) % BODIES.length];
  const id = `${p.id}${i}`;
  const bubbles = (n, y0, y1, seed) => Array.from({ length: n }, (_, k) => {
    const r = 6 + ((seed * (k + 3) * 37) % 17);
    const x = 40 + ((seed * (k + 7) * 53) % 330);
    const y = y0 + ((seed * (k + 5) * 29) % (y1 - y0));
    return `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#bub${id})"/>`;
  }).join('');
  const defs = `<defs><linearGradient id="sky${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky1}"/><stop offset="1" stop-color="${sky2}"/></linearGradient>
    <radialGradient id="bub${id}" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".25" stop-color="#fff" stop-opacity=".45"/><stop offset=".8" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/></radialGradient>
    <linearGradient id="gl${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>`;
  let scene;
  if (i === 0) {
    const bays = [0, 1, 2].map((k) => `<rect x="${58 + k * 100}" y="92" width="86" height="96" rx="3" fill="#cdd5df"/>${[0, 1, 2, 3, 4, 5].map((j) => `<rect x="${58 + k * 100}" y="${96 + j * 15}" width="86" height="2" fill="#b4bfcc"/>`).join('')}`).join('');
    scene = `<rect width="400" height="220" fill="url(#sky${id})"/>
      <rect x="40" y="60" width="320" height="140" rx="6" fill="#eef1f5"/><rect x="40" y="52" width="320" height="26" rx="6" fill="${sign}"/>
      <rect x="150" y="59" width="100" height="12" rx="6" fill="#fff" opacity=".85"/>${bays}
      <rect y="196" width="400" height="24" fill="#9aa4b1"/><rect y="196" width="400" height="3" fill="#cbd2db"/>
      <g transform="translate(70 30) scale(.62)"><path d="${CAR}" fill="${body}"/>${GLASS}${wheels()}</g>`;
  } else if (i === 1) {
    scene = `<rect width="400" height="220" fill="#24435f"/><rect width="400" height="220" fill="url(#sky${id})" opacity=".35"/>
      <g transform="translate(0 12)"><path d="${CAR}" fill="${body}"/>${GLASS}${wheels()}</g>
      <path d="M40 150Q90 92 160 104Q210 70 270 98Q330 86 362 140Q330 120 300 132Q250 110 210 128Q160 112 120 132Q80 124 40 150Z" fill="#fff" opacity=".92"/>
      ${bubbles(16, 40, 190, (h % 13) + 3)}
      ${Array.from({ length: 9 }, (_, k) => `<path d="M${30 + k * 44} ${10 + (k % 3) * 12}l-6 20" stroke="#bfe0ff" stroke-width="3" stroke-linecap="round" opacity=".6"/>`).join('')}`;
  } else {
    scene = `<rect width="400" height="220" fill="#111827"/><circle cx="200" cy="40" r="160" fill="${sign}" opacity=".28"/>
      <g transform="translate(0 6)"><path d="${CAR}" fill="${body}"/>${GLASS}${wheels()}<path d="M100 132Q200 112 330 132" stroke="url(#gl${id})" stroke-width="6" fill="none"/></g>
      <ellipse cx="206" cy="204" rx="170" ry="10" fill="#000" opacity=".5"/>
      ${[[320, 70], [96, 84], [260, 56]].map(([x, y], k) => `<path d="M${x} ${y - 12 - k * 2}L${x + 3} ${y - 3}L${x + 12 + k * 2} ${y}L${x + 3} ${y + 3}L${x} ${y + 12 + k * 2}L${x - 3} ${y + 3}L${x - 12 - k * 2} ${y}L${x - 3} ${y - 3}Z" fill="#fff" opacity=".9"/>`).join('')}`;
  }
  return `<svg viewBox="0 0 400 220" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">${defs}${scene}</svg>`;
}

// Карусель обкладинок: гортається пальцем, крапки показують, яке фото зараз.
const safeImg = (src) => (typeof src === 'string' && src.startsWith('data:image/') ? esc(src) : '');

// Фото, які мийка завантажила в CarCar Business; поки їх немає — намальовані обкладинки.
function coverCarousel(p, href, cls = '') {
  const photos = (p.photos ?? []).map(safeImg).filter(Boolean);
  const slides = photos.length ? photos.map((src, i) => `<img src="${src}" alt="${esc(p.name)}, фото ${i + 1}" loading="lazy">`) : [0, 1, 2].map((i) => coverArt(p, i));
  return `<div class="pc-cover ${cls}">
    <a class="pc-slides" href="${href}" aria-label="${esc(p.name)}">${slides.map((x) => `<div class="pc-slide">${x}</div>`).join('')}</a>
    ${slides.length > 1 ? `<div class="pc-dots" aria-hidden="true">${slides.map((_, i) => `<i${i ? '' : ' class="on"'}></i>`).join('')}</div>` : ''}
  </div>`;
}

function placeCard(p) {
  const open = isOpenNow(p);
  const d = ui.pos ? distTo(p) : null;
  const r = ratingOf(p.id);
  const deal = dealsOf(p.id).length ? Math.max(...dealsOf(p.id).map((x) => x.pct)) : 0;
  return `<article class="pcard">
    ${coverCarousel(p, `#/place/${p.id}`)}
    <div class="pc-top">
      ${deal ? `<span class="badge deal">${icon('bolt', 13)}−${deal}%</span>` : ''}
      ${mobileOn(p) ? `<span class="badge mobile">${icon('carSide', 13)}Виїзд до вас</span>` : ''}
      ${powerBadge(p)}
      ${pauseOf(p.id, bookings) ? '<span class="badge closed">Онлайн-запис на паузі</span>' : ''}
    </div>
    ${favButton(p, true)}
    <div class="pc-info">
      <h2 class="pc-title">${esc(p.name)}${r.count ? `<span class="pc-rate">${icon('star', 14)}${rating(r.avg)}</span>` : ''}</h2>
      <span class="pc-line">${icon('clock', 14)}<span>${open ? '' : 'Зачинено · '}${hoursText(p)}</span><span>· від ${uah(minPrice(p, ui.cat, ui.cls))}</span></span>
      ${d !== null ? `<span class="pc-line">${icon('carSide', 14)}${travelText(p)}</span>` : ''}
      <span class="pc-line">${icon('pin', 14)}${esc(p.address)}</span>
    </div>
  </article>`;
}

// Статус світла від самої точки: показуємо, лише поки позначка свіжа.
const POWER_SHORT = { grid: 'Світло є', generator: 'Працює від генератора', closed: 'Немає світла — не працює' };
function powerBadge(p) {
  const pw = powerOf(p.id);
  if (!pw) return '';
  return `<span class="badge ${pw.state === 'closed' ? 'closed' : 'open'} power">${icon('bolt', 13)}${POWER_SHORT[pw.state]} · ${new Date(pw.at).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' })}</span>`;
}

// Гарячі вікна на головній: знижки точок на сьогодні й завтра, де ще є вільний час.
function hotBlock() {
  const list = hotDeals(bookings, ui.city).slice(0, 6);
  if (!list.length) return '';
  const when = (d) => (d === isoDate(new Date()) ? 'Сьогодні' : 'Завтра');
  return `<section class="hot" aria-labelledby="h-hot">
    <h2 id="h-hot" class="hot-title">${icon('bolt', 18)}Гарячі вікна</h2>
    <div class="hot-row">${list.map(({ place: p, deal: d, free }) => `<a class="card hot-card" href="#/book/${p.id}/${d.date}/${free[0]}" data-track="hot_click" data-place="${p.id}">
      <span class="hot-pct">−${d.pct}%</span>
      <b>${esc(p.name)}</b>
      <span class="small">${when(d.date)} · ${hhmm(d.from)}–${hhmm(d.to)}</span>
      <span class="small muted">вільно з ${free[0]}${d.services?.length ? ` · ${d.services.length} ${plural(d.services.length, 'послуга', 'послуги', 'послуг')}` : ' · усі послуги'}</span>
    </a>`).join('')}</div>
  </section>`;
}

// ---------- промокоди CARCAR ----------

const promoFor = (pr, place, items) => promoCheck(pr, { place, items, mine: mine(), all: bookings });
const ALL_CATS = CATEGORIES.map((c) => c.id);

// Акція, яка діє для цього клієнта автоматично (наприклад, перша мийка), — банер на головній.
function promoBanner() {
  const pr = promosAll().find((x) => x.auto && promoFor(x, { cats: x.cats?.length ? x.cats : ALL_CATS }, [{ cat: x.cats?.[0] ?? 'wash', price: 1e6 }]).ok);
  if (!pr) return '';
  const one = pr.cats?.length === 1 ? pr.cats[0] : null;
  return `<a class="banner promo-banner" href="#/" ${one ? `data-action="cat" data-cat="${one}"` : ''}>
    <span class="banner-ic">${icon('gift', 22)}</span>
    <span><b>${esc(pr.title)}</b><span class="small">Знижка застосується автоматично під час оплати</span></span>
    ${icon('chevR', 18)}</a>`;
}

// ---------- анонімна статистика ----------

// Події для зведеної статистики CARCAR: без імен і телефонів, лише що відкривали й що натискали.
// Зберігаємо останні 5000 подій на пристрої; у робочій версії їх приймає сервер.
function track(type, data = {}) {
  const all = store.get('analytics', []);
  all.push({ id: uid(), t: type, at: Date.now(), ...data });
  store.set('analytics', all.slice(-5000));
}

// ---------- карта ----------

let mapApi = null;
const mapState = { layer: store.get('mapLayer', undefined) };

function mapPin(p) {
  const open = isOpenNow(p);
  const cat = catById(p.cats[0]);
  const deal = dealsOf(p.id).length ? Math.max(...dealsOf(p.id).map((d) => d.pct)) : 0;
  const pw = powerOf(p.id);
  const r = ratingOf(p.id);
  return {
    id: p.id, lat: p.lat, lng: p.lng, cls: `c-${p.cats[0]}${open ? '' : ' shut'}`,
    html: `<span class="pin-shape">${icon(cat.icon, 16)}</span>${deal ? `<span class="pin-deal">−${deal}%</span>` : ''}${pw && pw.state !== 'closed' ? `<span class="pin-bolt">${icon('bolt', 11)}</span>` : ''}`,
    label: esc(`${p.name}: ${cat.name.toLowerCase()}, ${open ? 'відчинено' : 'зачинено'}, від ${uah(minPrice(p, ui.cat, ui.cls))}${r.count ? `, рейтинг ${rating(r.avg)}` : ''}${deal ? `, знижка до ${deal}%` : ''}`),
  };
}

function mapCard(id) {
  const p = placeById(id);
  if (!p) return '<p class="small muted map-empty">Натисніть на точку на карті, щоб побачити деталі.</p>';
  const maps = `${CITY.mapsSearch}${encodeURIComponent(`${p.city ?? ui.city}, ${p.address}`)}`;
  return `${placeCard(p)}
    <div class="grid2" style="margin-top:8px"><a class="btn primary" href="#/book/${p.id}">Записатися</a>
      <a class="btn" href="${maps}" target="_blank" rel="noopener">${icon('route', 18)}Маршрут</a></div>`;
}

function renderMap(list) {
  if (!$('#map')) {
    $('#list').innerHTML = `<div class="map" id="map" tabindex="0" role="region" aria-label="Карта точок. Стрілки зсувають карту, плюс і мінус змінюють масштаб"></div>
      <div id="map-card" aria-live="polite"></div>`;
    mapApi = mountMap($('#map'), {
      places: list.map(mapPin), pos: ui.posFallback ? null : ui.pos, state: mapState, city: ui.city, center: cityOf().center, onLayer: (l) => store.set('mapLayer', l),
      onSelect: (id) => { $('#map-card').innerHTML = mapCard(id); track('map_pin', { placeId: id }); },
    });
  } else mapApi.setPins(list.map(mapPin));
  if (mapState.sel && !list.some((p) => p.id === mapState.sel)) mapState.sel = null;
  $('#map-card').innerHTML = mapCard(mapState.sel);
}

function renderList() {
  const list = filteredPlaces();
  if (ui.view === 'map') renderMap(list);
  else $('#list').innerHTML = list.length ? list.map(placeCard).join('')
    : !PLACES.some((p) => isListed(p) && (p.city ?? 'Київ') === ui.city)

// Графік точки на тиждень, перерва й найближчі особливі дні — щоб клієнт бачив актуальні години.
function scheduleBlock(p) {
  const s = scheduleOf(p);
  const today = weekdayOf(isoDate(new Date()));
  const special = Object.entries(s.special).filter(([d]) => bookingDays(p).includes(d)).sort();
  return `<div class="list hours-list">${s.week.map((h, i) => `<div class="item${i === today ? ' today' : ''}">
      <span class="name">${WEEKDAY_NAMES[i]}${i === today ? ' <small style="display:inline">· сьогодні</small>' : ''}</span><span>${rangeText(h)}</span></div>`).join('')}</div>
    ${s.brk ? `<p class="small muted">Перерва щодня ${rangeText(s.brk)}.</p>` : ''}
    ${special.length ? `<p class="small muted">${special.map(([d, h]) => `${dayLabel(d, { day: 'numeric', month: 'long' })} — ${h ? rangeText(h) : 'не працюємо'}`).join('; ')}.</p>` : ''}

}

// Мийка щодня підтверджує в CarCar Business, що вільний час правильний.
function schedChecked(p) {
  const at = store.get('biz.places', {})[p.id]?.checkedAt;
  if (!at || isoDate(new Date(at)) !== isoDate(new Date())) return '';
  return `<p class="sched-ok">${icon('checkCircle', 16)}Мийка підтвердила вільний час сьогодні о ${new Date(at).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' })}</p>`;
}

// Скільки зазвичай мийка підтверджує запис — коли даних досить.

  return `<p class="sched-ok reply-time">${icon('clock', 16)}Підтверджує запис зазвичай за ${msText(s.avgMs)}</p>`;
}
