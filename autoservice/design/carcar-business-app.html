applyOverrides();

// ---------- підключення точок і модерація ----------

// Статус точки в CARCAR. Демо-точки з data.js уже підключені; нові починають з чернетки.
// Дані підключення (юрособа, документи, реквізити, оферта) і рішення модератора — у 'partners'.
const PARTNER_STATUS = {
  draft: ['Чернетка', 'muted'], pending: ['На перевірці', 'warn'], changes: ['Потрібні виправлення', 'warn'],
  approved: ['Підключено', 'ok'], rejected: ['Відхилено', 'muted'], suspended: ['Призупинено', 'muted'],
};

function partnerOf(placeId) {
  const p = PLACES.find((x) => x.id === placeId);
  return { status: p?.custom ? 'draft' : 'approved', demo: !p?.custom, history: [], ...store.get('partners', {})[placeId] };
}

function savePartner(placeId, patch) {
  const all = store.get('partners', {});
  all[placeId] = { ...partnerOf(placeId), ...patch };
  store.set('partners', all);
  return all[placeId];
}

// Клієнти бачать і можуть записатися лише до підключених точок.
const isListed = (p) => partnerOf(p.id).status === 'approved';

// Виводити гроші можна лише на перевірені реквізити.
const payoutReady = (placeId) => !!partnerOf(placeId).payout?.verified && partnerOf(placeId).status !== 'rejected';
const maskIban = (iban) => `UA…${String(iban).slice(-4)}`;

// Комісія CARCAR: індивідуальна для точки або загальна з адмінки, інакше — з data.js.
const commissionFor = (placeId) => partnerOf(placeId).commission ?? store.get('admin.settings', {}).commission ?? PAYMENT.commission;

// Гроші клієнту на баланс CARCAR (повернення за спором чи скасуванням з будь-якого екрана).
function creditClient(amount, text) {
  const w = { bonus: 0, money: 0, history: [], ...store.get('wallet', {}) };
  w.money += amount;
  w.history.unshift({ amount, text, at: Date.now(), kind: 'money' });
  store.set('wallet', w);
}

// Рішення за спором: placePart — скільки отримує точка (0 — усе клієнту, повна ціна — усе точці).
function resolveDispute(b, placePart, note = '') {
  const full = price(b);
  const toPlace = Math.max(0, Math.min(full, Math.round(placePart)));
  const name = PLACES.find((x) => x.id === b.placeId)?.name ?? '';
  b.resolution = { placePart: toPlace, note, at: Date.now() };
  if (toPlace === full) {
    complete(b);
    b.unfreezeAt = Date.now(); // модератор уже перевірив замовлення
    return;
  }
  const refund = Math.min(b.paid, full - toPlace);
  Object.assign(b, { state: 'refunded', refund, placeAmount: toPlace, refundTo: 'balance', closedAt: Date.now() });
  if (refund) creditClient(refund, `Повернення за спором: ${name}`);
}

// ---------- персональні послуги й витрати ----------

// Персональна послуга з індивідуальною ціною для конкретного клієнта точки.
// clientKey — tel:… або car:…; клієнт бачить її в застосунку, якщо його телефон чи авто збігаються.
const offersOf = (placeId, clientKey) =>
  store.get('biz.offers', []).filter((o) => o.placeId === placeId && o.active !== false && (!clientKey || o.clientKey === clientKey));

// Персональну послугу подаємо так само, як звичайну: одна ціна для всіх класів авто.
const offerAsService = (o) => ({ id: `offer:${o.id}`, name: o.name, min: o.min, price: [o.price, o.price, o.price], cat: o.cat, personal: true, main: true, note: o.note });

const EXPENSE_CATS = ['Хімія й витратні матеріали', 'Запчастини', 'Зарплата', 'Оренда', 'Комунальні послуги', 'Реклама', 'Податки', 'Обладнання й ремонт', 'Інше'];
const PAY_METHODS = { cash: 'Готівка', card: 'Картка', account: 'Рахунок' };

// Витрати точки за проміжком дат: разові плюс щомісячні, розгорнуті на кожен місяць до кінця проміжку
// (або до дати зупинки). Розгорнуті записи мають id «шаблон@дата».
// ---------- персонал і зарплата ----------

const ROLES = { owner: 'Власник', admin: 'Адміністратор', master: 'Майстер' };
const staffOf = (placeId) => store.peek('biz.staff', {})[placeId] ?? [];

// База для відсотка майстра — вартість робіт: оплата клієнта, бонус і покрите абонементом чи сертифікатом.
const workBase = (b) => (isCarcar(b) ? price(b) : b.paid) + (b.covered || 0);

// Зарплата майстрів — відсоток від виконаних робіт, одним рядком на майстра за день.
// Ці витрати не зберігаються окремо: їх завжди перераховано з виконаних записів.
function salaryExpenses(placeId, from, to) {
  const staff = staffOf(placeId);
  const map = new Map();
  for (const b of store.peek('bookings', [])) {
    if (b.placeId !== placeId || b.state !== 'completed' || !b.masterId || b.date < from || b.date > to) continue;
    const m = staff.find((x) => x.id === b.masterId);
    if (!m?.pct) continue;
    const k = `${b.date}|${m.id}`;
    const e = map.get(k) ?? { id: `salary:${m.id}:${b.date}`, placeId, date: b.date, cat: 'Зарплата', method: 'card', amount: 0, works: 0, auto: 'salary', masterId: m.id };
    e.amount += (workBase(b) * m.pct) / 100;
    e.works++;
    map.set(k, e);
  }
  return [...map.values()].map((e) => {
    const m = staff.find((x) => x.id === e.masterId);
    return { ...e, amount: Math.round(e.amount), note: `${m.name}: ${e.works} ${plural(e.works, 'робота', 'роботи', 'робіт')} × ${m.pct}%` };
  });
}

function expensesIn(placeId, from, to) {
  const out = [...salaryExpenses(placeId, from, to)];
  for (const e of store.get('biz.expenses', []).filter((x) => x.placeId === placeId)) {
    if (!e.recurring) {
      if (e.date >= from && e.date <= to) out.push(e);
      continue;
    }
    const start = parseDate(e.date);
    for (let k = 0; ; k++) {
      const d = new Date(start.getFullYear(), start.getMonth() + k, 1);
      const day = Math.min(start.getDate(), new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate());
      const iso = isoDate(new Date(d.getFullYear(), d.getMonth(), day));
      if (iso > to || (e.until && iso > e.until)) break;
      if (iso >= from) out.push({ ...e, id: `${e.id}@${iso}`, template: e.id, date: iso });
    }
  }
  return out.sort((a, b) => b.date.localeCompare(a.date));
}

// ---------- гроші ----------

// pending — клієнт оплатив, мийка ще не підтвердила: час уже зайнятий, гроші утримує CARCAR.
// offer — мийка запропонувала інший час і чекає згоди клієнта: зайнятий уже запропонований час.
const ACTIVE = ['pending', 'offer', 'paid', 'done', 'dispute'];
const AWAITING = ['pending', 'offer'];
const HOUR = 3600000;

// Як часто клієнт змінює плани: скасування, неявки й перенесення — підказка для мийки, не обмеження.
function reliability(list, now = Date.now()) {
  const R = RELIABILITY;
  const since = now - R.days * 24 * HOUR;
  const cancels = list.filter((b) => b.state === 'cancelled' && b.cancelBy === 'client' && (b.closedAt ?? 0) >= since);
  const noshows = list.filter((b) => b.state === 'noshow' && (b.closedAt ?? bookingStart(b).getTime()) >= now - R.noShowDays * 24 * HOUR).length;
  const moves = list.flatMap((b) => b.moves ?? []).filter((m) => m.at >= since).length;
  return { cancels: cancels.length, noshows, moves, level: noshows || cancels.length >= 3 || moves >= 4 ? 'warn' : 'ok' };
}
// Стани, у яких запис займає бокс: оплачені через CARCAR і внесені в журнал точки.
const BLOCKING = [...ACTIVE, 'booked'];

// Запис через CARCAR (оплата в застосунку) чи внесений точкою вручну (оплата на місці).
const isCarcar = (b) => (b.channel ?? 'carcar') === 'carcar';

// Повна ціна замовлення: те, що заплатив клієнт, плюс бонус і промокод, які доплачує CARCAR.
const price = (b) => b.paid + (b.bonus || 0) + (b.promo && !b.promo.returned ? b.promo.amount : 0);

// ---------- виїзні послуги ----------

// Виїзна бригада зайнята ще MOBILE_ROAD хвилин після роботи — дорога до наступного клієнта.
// Бокси й бригади — окремі потужності: виїзний запис не займає бокс, а запис у точці — бригаду.
const MOBILE_ROAD = 30;
const mobileOn = (p) => !!p?.mobile?.services?.length && p.mobile.crews > 0;
const spanOf = (b) => [toMin(b.time), toMin(b.time) + b.minutes + (b.mobile ? MOBILE_ROAD : 0)];
const laneCap = (p, mobile) => (mobile ? p.mobile?.crews ?? 0 : p.boxes);
const sameLane = (b, mobile) => !!b.mobile === !!mobile;

// ---------- промокоди платформи ----------

// Промокоди й акції CARCAR. Знижку оплачує платформа: точка отримує повну ціну, як із бонусом.
// kind: pct — відсоток (max — не більше ₴), sum — фіксована сума. cats — на які категорії діє (порожньо — на всі).
// firstOnly — лише на перше замовлення в цих категоріях; auto — застосовується сам, без введення коду.
const PROMO_DEFAULTS = [
  { id: 'persha30', code: 'PERSHA30', title: 'Перша мийка −30%', kind: 'pct', value: 30, max: 300, minOrder: 0, cats: ['wash'], firstOnly: true, auto: true, active: true, until: null, limit: null },
];
const promosAll = () => store.get('admin.promos', null) ?? PROMO_DEFAULTS;
const savePromos = (list) => store.set('admin.promos', list);
const promoUses = (code, bookings) => bookings.filter((b) => b.promo?.code === code && !b.promo.returned);
const promoText = (pr) => (pr.kind === 'pct' ? `−${pr.value}%${pr.max ? ` (до ${uah(pr.max)})` : ''}` : `−${uah(pr.value)}`);

// Чи діє промокод на замовлення: items — [{cat, price}] обраних послуг (ціни вже зі знижками точки),
// mine — записи цього клієнта. Повертає { ok, amount } або { ok: false, why }.
function promoCheck(pr, { place, items, mine, all }) {
  const today = isoDate(new Date());
  if (!pr || pr.active === false) return { ok: false, why: 'Промокод не діє' };
  if (pr.until && pr.until < today) return { ok: false, why: 'Строк дії промокоду минув' };
  if (pr.limit && promoUses(pr.code, all).length >= pr.limit) return { ok: false, why: 'Промокод уже використали максимальну кількість разів' };
  const inCats = (c) => !pr.cats?.length || pr.cats.includes(c);
  if (!place.cats.some(inCats)) return { ok: false, why: `Промокод діє лише на: ${pr.cats.map((c) => CATEGORIES.find((x) => x.id === c)?.name.toLowerCase()).join(', ')}` };
  const base = items.filter((x) => inCats(x.cat)).reduce((a, x) => a + x.price, 0);
  if (!base) return { ok: false, why: 'Промокод не діє на обрані послуги' };
  if (pr.minOrder && base < pr.minOrder) return { ok: false, why: `Промокод діє на замовлення від ${uah(pr.minOrder)}` };
  if (mine.some((b) => b.promo?.code === pr.code && !b.promo.returned)) return { ok: false, why: 'Ви вже скористалися цим промокодом' };
  if (pr.firstOnly && mine.some((b) => !(b.state === 'cancelled' && b.refundTo === 'balance') && PLACES.find((x) => x.id === b.placeId)?.cats.some(inCats))) {
    return { ok: false, why: 'Промокод діє лише на перше замовлення' };
  }
  const amount = pr.kind === 'pct' ? Math.min(pr.max || Infinity, Math.round((base * pr.value) / 100)) : Math.min(pr.value, base);
  return { ok: true, amount };
}

// Мийка підтвердила виконання («Машина готова»): замовлення завершене,
// гроші точці заморожені ще на freezeHours, щоб клієнт встиг відкрити спір.
function complete(b, at = Date.now()) {
  Object.assign(b, { state: 'completed', completedAt: at, unfreezeAt: at + PAYMENT.freezeHours * HOUR });
}

const isFrozen = (b) => b.state === 'completed' && Date.now() < (b.unfreezeAt ?? 0);

// Скільки з оплати клієнта належить точці (до комісії).
function placeShare(b) {
  if (!isCarcar(b)) return 0;
  if (b.state === 'completed') return price(b);
  if (b.state === 'cancelled' || b.state === 'noshow' || b.state === 'refunded') return b.placeAmount ?? 0;
  return 0;
}

// Баланс точки в CARCAR: available — можна вивести; frozen — замовлення в роботі
// плюс підтверджені, що ще не розморозились. Оплати на місці сюди не входять.
function balanceFor(placeId, bookings, payouts) {
  const own = bookings.filter((b) => b.placeId === placeId && isCarcar(b));
  const earned = own.filter((b) => !isFrozen(b)).reduce((a, b) => a + placeShare(b), 0);
  const withdrawn = payouts.filter((x) => x.placeId === placeId).reduce((a, x) => a + x.gross, 0);
  // Непідтверджений запис ще не гроші точки: якщо мийка відмовить, їх повернуть клієнту.
  const frozen = own.filter((b) => (ACTIVE.includes(b.state) && !AWAITING.includes(b.state)) || isFrozen(b)).reduce((a, b) => a + price(b), 0);
  const next = own.filter(isFrozen).sort((a, b) => a.unfreezeAt - b.unfreezeAt)[0];
  // Абонементи й сертифікати, куплені в застосунку: гроші точці через ті самі 48 годин.
  const sales = (store.peek('biz.passes', {})[placeId]?.sold ?? []).filter((x) => x.source === 'carcar');
  const ripe = (x) => Date.now() >= x.soldAt + PAYMENT.freezeHours * HOUR;
  const passEarned = sales.filter(ripe).reduce((a, x) => a + x.price, 0);
  const passFrozen = sales.filter((x) => !ripe(x)).reduce((a, x) => a + x.price, 0);
  return { available: earned + passEarned - withdrawn, frozen: frozen + passFrozen, next, withdrawn };
}

// Номер запису: шість цифр по порядку, однаковий у клієнта, мийки й підтримки — його називають,
// коли пишуть у підтримку. Записи без номера (старі чи щойно створені) отримують наступний.
function numberBookings(list) {
  let seq = store.get('seq.booking', 100000);
  let changed = false;
  for (const b of list) {
    if (b.no) continue;
    b.no = ++seq;
    changed = true;
  }
  if (changed) store.set('seq.booking', seq);
  return changed;
}
const bookingNo = (b) => (b?.no ? `№ ${b.no}` : '');
// Пошук запису за номером: «100245», «№100245», «# 100 245».
const findByNo = (list, text) => {
  const n = Number(String(text).replace(/\D/g, ''));
  return n ? list.find((b) => b.no === n) ?? null : null;
};

// Фото в зверненнях: до 3 штук у повідомленні. viewer — у застосунку клієнта відкриваються на весь екран.
const ticketPhotos = (photos = [], viewer = false) => (photos.length ? `<span class="ticket-photos">${photos
  .filter((src) => typeof src === 'string' && src.startsWith('data:image/'))
  .map((src, i) => (viewer
    ? `<button type="button" class="chat-photo" data-action="photo-open" aria-label="Відкрити фото ${i + 1}"><img src="${esc(src)}" alt="Фото ${i + 1}"></button>`
    : `<a href="${esc(src)}" download="foto-${i + 1}.jpg"><img src="${esc(src)}" alt="Фото ${i + 1}"></a>`)).join('')}</span>` : '');

// Виконання підтверджує мийка («Машина готова»). Записи зі старим проміжним станом «done»
// (чекали підтвердження клієнта) вважаються виконаними з моменту, коли мийка їх закрила.
function settleAll(bookings) {
  let changed = numberBookings(bookings);
  for (const b of bookings) {
    if (b.state === 'done') {
      complete(b, b.doneAt ?? Date.now());
      changed = true;
    }
  }
  return changed;
}

// ---------- рейтинг ----------

// Відгуки, приховані модератором CARCAR, не впливають на рейтинг і не показуються клієнтам.
const visibleReviews = (reviews) => reviews.filter((r) => !r.hidden);

function ratingFor(placeId, reviews) {
  const list = visibleReviews(reviews).filter((r) => r.placeId === placeId);
  const dist = [1, 2, 3, 4, 5].map((n) => list.filter((r) => r.stars === n).length);
  const avg = list.length ? list.reduce((a, r) => a + r.stars, 0) / list.length : 0;
  return { avg, count: list.length, dist };
}

// ---------- підтримка CARCAR ----------

// Звернення клієнтів і точок у підтримку. Повʼязане із записом (bookingId) звернення модератор
// бачить поруч зі спором і може перевести в спір прямо зі звернення.
// status: new — ще не відповіли, open — у роботі, waiting — чекаємо відповіді автора, closed — закрито.
const TICKET_TOPICS = {
  booking: 'Запис і перенесення', payment: 'Оплата й повернення', quality: 'Якість послуги', dispute: 'Спір щодо замовлення',
  payout: 'Виплати й комісія', review: 'Відгуки', account: 'Акаунт і дані', fraud: 'Підозра на шахрайство', other: 'Інше',
};
const CLIENT_TOPICS = ['booking', 'payment', 'quality', 'dispute', 'account', 'fraud', 'other'];
const PLACE_TOPICS = ['payout', 'booking', 'dispute', 'review', 'account', 'fraud', 'other'];
const TICKET_STATUS = { new: ['Нове', 'warn'], open: ['У роботі', 'carcar'], waiting: ['Чекаємо відповіді', 'muted'], closed: ['Закрито', 'ok'] };
// Термінові теми — гроші й шахрайство: відповідь за 2 години, решта — за добу.
const URGENT = ['payment', 'dispute', 'fraud', 'payout'];
const slaHours = (t) => (t.priority === 'high' ? 2 : 24);

const ticketsAll = () => store.get('support', []);
const saveTickets = (list) => store.set('support', list);

function openTicket({ from, placeId = null, bookingId = null, topic, text, clientName = '', clientPhone = '', clientKey = null, photos = [] }) {
  const list = ticketsAll();
  const t = {
    id: uid(), no: 1000 + list.length + 1, from, placeId, bookingId, topic, clientName, clientPhone, clientKey,
    priority: URGENT.includes(topic) ? 'high' : 'normal', status: 'new',
    messages: [{ from, text, at: Date.now(), ...(photos.length ? { photos } : {}) }], createdAt: Date.now(), updatedAt: Date.now(), unreadAdmin: true, unreadUser: false,
  };
  saveTickets([...list, t]);
  return t;
}

// Повідомлення у зверненні. Відповідь CARCAR чекає реакції автора, відповідь автора повертає звернення в роботу.
function ticketReply(id, from, text, status, photos = []) {
  const list = ticketsAll();
  const t = list.find((x) => x.id === id);
  if (!t) return null;
  t.messages.push({ from, text, at: Date.now(), ...(photos.length ? { photos } : {}) });
  t.updatedAt = Date.now();
  if (from === 'admin') {
    t.firstReplyAt ??= Date.now();
    t.status = status ?? 'waiting';
    t.unreadUser = true;
    t.unreadAdmin = false;
  } else {
    t.status = t.status === 'new' ? 'new' : 'open';
    t.unreadAdmin = true;
  }
  saveTickets(list);
  return t;
}

function setTicket(id, patch) {
  const list = ticketsAll();
  const t = list.find((x) => x.id === id);
  if (t) Object.assign(t, patch, { updatedAt: Date.now() });
  saveTickets(list);
  return t;
}

// Прострочено, якщо CARCAR ще не відповів у межах SLA.
const ticketOverdue = (t, now = Date.now()) => t.status === 'new' && now - t.createdAt > slaHours(t) * HOUR;

// ---------- антифрод: обмеження ----------

// Клієнти, яким CARCAR обмежив онлайн-запис після перевірки (ключ — tel:… або device).
const fraudState = () => ({ dismissed: {}, blocked: {}, ...store.get('admin.fraud', {}) });
const saveFraud = (s) => store.set('admin.fraud', s);
const isBlocked = (keys) => keys.some((k) => k && fraudState().blocked[k]);

// ---------- рух ----------

// Поява сторінки й «набігання» чисел у показниках — лише при переході на інший екран
// і якщо людина не просила зменшити анімацію.
const calm = () => typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
function enterView(view, changed) {
  if (!changed || calm()) return;
  view.classList.remove('view-enter');
  void view.offsetWidth; // перезапуск анімації
  view.classList.add('view-enter');
  clearTimeout(enterView.t);
  enterView.t = setTimeout(() => view.classList.remove('view-enter'), 900);
  for (const el of view.querySelectorAll('.kpi .value, .tile b, .sheet-total b')) countUp(el);
}

function countUp(el) {
  const text = el.textContent;
  const m = text.match(/\d[\d\s  ]*(?:,\d+)?/);
  if (!m) return;
  const dec = m[0].includes(',') ? m[0].split(',')[1].length : 0;
  const to = parseFloat(m[0].replace(/[\s  ]/g, '').replace(',', '.'));
  if (!(to > 0)) return;
  const start = performance.now();
  const step = (now) => {
    if (!el.isConnected) return;
    const k = Math.min(1, (now - start) / 650);
    const v = to * (1 - (1 - k) ** 3);
    el.textContent = k < 1 ? text.replace(m[0], v.toLocaleString('uk-UA', { minimumFractionDigits: dec, maximumFractionDigits: dec })) : text;
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

async function hashPass(login, pass) {
  const text = `carcar:${login.toLowerCase()}:${pass}`;
  if (globalThis.crypto?.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
  }
  let h = 5381;
  for (const ch of text) h = (h * 33) ^ ch.charCodeAt(0);
  return `x${(h >>> 0).toString(16)}`;
}

const TRANSLIT = { а: 'a', б: 'b', в: 'v', г: 'h', ґ: 'g', д: 'd', е: 'e', є: 'ie', ж: 'zh', з: 'z', и: 'y', і: 'i', ї: 'i', й: 'i', к: 'k', л: 'l', м: 'm', н: 'n', о: 'o', п: 'p', р: 'r', с: 's', т: 't', у: 'u', ф: 'f', х: 'kh', ц: 'ts', ч: 'ch', ш: 'sh', щ: 'shch', ь: '', ю: 'iu', я: 'ia', "'": '', 'ʼ': '' };

// Звідки рахується час на відповідь: від заявки, а якщо мийка зачинена — від відкриття.
function confirmStart(b) {
  const p = PLACES.find((x) => x.id === b.placeId);
  let t = b.createdAt ?? Date.now();
  for (let i = 0; p && i < 8; i++) {
    const d = new Date(t);
    const iso = isoDate(d);
    const h = hoursFor(p, iso);
    const m = d.getHours() * 60 + d.getMinutes();
    if (h && m < h[1]) {
      if (m < h[0]) t = parseDate(iso).getTime() + h[0] * 60000;
      break;
    }
    const next = parseDate(iso);
    next.setDate(next.getDate() + 1);
    t = next.getTime();
  }
  return t;
}

// До коли мийка має відповісти: confirmMinutes робочого часу, але не пізніше за початок візиту.
const confirmBy = (b) => Math.min(confirmStart(b) + PAYMENT.confirmMinutes * 60000, bookingStart(b).getTime());
// До коли клієнт може погодитися на запропонований час.
const offerBy = (b) => Math.min((b.offer?.at ?? Date.now()) + PAYMENT.offerMinutes * 60000, bookingStart(b).getTime());

// Відмови й швидкість відповіді мийки за останні DECLINE_RULES.days днів.
function responseStats(placeId, bookings, now = Date.now()) {
  const from = now - DECLINE_RULES.days * 24 * HOUR;
  const list = bookings.filter((b) => b.placeId === placeId && b.needsConfirm && (b.createdAt ?? 0) >= from && !AWAITING.includes(b.state));
  const declined = list.filter((b) => b.declined === 'place' || b.declined === 'timeout');
  const answered = list.filter((b) => b.respondedAt);
  const avgMs = answered.length ? answered.reduce((a, b) => a + Math.max(0, b.respondedAt - confirmStart(b)), 0) / answered.length : null;
  const enough = list.length >= DECLINE_RULES.minRequests;
  const rate = list.length ? declined.length / list.length : 0;
  const lastDecline = Math.max(0, ...declined.map((b) => b.closedAt ?? 0));
  return {
    total: list.length, declined: declined.length, timeouts: declined.filter((b) => b.declined === 'timeout').length,
    offers: list.filter((b) => b.offer).length, rate, avgMs, enough,
    lowered: enough && rate > DECLINE_RULES.warnRate, lastDecline,
  };
}

// Пауза онлайн-запису: часті відмови — на pauseHours після останньої. Адмін може зняти паузу.
function pauseOf(placeId, bookings, now = Date.now()) {
  const s = responseStats(placeId, bookings, now);
  if (!s.enough || s.rate < DECLINE_RULES.pauseRate || !s.lastDecline) return null;
  if ((store.peek('admin.pauseLift', {})[placeId] ?? 0) >= s.lastDecline) return null;
  const until = s.lastDecline + DECLINE_RULES.pauseHours * HOUR;
  return now < until ? { until, rate: s.rate } : null;
}

// Вільні початки на дату: у робочі години, не в перерву, не в минулому й поки є вільний бокс
// (для виїзного запису — вільна бригада з урахуванням дороги). skip — запис, який переносять.
function openStarts(place, date, minutes, bookings, { lead = scheduleOf(place).lead, skip, mobile = false } = {}) {
  const h = hoursFor(place, date);
  if (!h) return [];
  const spans = bookings.filter((b) => b.placeId === place.id && b.date === date && BLOCKING.includes(b.state) && b !== skip && sameLane(b, mobile))
    .map(spanOf);
  const need = minutes + (mobile ? MOBILE_ROAD : 0);
  const cap = laneCap(place, mobile);
  const min = date === opsToday() ? opsNow() + lead : -1;
  const out = [];
  for (let t = h[0]; t + minutes <= h[1]; t += 30) {
    if (t < min || inBreak(place, t, minutes)) continue;
    if (spans.filter(([s, e]) => t < e && t + need > s).length < cap) out.push(hhmm(t));
  }
  return out;
}

// Позначки не зберігаються, а виводяться зі стану запису — тож з'являються, хоч би де змінився стан.
function chatTimeline(b) {

  else if (b.state === 'refunded') marks.push({ at: b.closedAt ?? fallback, kind: 'closed', text: 'Запис закрито за рішенням спору' });
  return [...msgs, ...marks.map((m) => ({ ...m, from: 'mark' }))].sort((x, y) => x.at - y.at);

// Два види знижок на час: гаряче вікно на конкретну дату (date) і щотижневі «щасливі години»
// (days — дні тижня, 0 — понеділок). Знижка діє на запис, що починається у вікні.
const allDeals = (placeId) => (store.peek('biz.deals', {})[placeId] ?? []).filter((d) => d.active !== false);
const dealsOf = (placeId) => allDeals(placeId).filter((d) => (d.days ? !d.until || d.until >= opsToday() : d.date >= opsToday()));
const weeklyDealsOf = (placeId) => dealsOf(placeId).filter((d) => d.days);

// Усі знижки, що діють на дату, — разові й щотижневі, з датою для зручності.
function dealsOn(placeId, date) {

  return dealsOf(placeId).filter((d) => (d.days ? d.days.includes(wd) : d.date === date)).map((d) => ({ ...d, date }))

// Чи діє знижка на послугу: на всі послуги або лише на обрані точкою.
const dealCovers = (deal, serviceId) => !!deal && (!deal.services?.length || deal.services.includes(serviceId));

const OPS_WD = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'];
// «Пн–Пт», «Сб–Нд», «Щодня» або перелік днів.
function daysText(days) {
  const d = [...days].sort((a, b) => a - b);
  if (d.length === 7) return 'Щодня';
  const runs = [];
  for (const x of d) {

    if (last && x === last[1] + 1) last[1] = x; else runs.push([x, x]);
  }
  return runs.map(([a, z]) => (a === z ? OPS_WD[a] : z === a + 1 ? `${OPS_WD[a]}, ${OPS_WD[z]}` : `${OPS_WD[a]}–${OPS_WD[z]}`)).join(', ');
}

// Гарячі пропозиції для каталогу: знижки на сьогодні й завтра, у яких ще є вільний час.
function hotDeals(bookings) {
  const out = [];
  const days = [opsToday(), isoDate(new Date(Date.now() + 864e5))];
  for (const p of PLACES.filter(isListed)) {
    const minMin = Math.min(...p.services.map((s) => s.min));
    for (const date of days) {
      for (const d of dealsOn(p.id, date)) {
        const free = openStarts(p, date, minMin, bookings).filter((x) => toMin(x) >= d.from && toMin(x) < d.to);
        if (free.length) out.push({ place: p, deal: d, free });
      }
    }
  }
  return out.sort((a, b) => (a.deal.date + opsPad(a.deal.from)).localeCompare(b.deal.date + opsPad(b.deal.from)));
}
const opsPad = (n) => String(n).padStart(4, '0');

// ---------- жива черга ----------

// Черга на сьогодні: авто, що чекають, і ті, що вже в боксі.
function queueOf(placeId) {
  const day = opsToday();
  return (store.peek('biz.queue', {})[placeId] ?? []).filter((q) => q.day === day);
}
const queueEnabled = (p) => store.peek('biz.queueOn', {})[p.id] ?? p.cats[0] === 'wash';

function saveQueue(placeId, list) {
  const all = store.get('biz.queue', {});
  all[placeId] = list;

// Оцінка: хто коли потрапить у бокс. Авто в роботі займають бокс до кінця; записи на сьогодні
// мають пріоритет, якщо машина з черги не встигне до їхнього початку. Повертає час для кожного
// з тих, хто чекає, і для нового авто тривалістю minutes.
function queueEstimate(place, bookings, minutes = 30) {
  const now = opsNow();
  const list = queueOf(place.id);
  const free = Array(place.boxes).fill(now);
  const working = list.filter((q) => q.status === 'working');
  for (const q of working) {
    const i = free.indexOf(Math.min(...free));
    free[i] = Math.max(now, toMin(q.startedTime) + q.minutes);
  }
  const day = opsToday();
  const books = bookings.filter((b) => b.placeId === place.id && b.date === day && BLOCKING.includes(b.state))
    .map((b) => [toMin(b.time), b.minutes]).filter(([s, m]) => s + m > now).sort((a, b) => a[0] - b[0]);
  // Записи, що вже йдуть, займають бокс до кінця.
  while (books.length && books[0][0] <= now) {
    const [s, m] = books.shift();
    const i = free.indexOf(Math.min(...free));
    free[i] = Math.max(free[i], s + m);
  }
  const waiting = list.filter((q) => q.status === 'waiting').sort((a, b) => a.joinedAt - b.joinedAt);
  const eta = new Map();
  const take = (dur) => {
    for (;;) {
      const i = free.indexOf(Math.min(...free));
      const t = free[i];
      if (books.length && books[0][0] < t + dur) {
        const [s, m] = books.shift();
        free[i] = Math.max(t, s) + m;
        continue;
      }
      free[i] = t + dur;
      return t;
    }
  };
  for (const q of waiting) eta.set(q.id, take(q.minutes));
  const next = take(minutes);
  return { ahead: waiting.length, working: working.length, eta, waitMin: Math.max(0, next - now) };
}

// ---------- лист очікування ----------

// Клієнт просить повідомити, якщо на дату звільниться час у вказаному проміжку.
// Перевіряємо щоразу, коли хтось скасовує запис чи відкриває застосунок або панель.
function checkWaitlist(bookings) {
  const list = store.get('waitlist', []);
  const sent = [];
  for (const w of list) {
    if (w.status !== 'active') continue;
    if (w.date < opsToday()) { w.status = 'expired'; continue; }
    const p = opsPlace(w.placeId);
    if (!p) continue;
    const slot = openStarts(p, w.date, w.minutes, bookings).find((t) => toMin(t) >= w.from && toMin(t) + w.minutes <= w.to);
    if (!slot) continue;
    Object.assign(w, { status: 'notified', notifiedAt: Date.now(), slot });
    sent.push({
      placeId: p.id, clientKey: w.clientKey, channel: 'app', kind: 'waitlist',
      text: `${p.name}: звільнився час ${parseDate(w.date).toLocaleDateString('uk-UA', { day: 'numeric', month: 'long' })} о ${slot}. Встигніть записатися!`,
      link: `#/book/${p.id}/${w.date}/${slot}`,
    });
  }
  if (sent.length || list.some((w) => w.status === 'expired')) store.set('waitlist', list);
  if (sent.length) sendMessages(sent);
  return sent.length;
}

// ---------- абонементи й сертифікати ----------

const PASS_KIND = { sub: 'Абонемент', cert: 'Подарунковий сертифікат' };
const passesOf = (placeId) => ({ plans: [], sold: [], ...store.peek('biz.passes', {})[placeId] });

function savePasses(placeId, patch) {
  const all = store.get('biz.passes', {});
  all[placeId] = { ...passesOf(placeId), ...patch };
  store.set('biz.passes', all);
}

function passCode() {
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const part = () => Array.from({ length: 4 }, () => abc[Math.floor(Math.random() * abc.length)]).join('');
  return `CC-${part()}-${part()}`;
}

// Продаж абонемента чи сертифіката: точка отримує гроші одразу (через CARCAR — після 48 год).
function sellPass(placeId, plan, buyer) {
  const valid = new Date();
  valid.setDate(valid.getDate() + (plan.validDays ?? (plan.kind === 'sub' ? 30 : 365)));
  const sold = {
    id: uid(), planId: plan.id, kind: plan.kind, name: plan.name, price: plan.price, code: passCode(),
    services: plan.services ?? [], visitsLeft: plan.kind === 'sub' ? plan.visits : null, visits: plan.visits ?? null,
    balance: plan.kind === 'cert' ? plan.amount ?? plan.price : null, validUntil: isoDate(valid), soldAt: Date.now(),
    history: [], ...buyer,
  };
  savePasses(placeId, { sold: [...passesOf(placeId).sold, sold] });
  return sold;
}

const passActive = (s) => s.validUntil >= opsToday() && (s.kind === 'sub' ? s.visitsLeft > 0 : s.balance > 0);
const passLeft = (s) => (s.kind === 'sub' ? `${s.visitsLeft} з ${s.visits} ${plural(s.visits, 'візиту', 'візитів', 'візитів')}` : `${s.balance.toLocaleString('uk-UA')} ₴`);

// Абонементи клієнта в точці, що покривають хоч одну з обраних послуг.
function usableSubs(placeId, keys, serviceIds) {
  return passesOf(placeId).sold.filter((s) => s.kind === 'sub' && passActive(s) && keys.includes(s.clientKey)
    && serviceIds.some((id) => !s.services.length || s.services.includes(id)));
}

function findCert(placeId, code) {
  const c = String(code ?? '').trim().toUpperCase();
  return passesOf(placeId).sold.find((s) => s.kind === 'cert' && s.code === c) ?? null;
}

// Списати з абонемента чи сертифіката; amount — сума, яку покриваємо. Повертає запис для бронювання.
function redeemPass(placeId, soldId, amount, bookingId) {
  const data = passesOf(placeId);
  const sold = data.sold.map((s) => {
    if (s.id !== soldId) return s;
    const h = [...s.history, { at: Date.now(), bookingId, amount }];
    return s.kind === 'sub' ? { ...s, visitsLeft: s.visitsLeft - 1, history: h } : { ...s, balance: s.balance - amount, history: h };
  });
  savePasses(placeId, { sold });
  return { soldId, amount };
}

// Повернути візит чи суму, якщо запис скасовано вчасно.
function restorePass(placeId, use) {
  if (!use) return;
  const data = passesOf(placeId);
  const sold = data.sold.map((s) => (s.id !== use.soldId ? s : s.kind === 'sub'
    ? { ...s, visitsLeft: s.visitsLeft + 1, history: [...s.history, { at: Date.now(), amount: -use.amount, note: 'повернення' }] }
    : { ...s, balance: s.balance + use.amount, history: [...s.history, { at: Date.now(), amount: -use.amount, note: 'повернення' }] }));
  savePasses(placeId, { sold });
}

function clientNote(b, kind, text) {
  chatPost(b, 'sys', text.replace(/^[^:]+: /, ''), 'client');

// Відмова чи мовчання мийки: усе повертаємо клієнту — картку на картку, баланс і бонуси на рахунок CARCAR,
// візит абонемента й промокод знову доступні.
// by: place — мийка відмовила; timeout — мийка не відповіла; proposal — клієнт не прийняв інший час.
function declineBooking(b, reason, by = 'place') {
  const fromBalance = b.fromBalance || 0;
  Object.assign(b, {
    state: 'cancelled', declined: by, declineReason: reason, refund: b.paid, placeAmount: 0, refundTo: fromBalance >= b.paid ? 'balance' : 'card',
    closedAt: Date.now(), cancelBy: by === 'place' ? 'place' : by === 'proposal' ? 'client' : 'system',
    ...(by === 'place' && !b.respondedAt ? { respondedAt: Date.now() } : {}),
  });
  if (fromBalance) creditClient(fromBalance, `Повернення: ${placeName(b)} не підтвердила запис`);
  if (b.bonus && !b.bonusReturned) {
    const w = { bonus: 0, money: 0, history: [], ...store.get('wallet', {}) };
    w.bonus += b.bonus;
    w.history.unshift({ amount: b.bonus, text: `Повернення бонусу: ${placeName(b)} не підтвердила запис`, at: Date.now() });
    store.set('wallet', w);
    b.bonusReturned = true;
  }
  if (b.passUse) { restorePass(b.placeId, b.passUse); b.passUse = null; }
  if (b.promo) b.promo.returned = true;
  if (by === 'proposal') return;
  clientNote(b, 'decline', by === 'timeout'
    ? `${placeName(b)} не відповіла на запис на ${whenText(b)}. Запис скасовано, гроші повернуто. Оберіть інший час чи мийку.`
    : `${placeName(b)} не може прийняти запис на ${whenText(b)}${reason ? `: ${reason}` : ''}. Гроші повернуто. Оберіть інший час чи мийку.`);
}

// Замість відмови мийка пропонує інший вільний час. Запис одразу переходить на нього (щоб час не зайняли),
// а клієнт погоджується або скасовує без втрат.
function proposeTime(b, date, time, note = '') {
  const from = { date: b.date, time: b.time };
  Object.assign(b, { state: 'offer', date, time, offer: { from, at: Date.now(), note }, respondedAt: b.respondedAt ?? Date.now() });
  clientNote(b, 'offer', `${placeName(b)} не може прийняти вас ${parseDate(from.date).toLocaleDateString('uk-UA', { day: 'numeric', month: 'long' })} о ${from.time} і пропонує ${whenText(b)}.${note ? ` ${note}` : ''} Погодьтеся в записі або скасуйте без втрат.`);
}

function acceptOffer(b) {
  Object.assign(b, { state: 'paid', confirmedAt: Date.now(), offer: { ...b.offer, accepted: Date.now() } });
  chatPost(b, 'sys', `Клієнт погодився на ${whenText(b)}`, 'biz');
}

function rejectOffer(b, timeout = false) {
  // Повертаємо початковий час, щоб у журналі було видно, на що клієнт записувався.
  Object.assign(b, { date: b.offer.from.date, time: b.offer.from.time, offer: { ...b.offer, rejected: Date.now() } });
  declineBooking(b, timeout ? 'клієнт не відповів на запропонований час' : 'клієнту не підійшов запропонований час', 'proposal');
  chatPost(b, 'sys', timeout ? 'Клієнт не відповів на запропонований час — запис скасовано, гроші повернуто' : 'Клієнту не підійшов запропонований час — запис скасовано, гроші повернуто', 'biz');
}

// Заявки, на які мийка не відповіла вчасно, скасовуються самі. Повертає true, якщо щось змінилося.
function expirePending(bookings) {
  let changed = false;
  for (const b of bookings) {
    if (b.state === 'pending' && Date.now() >= confirmBy(b)) { declineBooking(b, 'мийка не відповіла вчасно', 'timeout'); changed = true; }
    if (b.state === 'offer' && Date.now() >= offerBy(b)) { rejectOffer(b, true); changed = true; }
  }
  return changed;
}

// ---------- вільний час ----------

// Чи є вільний бокс на проміжок [t, t + minutes) цього дня.
function boxFree(date, t, minutes, skip = null) {
  const p = place();
  const h = hoursFor(p, date);
  if (!h || t < h[0] || t + minutes > h[1] || inBreak(p, t, minutes)) return false;
  const busy = own().filter((b) => b !== skip && b.date === date && BLOCKING.includes(b.state) && !b.mobile)
    .filter((b) => t < toMin(b.time) + b.minutes && t + minutes > toMin(b.time)).length;
  return busy < p.boxes;
}

// Вільні вікна дня, як їх бачать клієнти: суцільні проміжки по 30 хв, де є хоч один вільний бокс.
function freeWindows(date) {
  const p = place();
  const h = hoursFor(p, date);
  if (!h || date < todayIso()) return [];
  const from = date === todayIso() ? Math.ceil(minuteNow() / 30) * 30 : h[0];
  const out = [];
  for (let t = Math.max(h[0], from); t + 30 <= h[1]; t += 30) {
    if (!boxFree(date, t, 30)) continue;
    const last = out.at(-1);
    if (last && last[1] === t) last[1] = t + 30;
    else out.push([t, t + 30]);
  }
  return out;
}

  $('.pro-sheet').classList.add('alert');
  // Вібрація дозволена лише після першого дотику до сторінки.
  if (navigator.userActivation?.hasBeenActive) navigator.vibrate?.([200, 100, 200]);
}

async function systemNotify(b) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const title = `Новий запис: ${dayWord(b.date).toLowerCase()} о ${b.time}`;
  const body = `${who(b)} · ${b.services.join(', ')} · ${uah(sumOf(b))}. Відповісти до ${clock(confirmBy(b))}`;
  const opts = { body, tag: `pending-${b.id}`, requireInteraction: true, renotify: true, icon: 'pro-icon.svg', data: { id: b.id },
    actions: [{ action: 'accept', title: 'Прийняти' }, { action: 'decline', title: 'Відмовити' }] };
  try {
    const reg = await navigator.serviceWorker?.getRegistration();
    if (reg) await reg.showNotification(title, opts);
    else new Notification(title, { body, tag: opts.tag });
  } catch { /* сповіщення недоступні — лишається шторка в застосунку */ }
}

// Кожен новий запис сповіщаємо один раз: шторка, якщо нічого не відкрито, і системне сповіщення.
const alerted = new Set();
function alertPending() {
  if (!session()) return;
  for (const b of pendingList()) {
    if (alerted.has(b.id)) continue;
    alerted.add(b.id);
    systemNotify(b);
    if (!$('#sheet-root').innerHTML) alertSheet(b);
  }
}

// Дія з системного сповіщення (або посилання #/act/...): прийняти, відмовити чи відкрити запис.
function notifyAction(action, id) {
  const b = own().find((x) => x.id === id);
  if (!b || b.state !== 'pending') { toast(b ? 'На цей запис уже відповіли' : 'Запис не знайдено'); return; }
  alerted.add(id);
  if (action === 'accept') { acceptBooking(b); save(); rerender(); toast(`Запис прийнято: ${who(b)}, ${dayWord(b.date).toLowerCase()} о ${b.time}`); }
  else if (action === 'decline') declineSheet(id);
  else alertSheet(b);
}

// Нові записи з застосунку: мийка вирішує, чи приймати їх на цей час.
function pendingBlock() {
  const list = pendingList();
  if (!list.length) return '';
  return `<section class="pending" aria-label="Нові записи">
    <h2>${list.length === 1 ? 'Новий запис — підтвердіть' : `Нові записи — підтвердіть (${list.length})`}</h2>
    ${list.map((b) => `<article class="pending-card" aria-label="Запис ${esc(who(b))}">
      <button class="pending-info" type="button" data-action="bk-open" data-id="${b.id}">
        <span class="bk-time"><b>${b.time}</b><small>${dayWord(b.date)}</small></span>
        <span class="bk-main"><b>${esc(who(b))}</b><small>${esc(b.services.join(', '))}</small><small>${esc(b.car || '')} · ${uah(sumOf(b))} оплачено</small></span>
      </button>
      <p class="pending-due">${icon('clock', 14)}<span>Відповісти до ${clock(confirmBy(b))} · залишилось ${countdown(b)}. Інакше запис скасується, гроші повернуться клієнту</span></p>
      <div class="grid2">
        <button class="btn navy" type="button" data-action="accept" data-id="${b.id}">${icon('check', 18)}Прийняти</button>
        <button class="btn" type="button" data-action="decline" data-id="${b.id}">Відмовити</button>
        <button class="btn soft full" type="button" data-action="propose" data-id="${b.id}">${icon('calendar', 16)}Запропонувати інший час</button>
      </div>
    </article>`).join('')}
    ${notifyAsk()}
  </section>`;
}

function reminders() {
  const out = [];
  const pause = pauseOf(ui.place, bookings);
  if (pause) out.push(`<a class="remind warn" href="#/profile">${icon('warn', 22)}<span><b>Онлайн-запис на паузі до ${fmtTime(pause.until)}</b>
      <small>Забагато відмов і пропущених записів. Клієнти не можуть записатися через CARCAR.</small></span>${icon('chevR', 18)}</a>`);
  else if (responseStats(ui.place, bookings).lowered) out.push(`<a class="remind warn" href="#/profile">${icon('warn', 22)}<span><b>Мийка нижче в пошуку через відмови</b>
      <small>Пропонуйте інший час замість відмови — це не рахується.</small></span>${icon('chevR', 18)}</a>`);
  const st = partnerOf(ui.place).status;
  if (st !== 'approved') out.push(`<p class="notice warn">Клієнти ще не бачать мийку: статус «${PARTNER_STATUS[st][0]}». <a href="business.html#/connect">Завершити підключення</a></p>`);
  const late = unmarked();
  if (late.length) {
    out.push(`<button class="remind warn" type="button" data-action="mark-open">${icon('warn', 22)}<span><b>${late.length} ${plural(late.length, 'запис чекає', 'записи чекають', 'записів чекають')} позначки</b>
      <small>Позначте, хто приїхав, а хто ні: так гроші надійдуть вчасно, а клієнти бачать правдивий розклад.</small></span>${icon('chevR', 18)}</button>`);
  }
  const h = hoursFor(place(), todayIso());
  if (h && !checkedToday()) {
    const free = freeWindows(todayIso());
    out.push(`<section class="remind sched" aria-label="Перевірка розкладу">${icon('calendar', 22)}<span><b>Розклад на сьогодні правильний?</b>
      <small>${free.length ? `Клієнти бачать вільним: ${windowsText(free)}.` : 'Вільного часу на сьогодні вже немає.'} Якщо когось записали по телефону чи він приїхав сам, додайте запис, щоб цей час не продали двічі.</small>
      <span class="row"><button class="btn navy" type="button" data-action="sched-ok">Так, усе вірно</button><button class="btn" type="button" data-action="nb-open">${icon('plus', 16)}Додати запис</button></span></span></section>`);
  }
  return out.length ? `<div class="reminders">${out.join('')}</div>` : '';
}

// ---------- повідомлення ----------

function threads() {
  const bk = own().filter((b) => b.chat?.length).map((b) => {
    const last = b.chat.at(-1);
    const [label, cls] = stateOf(b);
    return {
      id: `b-${b.id}`, kind: 'booking', name: who(b), at: last.at, unread: !!b.chatUnreadBiz, label, cls,
      text: `${last.from === 'biz' ? 'Ви: ' : ''}${msgPreview(last)}`,
      sub: `${b.no ? `${bookingNo(b)} · ` : ''}${dayWord(b.date)}, ${b.time} · ${b.services[0]}${b.services.length > 1 ? ` +${b.services.length - 1}` : ''}`,
      live: ACTIVE.includes(b.state),
    };
  });
  const rq = ownRequests().map((r) => {
    const last = r.messages.at(-1);
    const [label, cls] = REQ_STATE[reqState(r)];
    return {
      id: `r-${r.id}`, kind: 'request', name: r.clientName || 'Клієнт', at: last.at, unread: !!r.unreadBiz, label, cls,
      text: `${last.from === 'biz' ? 'Ви: ' : ''}${msgPreview(last)}`, sub: `Питання про послугу${r.car ? ` · ${r.car}` : ''}`,
      live: !r.closed && !r.service,
    };
  });
  return [...bk, ...rq].sort((a, b) => (b.unread - a.unread) || (b.live - a.live) || (b.at - a.at));
}

const MSG_FILTERS = [['all', 'Усі'], ['new', 'Нові'], ['booking', 'За записами'], ['request', 'Питання']];

function viewMessages() {
  const all = threads();
  const pass = (t) => (ui.filter === 'all' ? true : ui.filter === 'new' ? t.unread : t.kind === ui.filter);
  const list = all.filter(pass);
  const count = (f) => all.filter((t) => (f === 'all' ? true : f === 'new' ? t.unread : t.kind === f)).length;
  return `<h1>Повідомлення</h1>
    ${pendingBlock()}
    ${reminders()}
    <div class="chips" role="group" aria-label="Які повідомлення показати">${MSG_FILTERS.map(([f, label]) => `<button class="chip" type="button" data-action="msg-filter" data-f="${f}" aria-pressed="${ui.filter === f}">${label}${count(f) ? ` · ${count(f)}` : ''}</button>`).join('')}</div>
    ${list.length ? `<ul class="convos pro-convos">${list.map((t) => `<li><a class="convo${t.unread ? ' unread' : ''}${t.live ? '' : ' over'}" href="#/chat/${t.id}">
      <span class="avatar${t.kind === 'request' ? ' req' : ''}" aria-hidden="true">${firstLetter(t.name)}</span>
      <span class="convo-body"><span class="convo-top"><b>${esc(t.name)}</b><time>${whenShort(t.at)}</time></span>
        <span class="convo-text">${esc(t.text.length > 80 ? `${t.text.slice(0, 80).trimEnd()}…` : t.text)}</span>
        <span class="convo-meta"><span class="pill ${t.cls}">${t.label}</span><small>${esc(t.sub)}</small></span></span>
      ${t.unread ? '<span class="dot" aria-label="Нове повідомлення"></span>' : ''}</a></li>`).join('')}</ul>`
      : `<div class="pro-empty">${icon('chat', 32)}<b>${all.length ? 'Тут порожньо' : 'Повідомлень ще немає'}</b>
        <span>Клієнти пишуть сюди про оплачені записи й питають про послуги зі сторінки мийки.</span></div>`}`;
}

function bubbleHtml(m) {
  if (m.from === 'mark') return `<li class="chat-mark ${m.kind}">${icon(m.kind === 'closed' ? 'x' : 'check', 14)}<b>${esc(m.text)}</b><time>${clock(m.at)}</time></li>`;
  if (m.from === 'sys') return `<li class="bubble sys">${esc(m.text)}</li>`;
  const me = m.from === 'biz';
  const photo = safePhoto(m.photo);
  return `<li class="bubble ${me ? 'me' : 'them'}${photo ? ' has-photo' : ''}"><span class="sr-only">${me ? 'Ви' : 'Клієнт'}: </span>${photo ? `<a class="chat-photo" href="${photo}" download="foto.jpg"><img src="${photo}" alt="Фото"></a>` : ''}${m.text ? `<span class="b-text">${esc(m.text)}</span>` : ''}<time>${clock(m.at)}${me ? `<span class="ticks" aria-hidden="true">${m.readAt ? '✓✓' : '✓'}</span>` : ''}</time></li>`;
}

function threadList(msgs) {
  const lastOwn = msgs.findLast((m) => m.from === 'biz');
  let lastDay = '';
  return msgs.map((m) => {
    const day = isoDate(new Date(m.at));
    const sep = day !== lastDay ? `<li class="day-sep"><span>${dayWord(day)}</span></li>` : '';
    lastDay = day;
    return `${sep}${bubbleHtml(m)}${m === lastOwn ? `<li class="read-state${m.readAt ? ' read' : ''}">${m.readAt ? `Прочитано ${clock(m.readAt)}` : 'Не прочитано'}</li>` : ''}`;
  }).join('');
}

const compose = (thread, quick) => `<div class="chat-compose">
    ${quick ? `<div class="quick" role="group" aria-label="Швидкі відповіді">${BIZ_QUICK.map((t) => `<button class="chip" type="button" data-action="quick" data-text="${esc(t)}">${esc(t)}</button>`).join('')}</div>` : ''}
    <form class="chat-form" id="pro-chat" data-thread="${thread}">
      <label class="attach-btn">${icon('camera', 22)}<input class="sr-only" id="pro-attach" type="file" accept="image/*" aria-label="Додати фото"></label>
      <input name="text" required maxlength="500" autocomplete="off" placeholder="Повідомлення…" aria-label="Повідомлення клієнту">
      <button class="send-btn" type="submit" aria-label="Надіслати">${icon('send', 20)}</button>
    </form>
  </div>`;

function chatHead(name, sub, phone) {
  return `<header class="chat-head">
      <a class="icon-btn" href="#/" aria-label="До повідомлень">${icon('chevL', 24)}</a>
      <span class="avatar" aria-hidden="true">${firstLetter(name)}</span>
      <div class="chat-who"><h1>${esc(name)}</h1><small>${sub}</small></div>
      ${phone ? `<a class="icon-btn" href="${telHref(phone)}" aria-label="Зателефонувати клієнту">${icon('phone', 20)}</a>` : ''}
    </header>`;
}

function viewThread(arg = '') {
  const id = arg.slice(2);
  if (arg.startsWith('b-')) {
    const b = own().find((x) => x.id === id);
    if (!b) return notFound();
    const seen = readMessages(b.chat, 'client');
    if (b.chatUnreadBiz || seen) { b.chatUnreadBiz = false; save(); }
    const [label] = stateOf(b);
    const open = ACTIVE.includes(b.state);
    return `<section class="chat-screen" aria-label="Чат з ${esc(who(b))}">
      ${chatHead(who(b), `${label} · ${dayWord(b.date)}, ${b.time}`, b.clientPhone)}
      <button class="chat-pin" type="button" data-action="bk-open" data-id="${b.id}">${icon('calendar', 16)}<span>${b.no ? `${bookingNo(b)} · ` : ''}${esc(b.services.join(', '))} · ${uah(sumOf(b))}${b.car ? ` · ${esc(b.car)}` : ''}</span>${icon('chevR', 16)}</button>
      ${b.state === 'pending' ? `<div class="chat-actions"><button class="btn navy" type="button" data-action="accept" data-id="${b.id}">${icon('check', 18)}Прийняти запис</button><button class="btn" type="button" data-action="decline" data-id="${b.id}">Відмовити</button></div>` : ''}
      ${b.state === 'paid' ? `<div class="chat-actions"><button class="btn navy" type="button" data-action="ready" data-id="${b.id}">${icon('check', 18)}Машина готова</button></div>` : ''}
      <ol class="chat-msgs" aria-label="Повідомлення">${threadList(chatTimeline(b))}</ol>
      ${open ? compose(arg, true) : '<p class="chat-closed">Запис закрито — листування лише для читання.</p>'}
    </section>`;
  }
  const r = ownRequests().find((x) => x.id === id);
  if (!r) return notFound();
  const seen = readMessages(r.messages, 'client');
  if (r.unreadBiz || seen) { r.unreadBiz = false; save(); }
  const [label] = REQ_STATE[reqState(r)];
  const open = !r.closed;
  return `<section class="chat-screen" aria-label="Чат з ${esc(r.clientName || 'клієнтом')}">
    ${chatHead(r.clientName || 'Клієнт', `${label}${r.car ? ` · ${esc(r.car)}` : ''}`, r.clientPhone)}
    ${open ? `<div class="chat-actions">
      <button class="btn navy" type="button" data-action="nb-open" data-req="${r.id}">${icon('calendar', 16)}Записати</button>
      ${r.service ? '' : `<button class="btn" type="button" data-action="svc-new" data-req="${r.id}">${icon('plus', 16)}Додати послугу</button>`}
      <button class="btn" type="button" data-action="req-close" data-id="${r.id}">Закрити</button></div>` : ''}
    <ol class="chat-msgs" aria-label="Повідомлення">${threadList(r.messages)}</ol>
    ${open ? compose(arg, false) : '<p class="chat-closed">Питання закрито.</p>'}
  </section>`;
}

function sendTo(thread, text, photo = null) {
  const id = thread.slice(2);
  if (thread.startsWith('b-')) {
    const b = own().find((x) => x.id === id);
    chatPost(b, 'biz', text, 'client', photo);
    sendMessages([{ placeId: b.placeId, clientKey: 'device', channel: 'app', kind: 'chat', bookingId: b.id, text: `${place().name}: ${text || 'Фото'}`, link: `#/chat/${b.id}` }]);
  } else {
    const r = ownRequests().find((x) => x.id === id);
    r.messages.push({ from: 'biz', text, at: Date.now(), ...(photo ? { photo } : {}) });
    r.unreadClient = true;
  }
  save();
  route();
  $('#pro-chat input[name="text"]')?.focus();
}

// ---------- записи по днях ----------

const DAYS_AHEAD = 14;

function bookingRow(b) {
  const [label, cls] = stateOf(b);
  const off = ['cancelled', 'noshow', 'refunded'].includes(b.state);
  return `<li><button class="bk-row${off ? ' off' : ''}" type="button" data-action="bk-open" data-id="${b.id}">
    <span class="bk-time"><b>${b.time}</b><small>${hhmm(toMin(b.time) + b.minutes)}</small></span>
    <span class="bk-main"><b>${esc(who(b))}${b.chatUnreadBiz ? ' <span class="dot" aria-label="нове повідомлення"></span>' : ''}</b>
      <small>${esc(b.services.join(', '))}</small>${b.car ? `<small>${esc(b.car)}</small>` : ''}</span>
    <span class="bk-side"><span class="pill ${cls}">${label}</span><small>${CHANNEL[channelOf(b)]} · ${uah(sumOf(b))}</small></span>
  </button></li>`;
}

function viewBookings(day) {
  const t = todayIso();
  if (!/^\d{4}-\d\d-\d\d$/.test(day ?? '') || day < t) day = t;
  const p = place();
  const days = Array.from({ length: DAYS_AHEAD }, (_, i) => shiftDay(t, i));
  const live = (d) => own().filter((b) => b.date === d && BLOCKING.includes(b.state)).length;
  const list = own().filter((b) => b.date === day).sort((a, b) => a.time.localeCompare(b.time));
  const h = hoursFor(p, day);
  // Вільні вікна ділимо на початках записів, щоб стрічка читалась по порядку.
  const cuts = list.filter((b) => BLOCKING.includes(b.state)).map((b) => toMin(b.time));
  const free = freeWindows(day).flatMap(([s, e]) => {
    const pts = [s, ...cuts.filter((c) => c > s && c < e), e].sort((a, b) => a - b);
    return pts.slice(1).map((x, i) => [pts[i], x]).filter(([a, b]) => b > a);
  });
  // Записи й вільні вікна однією стрічкою за часом.
  const items = [...list.map((b) => [toMin(b.time), bookingRow(b), 0]),
    ...free.map(([s, e]) => [s, `<li><button class="free-row" type="button" data-action="nb-open" data-date="${day}" data-time="${hhmm(s)}">
      <span class="bk-time"><b>${hhmm(s)}</b><small>${hhmm(e)}</small></span><span class="free-text">Вільно ${duration(e - s)}</span><span class="free-add">${icon('plus', 16)}Записати</span></button></li>`, 1]),
  ].sort((a, b) => a[0] - b[0] || a[2] - b[2]).map(([, html]) => html).join('');
  const busy = list.filter((b) => BLOCKING.includes(b.state)).length;
  const special = day in scheduleOf(p).special;
  return `<h1>Записи</h1>
    ${pendingBlock()}
    ${reminders()}
    <nav class="day-strip" aria-label="Дні">${days.map((d) => {
      const n = live(d);
      const closed = !hoursFor(p, d);
      return `<a href="#/bookings/${d}" class="${closed ? 'closed' : ''}" ${d === day ? 'aria-current="date"' : ''}><small>${d === t ? 'Сьогодні' : WEEKDAYS[(parseDate(d).getDay() + 6) % 7]}</small><b>${parseDate(d).getDate()}</b><span class="n">${closed ? 'вихідний' : n ? `${n} ${plural(n, 'запис', 'записи', 'записів')}` : 'вільно'}</span></a>`;
    }).join('')}</nav>
    <div class="day-head"><div><h2>${dayWord(day, true)}</h2>
      <p class="small muted">${h ? `${rangeText(h)}${special ? ' (змінено на цей день)' : ''} · ${p.boxes} ${plural(p.boxes, 'бокс', 'бокси', 'боксів')} · ${busy} ${plural(busy, 'запис', 'записи', 'записів')}` : `Вихідний${special ? ' (закрито на цей день)' : ' за графіком'}`}</p></div>
      <div class="row">${h ? `<button class="btn soft" type="button" data-action="day-hours" data-date="${day}">Години</button><button class="btn soft" type="button" data-action="day-close" data-date="${day}">Закрити день</button>`
        : `<button class="btn navy" type="button" data-action="day-hours" data-date="${day}">Відкрити день</button>`}</div></div>
    ${items ? `<ul class="day-list">${items}</ul>` : `<div class="pro-empty">${icon('calendar', 32)}<b>${h ? 'Вільного часу вже немає' : 'Мийка не працює'}</b>
      <span>${h ? 'Усі бокси зайняті або робочий день закінчився.' : 'Клієнти не можуть записатися на цей день. Відкрийте день, якщо працюєте.'}</span></div>`}`;
}

// ---------- шторка ----------

function openSheet(title, body) {
  $('#sheet-root').innerHTML = `<div class="sheet-dim" data-action="sheet-close"></div>
    <section class="pro-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h">
      <div class="sheet-head"><h2 id="sheet-h">${title}</h2><button class="icon-btn" type="button" data-action="sheet-close" aria-label="Закрити">${icon('x', 22)}</button></div>
      <div class="sheet-body">${body}</div>
    </section>`;
  document.body.classList.add('sheet-open');
  $('.pro-sheet .icon-btn').focus();
}

function closeSheet() {
  $('#sheet-root').innerHTML = '';
  document.body.classList.remove('sheet-open');
  nb = null;
}

// ---------- картка запису ----------

function bookingSheet(id) {
  const b = own().find((x) => x.id === id);
  if (!b) return;
  const [label, cls] = stateOf(b);
  const started = bookingStart(b) <= new Date();
  let actions = '';
  if (b.state === 'pending') {
    actions = `<p class="notice warn">Клієнт оплатив запис. Підтвердіть до ${clock(confirmBy(b))} (залишилось ${countdown(b)}), інакше запис скасується, а гроші повернуться клієнту.</p>
      <div class="grid2">
        <button class="btn primary" type="button" data-action="accept" data-id="${b.id}">${icon('check', 18)}Прийняти</button>
        <button class="btn line-danger" type="button" data-action="decline" data-id="${b.id}">Відмовити</button>
        <button class="btn full" type="button" data-action="propose" data-id="${b.id}">${icon('calendar', 18)}Запропонувати інший час</button>
      </div>`;
  } else if (b.state === 'offer') {
    actions = `<p class="notice">Ви запропонували цей час замість ${dayWord(b.offer.from.date).toLowerCase()}, ${b.offer.from.time}. Клієнт відповість до ${clock(offerBy(b))}; не відповість — запис скасується, гроші повернуться йому.</p>`;
  } else if (b.state === 'booked') {
    actions = `<form class="stack" id="done-form" data-id="${b.id}" style="gap:10px">
        <div class="seg-row" role="radiogroup" aria-label="Оплата на місці">
          <label><input type="radio" name="payment" value="card" checked><span>Картка</span></label>
          <label><input type="radio" name="payment" value="cash"><span>Готівка</span></label></div>
        <label class="field"><span>Сума, ₴</span><input name="paid" type="number" min="0" inputmode="numeric" value="${b.paid}"></label>

      <div class="grid2">

        <button class="btn text-danger full" type="button" data-action="crm-cancel" data-id="${b.id}">Скасувати запис</button>
      </div>`;
  } else if (b.state === 'paid') {
    const late = Date.now() > bookingStart(b).getTime() + PAYMENT.lateMinutes * 60000;
    actions = `<button class="btn primary" type="button" data-action="ready" data-id="${b.id}">${icon('check', 18)}Машина готова</button>
      <p class="fine">Так ви підтверджуєте виконання. Клієнт отримає сповіщення, гроші ${PAYMENT.freezeHours} год чекають на випадок спору.</p>
      ${late ? `<button class="btn" type="button" data-action="late-forfeit" data-id="${b.id}">Запізнення понад ${PAYMENT.lateMinutes} хв — оплата нам</button>` : ''}
      ${started ? `<button class="btn text-danger" type="button" data-action="carcar-noshow" data-id="${b.id}">Клієнт не приїхав</button>` : ''}`;
  } else if (b.state === 'dispute') {
    actions = `<p class="notice warn"><b>Клієнт відкрив спір</b>«${esc(b.disputeReason ?? '')}». Поясніть ситуацію в <a href="business.html#/support">підтримці CARCAR</a>.</p>`;
  } else if (b.state === 'completed' && isCarcar(b)) {
    actions = `<p class="notice">${isFrozen(b) ? `Гроші стануть доступні ${fmtTime(b.unfreezeAt)}.` : 'Гроші доступні до виведення в розділі «Мийка».'}</p>`;
  }
  openSheet(`${b.time} · ${esc(who(b))}`, `
    <div class="row"><span class="pill ${cls}">${label}</span><span class="pill">${CHANNEL[channelOf(b)]}</span>${b.no ? `<span class="small muted">${bookingNo(b)}</span>` : ''}</div>
    <dl class="pro-kv">
      <dt>Коли</dt><dd>${dayWord(b.date, true)}, ${b.time}–${hhmm(toMin(b.time) + b.minutes)}</dd>
      <dt>Послуги</dt><dd>${esc(b.services.join(', '))}</dd>
      <dt>Авто</dt><dd>${esc(b.car || '—')}</dd>
      <dt>Сума</dt><dd>${uah(sumOf(b))}${isCarcar(b) ? ' · оплачено в CARCAR' : b.payment ? ` · ${b.payment === 'cash' ? 'готівка' : 'картка'}` : ' · оплата на місці'}</dd>
      ${b.note && !isCarcar(b) ? `<dt>Коментар</dt><dd>${esc(b.note)}</dd>` : ''}
    </dl>
    <div class="grid2">
      ${b.clientPhone ? `<a class="btn" href="${telHref(b.clientPhone)}">${icon('phone', 18)}Подзвонити</a>` : ''}
      ${isCarcar(b) ? `<a class="btn" href="#/chat/b-${b.id}" data-action="sheet-close">${icon('chat', 18)}Написати</a>` : ''}

// Інший час замість відмови: день і вільний час, необовʼязковий коментар. Відмовою не рахується.
function proposeSheet(id, date) {
  const b = own().find((x) => x.id === id);
  const d = date ?? b.date;
  const t = todayIso();
  const note = $('#propose-note')?.value ?? '';
  const starts = openStarts(place(), d, b.minutes, bookings, { lead: 0, skip: b }).filter((x) => !(d === b.date && x === b.time));
  openSheet(`Інший час: ${esc(who(b))}`, `
    <p class="small muted" style="margin:0">Клієнт просив ${dayWord(b.date).toLowerCase()}, ${b.time} · ${esc(b.services.join(', '))}. Оберіть час, який можете прийняти, — клієнт погодиться одним дотиком.</p>
    <div class="chips day-chips" role="group" aria-label="День">${Array.from({ length: 7 }, (_, i) => shiftDay(t, i)).map((x) => `<button class="chip" type="button" data-action="propose-day" data-id="${b.id}" data-date="${x}" aria-pressed="${x === d}" ${hoursFor(place(), x) ? '' : 'disabled'}>${dayWord(x)}</button>`).join('')}</div>
    <label class="field"><span>Коментар клієнту (необовʼязково)</span><input id="propose-note" maxlength="200" autocomplete="off" placeholder="Наприклад, о 14:30 точно буде вільний бокс" value="${esc(note)}"></label>
    ${starts.length ? `<div class="slots" role="group" aria-label="Запропонувати час">${starts.map((x) => `<button class="slot" type="button" data-action="propose-to" data-id="${b.id}" data-date="${d}" data-time="${x}">${x}</button>`).join('')}</div>`
      : '<p class="muted">На цей день вільних боксів немає — оберіть інший.</p>'}
    <p class="fine">Час одразу закріплюється за клієнтом. На відповідь у нього ${PAYMENT.offerMinutes} хв; не погодиться — гроші повернуться йому, а вам це не рахується як відмова.</p>`);
}

function moveSheet(id, date) {

    ${starts.length ? `<div class="slots" role="group" aria-label="Вільний час">${starts.map((s) => `<button class="slot" type="button" data-action="move-to" data-id="${b.id}" data-date="${d}" data-time="${s}">${s}</button>`).join('')}</div>`

// Позначити минулі записи: усе в одному списку, по кнопці на кожен.

// ---------- швидкий запис ----------

let nb = null; // чернетка нового запису

function nbOpen(prefill = {}) {
  nb = { cls: 0, services: new Set(), date: todayIso(), time: '', channel: 'phone', name: '', phone: '', car: '', ...prefill };
  if (nb.want) nb.time = nb.want;
  openSheet('Новий запис', `<form class="stack nb-form" id="nb-form" style="gap:14px" novalidate>
    <div class="seg-row" role="radiogroup" aria-label="Звідки клієнт">
      <label><input type="radio" name="channel" value="phone" ${nb.channel === 'phone' ? 'checked' : ''}><span>${icon('phone', 16)}По телефону</span></label>
      <label><input type="radio" name="channel" value="walkin" ${nb.channel === 'walkin' ? 'checked' : ''}><span>${icon('car', 16)}Приїхав сам</span></label></div>
    <label class="field"><span>Телефон</span><input name="phone" type="tel" inputmode="tel" autocomplete="off" placeholder="+380" value="${esc(nb.phone)}"></label>
    <p class="nb-hint small" id="nb-hint" aria-live="polite"></p>
    <div class="grid2">
      <label class="field"><span>Імʼя</span><input name="name" autocomplete="off" value="${esc(nb.name)}"></label>
      <label class="field"><span>Авто й номер</span><input name="car" autocomplete="off" placeholder="Golf, AA1234BB" value="${esc(nb.car)}"></label>
    </div>
    <div id="nb-dyn" class="stack" style="gap:14px"></div>
  </form>`);
  nbRender();
  nbHint();
}

const nbChosen = () => place().services.filter((s) => nb.services.has(s.id));
const nbMinutes = () => nbChosen().reduce((a, s) => a + s.min, 0) || 30;

function nbTimes() {
  const out = openStarts(place(), nb.date, nbMinutes(), bookings, { lead: 0 });
  // Клієнт уже біля боксу: «Зараз» — із поточної хвилини, якщо є вільний бокс.
  if (nb.channel === 'walkin' && nb.date === todayIso()) {
    const now = hhmm(Math.floor(minuteNow() / 5) * 5);
    if (!out.includes(now) && boxFree(nb.date, toMin(now), nbMinutes())) out.unshift(now);
  }
  return out;
}

function nbRender() {
  const p = place();
  const chosen = nbChosen();
  const total = chosen.reduce((a, s) => a + s.price[nb.cls], 0);
  const times = nbTimes();
  if (!times.includes(nb.time)) nb.time = times[0] ?? '';
  const t = todayIso();
  const nowTime = nb.channel === 'walkin' && nb.date === t ? times[0] : null;
  $('#nb-dyn').innerHTML = `
    <div><span class="lbl">Клас авто</span><div class="chips nb-chips" role="group" aria-label="Клас авто">${CAR_CLASSES.map((c, i) => `<button class="chip" type="button" data-action="nb-cls" data-i="${i}" aria-pressed="${i === nb.cls}">${c}</button>`).join('')}</div></div>
    <div><span class="lbl">Послуги</span><div class="svc-chips" role="group" aria-label="Послуги">${p.services.map((s) => `<button class="svc-chip" type="button" data-action="nb-svc" data-id="${s.id}" aria-pressed="${nb.services.has(s.id)}"><b>${esc(s.name)}</b><small>${uah(s.price[nb.cls])} · ${duration(s.min)}</small></button>`).join('')}</div></div>
    <div><span class="lbl">День</span><div class="chips nb-chips" role="group" aria-label="День">${Array.from({ length: 7 }, (_, i) => shiftDay(t, i)).map((d) => `<button class="chip" type="button" data-action="nb-day" data-date="${d}" aria-pressed="${d === nb.date}" ${hoursFor(p, d) ? '' : 'disabled'}>${dayWord(d)}</button>`).join('')}</div></div>
    <div><span class="lbl">Час</span>${times.length ? `<div class="slots" role="group" aria-label="Вільний час">${times.map((x) => `<button class="slot" type="button" data-action="nb-time" data-time="${x}" aria-pressed="${x === nb.time}">${x === nowTime && nb.channel === 'walkin' ? 'Зараз' : x}</button>`).join('')}</div>`
      : `<p class="muted small" style="margin:6px 0 0">${hoursFor(p, nb.date) ? 'Вільних боксів на цей день немає.' : 'Цього дня мийка не працює.'}</p>`}</div>
    <div class="nb-foot"><span><b>${chosen.length ? uah(total) : 'Оберіть послуги'}</b><small>${chosen.length ? duration(nbMinutes()) : ''}</small></span>
      <button class="btn primary" type="submit" ${chosen.length && nb.time ? '' : 'disabled'}>Записати${nb.time ? ` на ${nb.time}` : ''}</button></div>`;
}

// Постійний клієнт: за телефоном підтягуємо імʼя й авто з минулих записів.
function nbHint() {
  const hint = $('#nb-hint');
  if (!hint) return;
  const key = phoneKey(nb.phone);
  const past = key ? own().filter((b) => b.clientPhone && phoneKey(b.clientPhone) === key).sort((a, b) => bookingStart(b) - bookingStart(a)) : [];
  if (!past.length) { hint.textContent = ''; return; }
  const f = $('#nb-form');
  if (!nb.name && past[0].clientName) { nb.name = past[0].clientName; f.elements.name.value = nb.name; }
  if (!nb.car && past[0].car) { nb.car = past[0].car; f.elements.car.value = nb.car; }
  hint.textContent = `Постійний клієнт: ${past.length} ${plural(past.length, 'візит', 'візити', 'візитів')}, останній — ${dayLabel(past[0].date, { day: 'numeric', month: 'long' })}`;
}

function nbSubmit() {
  const p = place();
  const chosen = nbChosen();
  if (!chosen.length || !nb.time) return;
  if (nb.channel === 'phone' && !phoneKey(nb.phone)) { toast('Вкажіть телефон клієнта'); $('#nb-form [name="phone"]').focus(); return; }
  // Час могли зайняти, поки заповнювали форму (наприклад, клієнт записався в застосунку).
  if (!boxFree(nb.date, toMin(nb.time), nbMinutes())) { toast('Цей час щойно зайняли — оберіть інший'); nbRender(); return; }
  const total = chosen.reduce((a, s) => a + s.price[nb.cls], 0);
  const b = {
    id: uid(), source: 'crm', channel: nb.channel, placeId: p.id, services: chosen.map((s) => s.name), total, paid: total, bonus: 0,
    covered: 0, passUse: null, masterId: null, minutes: nbMinutes(), date: nb.date, time: nb.time,
    car: nb.car.trim() || CAR_CLASSES[nb.cls], plate: '', cls: nb.cls,
    clientName: nb.name.trim() || (nb.channel === 'walkin' ? 'Клієнт з вулиці' : 'Клієнт'), clientPhone: nb.phone.trim(), note: '',
    state: 'booked', createdAt: Date.now(),
  };
  bookings.push(b);
  save();
  closeSheet();
  location.hash = `#/bookings/${b.date}`;
  route();
  toast(`Записано: ${b.clientName}, ${dayWord(b.date).toLowerCase()} о ${b.time}`);
}

// ---------- мийка: гроші й показники ----------

function revenue(b) {
  if (b.state === 'completed') return isCarcar(b) ? price(b) : b.paid;
  if (isCarcar(b) && (b.state === 'cancelled' || b.state === 'noshow')) return b.placeAmount ?? 0;
  return 0;
}

function periodStats(days) {
  const to = todayIso();
  const from = shiftDay(to, -(days - 1));
  const list = own().filter((b) => b.date >= from && b.date <= to);
  const done = list.filter((b) => b.state === 'completed');
  const money = list.reduce((a, b) => a + revenue(b), 0);
  return { money, orders: done.length, avg: done.length ? Math.round(done.reduce((a, b) => a + sumOf(b), 0) / done.length) : 0 };
}

// Завантаження дня: зайняті хвилини боксів від робочих.
function loadPct(date) {
  const p = place();
  const h = hoursFor(p, date);
  if (!h) return null;
  const used = own().filter((b) => b.date === date && (BLOCKING.includes(b.state) || b.state === 'completed') && !b.mobile).reduce((a, b) => a + b.minutes, 0);
  return Math.min(100, Math.round((used / ((h[1] - h[0]) * p.boxes)) * 100));
}

const starsLine = (n) => `<span class="stars" role="img" aria-label="Оцінка ${rating(n)} з 5">${[1, 2, 3, 4, 5].map((i) => `<span class="${i <= Math.round(n) ? 'on' : ''}">${icon('star', 14)}</span>`).join('')}</span>`;

function viewWash() {
  const p = place();
  const t = todayIso();
  const day = periodStats(1);
  const week = periodStats(7);
  const month = periodStats(30);
  const bal = balanceFor(p.id, bookings, payouts);
  const fee = Math.round(bal.available * commissionFor(p.id));
  const r = ratingFor(p.id, reviews);
  const list = reviews.filter((x) => x.placeId === p.id).sort((a, b) => b.at - a.at);
  const waiting = list.filter((x) => !x.reply);
  const mine = payouts.filter((x) => x.placeId === p.id).sort((a, b) => b.at - a.at).slice(0, 3);
  const loadToday = loadPct(t);
  const loadTomorrow = loadPct(shiftDay(t, 1));
  return `<h1>Мийка</h1>
    <section class="tiles pro-tiles" aria-label="Виручка">
      <div class="tile hero"><span>Сьогодні</span><b>${uah(day.money)}</b><small>${day.orders} ${plural(day.orders, 'машина', 'машини', 'машин')}${loadToday === null ? '' : ` · завантаження ${loadToday}%`}</small></div>
      <div class="tile"><span>7 днів</span><b>${uah(week.money)}</b><small>${week.orders} ${plural(week.orders, 'машина', 'машини', 'машин')}</small></div>
      <div class="tile"><span>30 днів</span><b>${uah(month.money)}</b><small>середній чек ${uah(month.avg)}</small></div>
      <div class="tile"><span>Завтра</span><b>${loadTomorrow === null ? 'вихідний' : `${loadTomorrow}%`}</b><small>${loadTomorrow === null ? '' : 'боксів зайнято'}</small></div>
    </section>
    <section class="pro-card" aria-labelledby="h-money">
      <h2 id="h-money">Гроші через CARCAR</h2>
      <div class="money-row"><span>Можна вивести</span><b>${uah(bal.available)}</b></div>
      <div class="money-row"><span>Заморожено до підтвердження</span><b>${uah(bal.frozen)}</b></div>
      ${payoutReady(p.id)
        ? `<button class="btn primary block" type="button" data-action="payout" ${bal.available > 0 ? '' : 'disabled'}>${bal.available > 0 ? `Вивести ${uah(bal.available - fee)} на ${maskIban(partnerOf(p.id).payout.iban)}` : 'Немає коштів для виведення'}</button>`
        : `<a class="btn block" href="business.html#/connect">Вказати рахунок для виплат</a>`}
      <p class="fine">Комісія CARCAR ${Math.round(commissionFor(p.id) * 100)}% утримується під час виведення. Оплати на місці не обкладаються.</p>
      ${mine.length ? `<ul class="plain-list">${mine.map((x) => `<li><span>${fmtTime(x.at)}</span><b>${uah(x.net)}</b></li>`).join('')}</ul>` : ''}
    </section>
    <section class="pro-card" aria-labelledby="h-rev">
      <h2 id="h-rev">Відгуки${r.count ? ` · ${rating(r.avg)}` : ''}</h2>
      ${r.count ? `<p class="small muted" style="margin:0">${starsLine(r.avg)} ${r.count} ${plural(r.count, 'відгук', 'відгуки', 'відгуків')}${waiting.length ? ` · без відповіді: ${waiting.length}` : ''}</p>` : '<p class="small muted" style="margin:0">Відгуків ще немає. Їх залишають лише клієнти, які були у вас через CARCAR.</p>'}
      ${list.slice(0, 5).map((x) => `<article class="pro-review" aria-label="Відгук ${esc(x.name ?? 'клієнта')}">
        <div class="head"><b>${esc(x.name ?? 'Клієнт')}</b>${starsLine(x.rating)}</div>
        ${x.text ? `<p>${esc(x.text)}</p>` : ''}
        ${x.reply ? `<p class="reply"><b>Ваша відповідь</b>${esc(x.reply.text)}</p>` : `<form class="chat-form rev-reply" data-id="${x.id}"><input name="reply" required maxlength="500" autocomplete="off" placeholder="Відповісти публічно…" aria-label="Відповідь на відгук"><button class="send-btn" type="submit" aria-label="Надіслати відповідь">${icon('send', 18)}</button></form>`}

// Відмови й швидкість відповіді: від них залежить місце в пошуку CARCAR і пауза онлайн-запису.
function reliabilityCard(p) {
  const s = responseStats(p.id, bookings);
  const pause = pauseOf(p.id, bookings);
  const R = DECLINE_RULES;
  const status = pause ? `<p class="notice warn" style="margin:0"><b>Онлайн-запис на паузі до ${fmtTime(pause.until)}</b>Відмов ${ratePct(s.rate)} — більше за ${ratePct(R.pauseRate)}. Клієнти бачать мийку, але записатися через CARCAR не можуть.</p>`
    : s.lowered ? `<p class="notice warn" style="margin:0"><b>Мийка нижче в пошуку</b>Відмов ${ratePct(s.rate)} — більше за ${ratePct(R.warnRate)}. Пропонуйте інший час замість відмови, щоб повернутися вгору.</p>`
      : !s.enough ? `<p class="notice" style="margin:0">Поки мало заявок для оцінки: ${s.total} з ${R.minRequests}.</p>`
        : '<p class="notice ok" style="margin:0">Усе добре: клієнти бачать мийку у звичайному порядку.</p>';
  return `<section class="pro-card" aria-labelledby="h-rel">
      <h2 id="h-rel">Надійність для клієнтів</h2>
      <div class="rel-grid">
        <div><b>${ratePct(s.rate)}</b><small>відмов за ${R.days} днів${s.total ? ` (${s.declined} з ${s.total})` : ''}</small></div>
        <div><b>${msText(s.avgMs)}</b><small>середня відповідь на запис</small></div>
      </div>
      ${status}
      <p class="fine">Відмова — це ваша відмова або мовчання ${PAYMENT.confirmMinutes} хв. Запропонований інший час відмовою не вважається. Понад ${ratePct(R.warnRate)} відмов — мийка нижче в пошуку, від ${ratePct(R.pauseRate)} — онлайн-запис на паузі ${R.pauseHours} год після останньої відмови (якщо за ${R.days} днів не менше ${R.minRequests} заявок).</p>
    </section>`;
}

  const make = (date, s, extra) => {
    const minutes = s.reduce((a, x) => a + x.min, 0);
    const time = extra.time ?? openStarts(p, date, minutes, bookings, { lead: 0 })[extra.slot ?? 0];
    if (!time) return null;
    const total = s.reduce((a, x) => a + x.price[0], 0);

    delete b.slot;

const TABS = [['', 'Повідомлення', 'chat'], ['bookings', 'Записи', 'calendar'], ['wash', 'Мийка', 'chart'], ['profile', 'Профіль', 'car'], ['more', 'Ще', 'list']];

function renderChrome(page) {
  const badge = { '': unreadCount(), bookings: unmarked().length };
  const tabOf = page === 'chat' ? '' : page;
  $('#tabbar').innerHTML = TABS.map(([id, label, ic]) => `<a href="#/${id}" ${tabOf === id ? 'aria-current="page"' : ''}>
    <span class="tab-ic">${icon(ic, 24)}${badge[id] ? `<span class="tab-count" aria-label="${id ? 'Записи без позначки' : 'Непрочитані'}: ${badge[id]}">${badge[id]}</span>` : ''}</span>${label}</a>`).join('');
  const p = place();
  const pw = powerOf(p.id);
  $('#top').innerHTML = `<a class="pro-brand" href="#/" aria-label="CarCar Business">${logo(30)}<span><b>${esc(p.name)}</b><small>CarCar Business${pw ? ` · ${POWER[pw.state][0].toLowerCase()}` : ''}</small></span></a>`;
  const fab = $('#fab');
  fab.hidden = !['', 'bookings', 'wash'].includes(page);
  fab.innerHTML = `${icon('plus', 22)}<span>Запис</span>`;
  fab.setAttribute('aria-label', 'Новий запис');
}

function notFound() { return '<h1>Не знайдено</h1><p class="muted">Можливо, запис видалили. <a href="#/">До повідомлень</a></p>'; }

function route() {
  const s = session();
  document.body.classList.toggle('locked', !s);
  if (!s) {
    $('#view').innerHTML = viewLogin();
    $('#tabbar').innerHTML = '';
    $('#top').innerHTML = '';
    $('#fab').hidden = true;
    return;
  }
  if (s.placeId && placeById(s.placeId)) ui.place = s.placeId;
  touchPresence(ui.place);
  if (expirePending(bookings)) save();
  checkWaitlist(bookings);
  const [, page = '', arg, id] = location.hash.replace(/^#/, '').split('/');
  if (page === 'act') { alerted.add(id); history.replaceState(null, '', '#/'); route(); notifyAction(arg, id); return; }
  document.body.classList.toggle('in-chat', page === 'chat');
  renderChrome(page);
  const view = $('#view');
  if (page === '') view.innerHTML = viewMessages();
  else if (page === 'chat') view.innerHTML = viewThread(arg);
  else if (page === 'bookings') view.innerHTML = viewBookings(arg);
  else if (page === 'wash') view.innerHTML = viewWash();
  else if (page === 'profile') view.innerHTML = viewProfile();
  else if (page === 'more') view.innerHTML = viewMore();
  else view.innerHTML = notFound();
  if (page === 'chat') {
    const list = $('.chat-msgs');
    if (list) {
      list.scrollTop = list.scrollHeight;
      for (const img of list.querySelectorAll('img')) img.addEventListener('load', () => { list.scrollTop = list.scrollHeight; }, { once: true });
    }
  }
  alertPending();
  const key = `${page}/${page === 'chat' ? arg : ''}`;
  if (key !== ui.lastView && page !== 'chat') window.scrollTo(0, 0);
  ui.lastView = key;
}

function rerender() {
  const y = window.scrollY;
  route();
  window.scrollTo(0, y);
}
