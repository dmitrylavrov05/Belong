function route() {
  hideTip();
  charts = {};
  const [, page = '', arg] = location.hash.replace(/^#/, '').split('/');
  const q = queues();
  const count = { applications: bizApps().filter((a) => a.status === 'new').length, places: q.places, reviews: q.reviews, disputes: q.disputes, support: q.support, fraud: q.fraud };
  $('#nav').innerHTML = NAV.map(([id, label, ic]) => `<a href="#/${id}" ${page === id ? 'aria-current="page"' : ''}>${icon(ic, 20)}${label}
    ${count[id] ? `<span class="count" aria-label="чекають рішення: ${count[id]}">${count[id]}</span>` : ''}</a>`).join('');
  const view = $('#view');
  if (page === '') view.innerHTML = viewOverview();
  else if (page === 'applications') view.innerHTML = viewApplications();
  else if (page === 'places') view.innerHTML = arg ? viewPlace(arg) : viewPlaces();
  else if (page === 'reviews') view.innerHTML = viewReviews();
  else if (page === 'disputes') view.innerHTML = viewDisputes();
  else if (page === 'commission') view.innerHTML = viewCommission();
  else if (page === 'stats') view.innerHTML = viewStats();
  else if (page === 'promos') view.innerHTML = viewPromos();
  else if (page === 'support') view.innerHTML = viewSupport(arg);
  else if (page === 'fraud') view.innerHTML = viewFraud();
  else if (page === 'marketing') view.innerHTML = viewMarketing();
  else view.innerHTML = '<p>Сторінку не знайдено.</p>';
  mountCharts();
  enterView(view, `${page}/${arg ?? ''}` !== ui.lastView);
  ui.lastView = `${page}/${arg ?? ''}`;
}

function rerender() {
  const y = window.scrollY;
  route();
  window.scrollTo(0, y);
}

document.addEventListener('click', (e) => {
  const row = e.target.closest('tr.link-row[data-href]');
  if (row && !e.target.closest('a')) { location.hash = row.dataset.href; return; }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const { action, id } = el.dataset;
  if (action === 'app-approve') {
    approveBizApp(id).then((r) => { if (r) { applyOverrides(); rerender(); toast(`Доступ видано: логін ${r.login}`); } });
    return;
  }
  if (action === 'app-reject') {
    const reason = prompt('Причина відмови (її побачить мийка)')?.trim();
    if (!reason) return;
    rejectBizApp(id, reason);
    rerender();
    toast('Заявку відхилено');
    return;
  }
  if (action === 'period') { ui.period = Number(el.dataset.n); rerender(); }
  else if (action === 'stats-demo') {
    const n = statsDemo();
    rerender();
    toast(n ? `Згенеровано демо-активність для ${n} записів` : 'Спершу заповніть демо-історію хоча б для однієї точки в панелі бізнесу');
  } else if (action === 'stats-demo-clear') {
    store.set('analytics', events().filter((e) => !e.demo));
    rerender();
    toast('Демо-активність очищено');
  }
  else if (action === 'promo-toggle') {
    const list = promosAll().map((x) => (x.code === id ? { ...x, active: x.active === false } : x));
    savePromos(list);
    rerender();
    toast(list.find((x) => x.code === id).active ? `Промокод ${id} увімкнено` : `Промокод ${id} вимкнено`);
  }
  else if (action === 'place-filter') { ui.places = el.dataset.f; rerender(); }
  else if (action === 'support-filter') { ui.support = el.dataset.f; rerender(); }
  else if (action === 'fraud-filter') { ui.fraud = el.dataset.f; rerender(); }
  else if (action === 'fraud-demo') { fraudDemo(); rerender(); toast('Додано вигадані підозрілі відгуки, скасування й заявку точки-двійника'); }
  else if (action === 'fraud-demo-clear') { fraudDemoClear(); rerender(); }
  else if (action.startsWith('fraud-') && el.dataset.key !== undefined || action === 'fraud-unblock') {
    const st = fraudState();
    const key = el.dataset.key;
    let msg = 'Сигнал позначено як «не порушення»';
    if (action === 'fraud-hide') {
      const ids = el.dataset.ids.split(',');
      for (const r of reviews) if (ids.includes(r.id)) r.hidden = { reason: 'Підозра на накрутку', at: Date.now() };
      save();
      msg = ids.length > 1 ? `Приховано відгуків: ${ids.length}` : 'Відгук приховано';
    } else if (action === 'fraud-block') {
      for (const k of el.dataset.client.split(',')) st.blocked[k] = { at: Date.now(), reason: 'Антифрод: масові скасування чи зловживання промокодами' };
      msg = 'Онлайн-запис для профілю обмежено';
    } else if (action === 'fraud-unblock') {
      delete st.blocked[el.dataset.client];
      msg = 'Обмеження знято';
    } else if (action === 'fraud-suspend') {
      const pt = partnerOf(el.dataset.place);
      const status = pt.status === 'approved' ? 'suspended' : 'rejected';
      savePartner(el.dataset.place, { status, history: [...pt.history, { at: Date.now(), by: 'admin', status, note: 'Антифрод: підозра на фальшиву точку' }] });
      msg = status === 'suspended' ? 'Точку призупинено: клієнти її не бачать' : 'Заявку точки відхилено';
    }
    if (key) st.dismissed[key] = Date.now();
    saveFraud(st);
    rerender();
    toast(msg);
  }
  else if (action === 'mkt-demo') { marketingDemo(); rerender(); toast('Додано 4 демо-кампанії з вигаданими переходами й замовленнями'); }
  else if (action === 'mkt-demo-clear') { marketingDemoClear(); rerender(); }
  else if (action === 'mkt-copy') {
    const url = campaignLink(campaigns().find((c) => c.id === id));
    navigator.clipboard?.writeText(url).then(() => toast('Посилання скопійовано'), () => toast(url));
  }
  else if (action === 'tpl') { const ta = $('#admin-reply textarea'); ta.value = REPLY_TEMPLATES[Number(el.dataset.i)]; ta.focus(); }
  else if (action === 'ticket-close') { setTicket(id, { status: 'closed' }); rerender(); toast('Звернення закрито'); }
  else if (action === 'escalate') {
    const t = ticketsAll().find((x) => x.id === id);
    const b = bookings.find((x) => x.id === t.bookingId);
    Object.assign(b, { state: 'dispute', disputeReason: t.messages.find((m) => m.from !== 'admin')?.text ?? 'Звернення в підтримку', ticketId: b.ticketId ?? t.id });
    save();
    ticketReply(t.id, 'admin', 'Ми відкрили спір за цим записом: гроші заморожено, доки модератор не ухвалить рішення.', 'open');
    rerender();
    toast('Спір відкрито, гроші заморожено');
  }
  else if (action === 'review-filter') { ui.reviews = el.dataset.f; rerender(); }
  else if (action === 'review-restore') {
    delete reviews.find((r) => r.id === id).hidden;
    save();
    rerender();
    toast('Відгук знову видно клієнтам');
  }
});

document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr.link-row[data-href]')) location.hash = e.target.dataset.href;
});

document.addEventListener('submit', (e) => {
  const f = e.target;
  e.preventDefault();
  const d = new FormData(f);
  if (f.id === 'moderate-form') moderate(f.dataset.id, e.submitter?.value, d.get('note').trim());
  else if (f.id === 'campaign-form') {
    const name = d.get('name').trim();
    const id = name.toLowerCase().replace(/[^a-z0-9а-яіїєґ]+/gi, '-').replace(/^-|-$/g, '').slice(0, 24) || uid();
    store.set('admin.campaigns', [...campaigns(), { id: campaigns().some((c) => c.id === id) ? `${id}-${uid().slice(0, 3)}` : id, name, channel: d.get('channel'), code: d.get('code') || null,
      spend: Number(d.get('spend')) || 0, start: d.get('start') || today(), end: d.get('end') || null, createdAt: Date.now() }]);
    rerender();
    toast(`Кампанію «${name}» створено — скопіюйте посилання для реклами`);
  }
  else if (f.matches('.spend-form')) {
    store.set('admin.campaigns', campaigns().map((c) => (c.id === f.dataset.id ? { ...c, spend: Number(d.get('spend')) || 0 } : c)));
    rerender();
    toast('Бюджет оновлено');
  }
  else if (f.id === 'ltv-form') {
    store.set('admin.settings', { ...store.get('admin.settings', {}), ordersPerYear: Number(d.get('ordersPerYear')) || 6 });
    rerender();
    toast('Припущення збережено');
  }
  else if (f.id === 'admin-reply') {
    ticketReply(f.dataset.id, 'admin', d.get('text').trim(), d.get('status'));
    rerender();
    toast(d.get('status') === 'closed' ? 'Відповідь надіслано, звернення закрито' : 'Відповідь надіслано');
  }
  else if (f.id === 'promo-form') {
    const code = d.get('code').trim().toUpperCase();
    if (promosAll().some((x) => x.code === code)) { toast(`Промокод ${code} уже існує`); return; }
    const kind = d.get('kind');
    const value = Number(d.get('value'));
    if (kind === 'pct' && value > 90) { toast('Знижка у відсотках — не більше 90%'); return; }
    savePromos([...promosAll(), {
      id: code.toLowerCase(), code, title: d.get('title').trim(), kind, value, max: Number(d.get('max')) || null, minOrder: Number(d.get('minOrder')) || 0,
      cats: d.getAll('cats'), firstOnly: !!d.get('firstOnly'), auto: !!d.get('auto'), active: true, until: d.get('until') || null, limit: Number(d.get('limit')) || null, createdAt: Date.now(),
    }]);
    rerender();
    toast(`Промокод ${code} створено`);
  }
  else if (f.id === 'commission-form') {
    const v = d.get('pct');
    savePartner(f.dataset.id, { commission: v === '' ? undefined : Math.max(0, Number(v)) / 100 });
    rerender();
    toast(v === '' ? 'Точка платить загальну ставку' : `Комісію для точки встановлено: ${v}%`);
  } else if (f.id === 'base-commission') {
    store.set('admin.settings', { ...store.get('admin.settings', {}), commission: Math.max(0, Number(d.get('pct'))) / 100 });
    rerender();
    toast(`Загальну комісію встановлено: ${d.get('pct')}%`);
  } else if (f.matches('.review-mod')) {
    const r = reviews.find((x) => x.id === f.dataset.id);
    if (e.submitter?.value === 'keep') {
      r.report = { ...r.report, status: 'rejected' };
      toast('Скаргу відхилено, відгук залишається');
    } else {
      r.hidden = { reason: d.get('reason'), at: Date.now() };
      if (r.report) r.report = { ...r.report, status: 'accepted' };
      toast('Відгук приховано');
    }
    save();
    rerender();
  } else if (f.matches('.dispute-form')) {
    const b = bookings.find((x) => x.id === f.dataset.id);
    const to = d.get('to');
    const part = to === 'client' ? 0 : to === 'place' ? price(b) : Number(d.get('part'));
    if (to === 'split' && !(part > 0 && part < price(b))) { toast(`Сума точці має бути від 1 до ${price(b) - 1} ₴`); return; }
    resolveDispute(b, part, d.get('note').trim());
    save();
    notifyResolution(b, `Рішення за спором: ${to === 'client' ? 'усю суму повернено вам на баланс CARCAR' : to === 'place' ? 'оплату передано точці' : `точці ${uah(part)}, решту повернено клієнту на баланс CARCAR`}.${d.get('note').trim() ? ` ${d.get('note').trim()}` : ''}`);
    rerender();
    toast(to === 'client' ? 'Гроші повернено клієнту на баланс' : to === 'place' ? 'Гроші передано точці' : `Точці ${uah(part)}, решту повернено клієнту`);
  }
});

// Застосунок чи панель в іншій вкладці змінили дані — перечитуємо.
window.addEventListener('storage', (e) => {
  if (!e.key?.startsWith('carcar.') || e.key === 'carcar.presence') return;
  load();
  rerender();
});

$('#to-biz').innerHTML = `${icon('chevL', 18)}Панель для бізнесу`;
$('#admin-badge').innerHTML = `${icon('shield', 18)}Демо-доступ модератора: у робочій версії — лише для співробітників CARCAR із двофакторним входом`;
window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });
route();
</script>
